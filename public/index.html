<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace jeunes de Selles-sur-Cher — le Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style id="public-css">
:root{
  --cream:#FFF6EA; --paper:#FFFFFF; --ink:#1E1A24; --ink2:#5B5466; --line:#EADFD0;
  --orange:#FF7A2F; --orange-soft:#FFE6D6; --pink:#E8408C; --teal:#16A39A; --violet:#6B4CE6;
  --red:#D7263D; --red-soft:#FDE4E7; --green:#1E9E5A; --amber:#E8A20C;
  --r:18px; --shadow:0 1px 2px rgba(30,26,36,.06),0 6px 18px rgba(30,26,36,.07);
  --head:'Baloo 2',system-ui,sans-serif; --body:'Nunito Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.vis{display:block;width:100%;height:100%}

/* ---------- Page publique ---------- */
.pub{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cream)}
.pub-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#FFD23F;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:20px;transform:rotate(-4deg)}
.brand b{display:block;font-family:var(--head);font-size:20px;line-height:1;letter-spacing:-.01em}
.brand small{color:var(--ink2);font-weight:700;font-size:13px}
.info-btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.strip-wrap{position:sticky;top:0;z-index:5;background:var(--cream);padding:6px 0 10px;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip-day{flex:0 0 auto;scroll-snap-align:center;border:0;background:var(--paper);border-radius:16px;width:58px;padding:8px 0 7px;text-align:center;box-shadow:var(--shadow);line-height:1.1}
.chip-day .d1{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--ink2)}
.chip-day .d2{font-family:var(--head);font-size:24px;font-weight:800}
.chip-day .d3{font-size:11px;font-weight:700;color:var(--ink2)}
.chip-day.closed .d2{color:#B8AFA3}
.chip-day.today{outline:2px dashed var(--orange);outline-offset:-2px}
.chip-day.sel{background:var(--ink);color:#fff}
.chip-day.sel .d1,.chip-day.sel .d3{color:#FFD23F}
.month-sep{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink2);letter-spacing:.06em}
.dayview{padding:16px 16px 8px;flex:1}
.day-hero .kicker{display:inline-block;background:var(--orange-soft);color:#A3410B;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.day-hero h1{font-family:var(--head);font-size:32px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em}
.hours{display:flex;flex-wrap:wrap;gap:6px}
.hours span{background:var(--paper);border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.alert{margin:14px 0 4px;background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.35}
.closed-box{margin-top:16px;background:var(--paper);border-radius:var(--r);padding:28px 18px;text-align:center;box-shadow:var(--shadow)}
.closed-box .big{font-size:44px}
.closed-box b{display:block;font-family:var(--head);font-size:22px;margin-top:6px}
.slot-title{font-family:var(--head);font-size:19px;margin:22px 0 4px;display:flex;align-items:baseline;gap:8px}
.slot-title small{font-family:var(--body);font-size:14px;color:var(--ink2);font-weight:800}
.cards{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card.morning{box-shadow:0 0 0 2.5px var(--orange),var(--shadow)}
.card-img{position:relative;aspect-ratio:16/8;background:#eee}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.ribbon{position:absolute;top:12px;right:-34px;transform:rotate(35deg);background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:4px 40px;letter-spacing:.06em;text-transform:uppercase}
.tag-morning{position:absolute;left:10px;top:10px;background:var(--orange);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.card-body{padding:12px 14px 14px}
.cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.card h3{font-family:var(--head);font-size:22px;line-height:1.1;margin:3px 0 6px;letter-spacing:-.01em}
.when{font-weight:800;font-size:15px;margin:2px 0}
.where{font-size:14px;color:var(--ink2);font-weight:700}
.desc{margin:6px 0 0;font-size:15px;line-height:1.45;color:#3B3545}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:4px 9px;border-radius:9px;background:#F3EEE7}
.badge.free{background:#DDF4E7;color:#146B3E}
.badge.price{background:#FFF0C7;color:#7A5300}
.badge.book{background:#E8E3FF;color:#4630B0}
.badge.bus{background:#DDF1F0;color:#0D6B65}
.badge.full{background:var(--red);color:#fff}
.imp{margin:10px 0 0;color:var(--red);font-weight:800;font-size:14px;line-height:1.35}
.bring{margin-top:10px;background:#F8F4EE;border-radius:12px;padding:9px 12px}
.bring b{font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.bring ul{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.empty-day{margin-top:16px;background:var(--paper);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink2);font-weight:700;box-shadow:var(--shadow)}
.pager{display:flex;gap:10px;padding:10px 16px 18px}
.pager button{flex:1;border:0;background:var(--paper);box-shadow:var(--shadow);border-radius:14px;padding:12px;font-weight:800;font-size:15px}
.pager button:disabled{opacity:.35}
.pub-foot{padding:0 16px 28px;color:var(--ink2);font-size:13px;text-align:center;line-height:1.5}
.pub-empty{margin:40px 16px;text-align:center;color:var(--ink2);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
.sheet h2{font-family:var(--head);margin:0 0 8px;font-size:24px}
.sheet .txt{white-space:pre-wrap;line-height:1.5;font-size:15px}
.sheet .close{float:right;border:0;background:#F3EEE7;border-radius:999px;width:36px;height:36px;font-size:18px}
.contact{margin-top:14px;background:#F8F4EE;border-radius:12px;padding:12px;font-weight:800;line-height:1.6}
</style>

<style>
/* ---------- Espace créateur ---------- */
.cr{min-height:100vh;background:#F6F3EF;--cr-line:#E4DDD3}
.cr{font-size:16px}
.cr-top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:8px 12px 6px}
.cr-top .r1{display:flex;align-items:center;gap:10px}
.cr-top .app{font-family:var(--head);font-weight:800;font-size:22px;line-height:1;color:#fff;letter-spacing:-.01em}
.cr-top .ver{font-size:12px;font-weight:800;color:#FFD23F;margin-left:6px;vertical-align:2px}
.role{margin-left:auto;font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:#FFD23F;color:var(--ink);white-space:nowrap}
.role.ed{background:#9BE3C3}
.tabs{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;margin:8px -12px 0;padding:0 12px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#D9D3E0;padding:9px 14px;border-radius:11px;font-weight:800;font-size:16px;white-space:nowrap;flex:0 0 auto}
.tab.on{background:#fff;color:var(--ink)}
.cr-top .sp{flex:1}
.who{font-size:12px;color:#C9C2D1;font-weight:700}
.cr-main{padding:14px;max-width:1280px;margin:0 auto}
@media (min-width:821px){.cr-main{padding:18px}}
.h-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.h-row h1{font-family:var(--head);font-size:28px;margin:0;letter-spacing:-.02em;line-height:1.1}
.cal-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cal-bar .l1,.cal-bar .l2{display:flex;align-items:center;gap:8px}
.cal-bar .l1 h1{flex:1;text-align:center;font-family:var(--head);font-size:26px;margin:0;line-height:1.1}
.cal-bar .l2 select{flex:1;min-width:0}
@media (min-width:821px){.cal-bar{flex-direction:row;align-items:center}.cal-bar .l1{flex:1}.cal-bar .l1 h1{flex:0 1 auto;text-align:left;min-width:220px}}
.leg-row{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:16px;font-weight:700;border-top:1px solid #F0EAE2}
.leg-row:first-child{border-top:0}
.leg-row .dot{width:14px;height:14px}
.btn{border:1.5px solid var(--cr-line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#BDB3A6}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{color:var(--red)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
select.btn{appearance:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.st-todo{background:#fff;border:1.5px dashed #A79D90}
.st-draft{background:var(--amber)}
.st-pub{background:var(--green)}
.st-mod{background:#2F7BEA}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--ink2);padding:0 4px}
.cell{background:#fff;border:1.5px solid var(--cr-line);border-radius:13px;min-height:122px;padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cell:hover{border-color:var(--ink)}
.cell.out{opacity:.38}
.cell.t-vacances{background:linear-gradient(#FFF4E8,#fff 40%)}
.cell.t-off{background:#F1EEEA;border-style:dashed}
.cell.today{box-shadow:0 0 0 2px var(--orange)}
.cell .num{font-family:var(--head);font-weight:800;font-size:22px;line-height:1}
.cell .top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cell .ty{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .hr{font-size:14px;font-weight:800;color:#3B3545}
.cell .al{font-size:14px;line-height:1.25;color:#3B3545;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .al.m{color:#C2560F;font-weight:700}
.cell .more{font-size:11px;color:var(--ink2);font-weight:700}
.cell .ghost-txt{font-size:12px;color:#9B9184;font-style:italic}
.cell .stdot{position:absolute;right:8px;top:9px}
@media (max-width:820px){
  .cal{grid-template-columns:1fr}
  .cal-h{display:none}
  .cell{min-height:auto}
  .cell.out{display:none}
  .cell .num::after{content:attr(data-dn);font-family:var(--body);font-size:15px;margin-left:8px;color:var(--ink2)}
  .cell{padding:10px 12px;gap:4px}
}
/* Panneau de journée */
.scrim{position:fixed;inset:0;background:rgba(20,16,26,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#FBF9F6;z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.dr-head{padding:10px 12px;border-bottom:1px solid var(--cr-line);background:#fff}
.dr-head .r1{display:flex;align-items:center;gap:8px}
.dr-head h2{font-family:var(--head);font-size:23px;margin:0;flex:1;line-height:1.1}
.dr-head .r2 .pill{font-size:13px}
.dr-head .r2 .st{margin-left:auto}
.dr-foot{border-top:1px solid var(--cr-line);background:#fff;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.dr-foot .sec{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.dr-foot .sec::-webkit-scrollbar{display:none}
.dr-foot .sec .btn{flex:0 0 auto}
.dr-foot .pri{display:flex;gap:8px}
.dr-foot .pri .btn{flex:1 1 0;min-width:0;justify-content:center;padding:12px 8px;font-size:16px;white-space:normal;line-height:1.15;text-align:center}
.dr-foot .saving{display:block;margin:0 0 6px;text-align:right}
.dr-head .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EFEAE3}
.pill.p-draft{background:#FFF0C7;color:#7A5300}.pill.p-pub{background:#DDF4E7;color:#146B3E}.pill.p-mod{background:#E2ECFD;color:#1D57B5}.pill.p-todo{background:#EFEAE3;color:#6B6257}
.saving{font-size:12px;color:var(--ink2);font-weight:700;margin-left:auto}
.dr-body{flex:1;overflow:auto;padding:12px 14px 24px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:5px}
.in,textarea.in,select.in{width:100%;border:1.5px solid var(--cr-line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea.in{min-height:64px;resize:vertical}
.in.t{width:auto;padding:6px 8px;font-weight:800}
.in.red{color:var(--red);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;cursor:pointer;user-select:none;padding:4px 0}
.sw input{appearance:none;width:42px;height:24px;border-radius:999px;background:#D8D0C5;position:relative;transition:.15s;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked{background:var(--green)}
.sw input:checked::after{left:21px}
.slot{background:#fff;border:1.5px solid var(--cr-line);border-radius:16px;margin:14px 0;overflow:hidden}
.slot-head{display:flex;align-items:center;gap:6px;padding:9px 10px;background:#F4F0EA;border-bottom:1.5px solid var(--cr-line);flex-wrap:wrap}
.slot-head .lbl{flex:1;min-width:110px}
.slot-acts{padding:8px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:10px;align-items:center;border:1.5px solid var(--cr-line);border-radius:12px;padding:6px;background:#fff;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.m{border-left:5px solid var(--orange)}
.act .th{width:72px;height:44px;border-radius:9px;overflow:hidden;flex:0 0 auto}
.act .th img{width:100%;height:100%;object-fit:cover}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .tx small{display:block;font-size:14px;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .tools{display:flex;gap:2px}
.ico{border:0;background:transparent;width:30px;height:30px;border-radius:8px;font-size:15px;display:grid;place-items:center}
.ico:hover{background:#EFEAE3}
.add-act{width:100%;border:2px dashed #CFC5B8;background:transparent;border-radius:12px;padding:14px;font-weight:800;color:#6B6257;font-size:16px}
.add-act:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.empty-slot{color:#9B9184;font-size:14px;text-align:center;padding:6px 0 0}
/* Modales */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,26,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#FBF9F6;border-radius:20px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal.sm{width:min(440px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--cr-line);background:#fff}
.mh h3{font-family:var(--head);font-size:22px;margin:0;flex:1;line-height:1.1}
.mb{padding:14px 16px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--cr-line);background:#fff;flex-wrap:wrap}
.steps{font-size:12px;font-weight:800;color:var(--ink2)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat-tile{border:0;border-radius:16px;padding:16px 12px;text-align:left;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .1s}
.cat-tile:hover{transform:translateY(-2px)}
.cat-tile .e{font-size:30px}
.cat-tile b{font-family:var(--head);font-size:18px;line-height:1.1}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tpl{border:1.5px solid var(--cr-line);background:#fff;border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.tpl:hover{border-color:var(--ink)}
.tpl .im{aspect-ratio:16/7;overflow:hidden}
.tpl .im img{width:100%;height:100%;object-fit:cover}
.tpl .bd{padding:8px 10px 10px}
.tpl .bd b{display:block;font-size:15px;line-height:1.2}
.tpl .bd small{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:3px}
.tpl.blank{border-style:dashed;align-items:center;justify-content:center;min-height:120px;font-weight:800;color:#6B6257}
.mini-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mini-badges span{font-size:11px;font-weight:800;background:#F3EEE7;border-radius:6px;padding:2px 6px}
.form-grid{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:700px){.form-grid{grid-template-columns:1fr}}
.vis-pick{border-radius:14px;overflow:hidden;aspect-ratio:16/9;position:relative;cursor:pointer;border:0;padding:0;width:100%}
.vis-pick img{width:100%;height:100%;object-fit:cover}
.vis-pick .chg{position:absolute;bottom:8px;right:8px;background:rgba(20,16,26,.75);color:#fff;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px}
.seg{display:inline-flex;background:#EFEAE3;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-weight:800;font-size:13.5px;color:#5B5466}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.box{background:#fff;border:1.5px solid var(--cr-line);border-radius:14px;padding:10px 12px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .in{flex:1;min-width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;background:#F3EEE7;border-radius:999px;padding:5px 6px 5px 11px;font-size:13.5px;font-weight:700}
.chipx button{border:0;background:#E3DBD0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sugg button{border:1.5px dashed #CFC5B8;background:transparent;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;color:#6B6257}
.sugg button:hover{border-color:var(--ink);color:var(--ink)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{border:2.5px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:none;aspect-ratio:16/9;position:relative}
.pick.on{border-color:var(--ink)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11.5px;font-weight:800;padding:10px 6px 4px;text-align:left}
.sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:14px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1.5px solid var(--cr-line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Paramètres */
.panel{background:#fff;border:1.5px solid var(--cr-line);border-radius:18px;padding:14px 16px;margin-bottom:16px}
.panel h2{font-family:var(--head);font-size:21px;margin:0 0 4px}
.panel .hint{color:var(--ink2);font-size:15px;margin:0 0 10px;line-height:1.45}
.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:5px 4px;text-align:left;font-size:14px}
.ptable th{font-size:12px;text-transform:uppercase;color:var(--ink2)}
.ptable td:nth-child(2){width:38%}
@media (max-width:640px){
  .ptable thead{display:none}
  .ptable tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;padding:10px 0;border-top:1px solid #F0EAE2}
  .ptable tr:first-child{border-top:0}
  .ptable td{padding:0;width:auto!important}
  .ptable td:nth-child(1){grid-column:1}
  .ptable td:nth-child(2){grid-column:2/4}
  .ptable td:nth-child(3){grid-column:1}
  .ptable td:nth-child(4){grid-column:2}
  .ptable td:nth-child(5){grid-column:3;grid-row:2}
  .ptable .in.t{width:100%}
}.ptable td:nth-child(2) .in{min-width:130px}
@media (max-width:520px){.act .th{width:50px;height:34px}.act .tools .ico{width:26px}.drawer .dr-body{padding:12px 10px 40px}}
.wk{display:grid;grid-template-columns:110px 70px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid #F0EAE2}
.wk:first-of-type{border-top:0}
.wk .dn{font-weight:800;padding-top:6px}
.wk .sl{display:flex;flex-direction:column;gap:6px}
.wk .sl .row{flex-wrap:nowrap}
@media (max-width:640px){
  .wk{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .wk .sl{grid-column:1/-1}
  .wk .sl .row{flex-wrap:wrap}
  .wk .sl .row .in.t[type=time]{flex:0 0 auto;width:8.2em}
  .wk .sl .row .ico{margin-left:auto}
  .wk .sl .row .in.t[data-wf=label]{flex:1 1 100%;order:3;width:auto!important;min-width:0}
}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0;overflow-wrap:anywhere}
.panel .row .in{min-width:0}
.sticky-save{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:8px;pointer-events:none}
.sticky-save>*{pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}
/* Aperçu téléphone */
.phone{width:390px;max-width:100%;height:780px;border:12px solid var(--ink);border-radius:44px;overflow:auto;background:var(--cream);margin:0 auto;position:relative}
.phone .pub{min-height:100%}
.phone .sheet-bg{position:absolute}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:90;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.err{background:var(--red)}
.loading{padding:60px 20px;text-align:center;color:var(--ink2);font-weight:700}
.note{background:#FFF8E6;border:1.5px solid #F2DDA5;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:14px}
.kbd{font-size:14px;color:var(--ink2)}
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement du programme…</div></div>

<script id="public-lib">
/* Bibliothèque publique : dates, visuels, rendu de la page publique.
   Ce bloc est aussi recopié tel quel dans l'export HTML autonome. */
(function(){
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONTHS_S=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DAYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const DAYS_S=['lun','mar','mer','jeu','ven','sam','dim'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
const fmtLong=s=>{const d=parse(s);return cap(DAYS[dow(s)])+' '+d.getDate()+(d.getDate()===1?'er':'')+' '+MONTHS[d.getMonth()]};
const fmtT=t=>{if(!t)return'';const [h,m]=t.split(':');return (+h)+'h'+(m&&m!=='00'?m:'')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=n=>{if(n===''||n==null||isNaN(+n))return'';const v=+n;return (Number.isInteger(v)?v:v.toFixed(2).replace('.',','))+' €'};

/* Catégories d'activités */
const CATS={
  sport:   {label:'Activité sportive', emoji:'⚽', color:'#13998F', visual:'ballon'},
  jeux:    {label:'Jeux collectifs',   emoji:'🎯', color:'#6B4CE6', visual:'cible'},
  creation:{label:'Création & DiY',    emoji:'🎨', color:'#E8408C', visual:'peinture'},
  cuisine: {label:'Cuisine',           emoji:'🍳', color:'#F07B1E', visual:'brunch'},
  sortie:  {label:'Sortie',            emoji:'🚌', color:'#2F7BEA', visual:'bus'},
  soiree:  {label:'Soirée',            emoji:'🪩', color:'#3A2C8F', visual:'disco'},
  bienetre:{label:'Bien-être',         emoji:'🪷', color:'#C9578E', visual:'soin'},
  culture: {label:'Culture & médias',  emoji:'🎬', color:'#D23C3C', visual:'cine'},
  projet:  {label:'Projet & staff',    emoji:'🧰', color:'#4E5866', visual:'staff'},
  sejour:  {label:'Nuitée & séjour',   emoji:'🏕️', color:'#2E8B4A', visual:'tente'}
};

/* Stock de visuels : clé, emoji, libellé, dégradé, catégories associées */
const VIS_LIST=[
 ['ballon','⚽','Ballon / sport co','#18B4A8','#0B6E8C','sport jeux'],
 ['tennis','🎾','Tennis','#A8D53B','#1E8F5A','sport'],
 ['basket','🏀','Basket','#FF8A3D','#B63C1E','sport'],
 ['dojo','🥋','Dojo / jeux au tapis','#3E4A61','#121826','sport jeux'],
 ['forme','🏋️','Remise en forme','#22A6B3','#2B5876','sport bienetre'],
 ['piscine','🏊','Piscine','#2EC5F0','#1565C0','sortie sport'],
 ['canoe','🛶','Canoë / rafting','#3BB3E0','#1B6F4C','sortie sport sejour'],
 ['patinoire','⛸️','Patinoire','#9AD9F5','#4A6FD8','sortie sport'],
 ['bowling','🎳','Bowling','#B04BE0','#3A1C8F','sortie jeux'],
 ['velo','🚲','Vélo','#7CC85A','#2E7D32','sport sortie'],
 ['rando','🥾','Randonnée','#8FB35A','#4E6B2C','sortie sejour sport'],
 ['montagne','⛰️','Montagne','#7FA7D9','#3C5A8C','sejour sortie'],
 ['tente','🏕️','Camp / bivouac','#4CAF6A','#1F5E3A','sejour'],
 ['valise','🧳','Séjour','#F2A65A','#B5562C','sejour sortie'],
 ['nuit','🌙','Nuitée / veillée','#3C3B8F','#0F1035','sejour soiree'],
 ['manege','🎢','Parc d\'attractions','#FF5E7E','#7B2FF7','sortie'],
 ['parc','🌴','Parc aquatique','#30C9A7','#0E7C86','sortie'],
 ['bus','🚌','Sortie en minibus','#4C8DF6','#1E3E9E','sortie'],
 ['carte','🗺️','Exploration','#E9B949','#B1702A','sortie sejour'],
 ['cible','🎯','Jeux d\'équipe','#8A6CF0','#4A2FB8','jeux sport'],
 ['cartes','🃏','Jeux de société','#E5484D','#7A1A3A','jeux'],
 ['des','🎲','Jeux / défis','#F59E0B','#C2410C','jeux'],
 ['enigme','🕵️','Grand jeu / énigme','#5B5F97','#22223B','jeux culture'],
 ['trophee','🏆','Tournoi','#F7C948','#C77D10','jeux sport'],
 ['manette','🎮','Jeux vidéo','#7B5CFA','#2D1B69','jeux culture'],
 ['peinture','🎨','Peinture / fresque','#F06292','#8E24AA','creation'],
 ['couture','🧵','Couture','#F48FB1','#C2185B','creation'],
 ['bricolage','🔨','Bricolage / DiY','#F4A259','#8C4A1E','creation projet'],
 ['citrouille','🎃','Halloween','#FF8F1F','#4A1D6B','creation soiree'],
 ['modelage','🏺','Modelage','#D9A27B','#8D5524','creation'],
 ['photo','📷','Photo','#6C7A89','#2C3E50','creation culture'],
 ['brunch','🍳','Brunch / repas partagé','#FFC857','#E9724C','cuisine'],
 ['recette','🍲','Recette du mois','#F29E4C','#B23A48','cuisine'],
 ['gateau','🧁','Pâtisserie','#FFB5C2','#E05780','cuisine'],
 ['burger','🍔','Fast-food','#F6AE2D','#C1440E','cuisine sortie'],
 ['choco','☕','Chocolat chaud','#B07D62','#4E342E','cuisine culture'],
 ['disco','🪩','Boule disco','#9D4EDD','#240046','soiree'],
 ['dj','🎧','DJ / concert','#00B4D8','#3A0CA3','soiree culture'],
 ['micro','🎤','Karaoké / scène','#FF4D6D','#590D22','soiree culture'],
 ['fete','🎉','Fête','#FFB703','#FB5607','soiree'],
 ['coeur','💘','Soirée entre ami·e·s','#FF7AA2','#B0175B','soiree'],
 ['ongles','💅','Nail art','#FF9EC7','#C2185B','bienetre creation'],
 ['makeup','💄','Maquillage','#F78FA7','#9E2A5E','bienetre'],
 ['soin','🧖','Moment pour soi','#9ED8DB','#467599','bienetre'],
 ['lotus','🪷','Zen / relaxation','#C3AED6','#6B4E9B','bienetre'],
 ['cine','🎬','Ciné','#E63946','#1D3557','culture soiree'],
 ['theatre','🎭','Théâtre','#C1121F','#3D0A0A','culture'],
 ['camera','🎥','Tournage / vidéo','#4361EE','#14213D','culture projet'],
 ['musique','🎵','Musique / mix','#06D6A0','#118AB2','culture'],
 ['danse','💃','Danse','#FF5D8F','#7209B7','culture'],
 ['livre','📚','Devoirs / temps calme','#8ECAE6','#219EBC','culture'],
 ['staff','🧰','Staff / organisation','#6C757D','#343A40','projet'],
 ['fusee','🚀','Projets des jeunes','#5E60CE','#48BFE3','projet'],
 ['reunion','🗣️','Réunion / temps collectif','#F4A261','#2A9D8F','projet'],
 ['etoile','⭐','Événement','#FFD23F','#EE4266','soiree projet']
];
const VIS={};VIS_LIST.forEach(([k,e,l,c1,c2,cats])=>VIS[k]={key:k,emoji:e,label:l,c1,c2,cats:cats.split(' ')});
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function visualSVG(key){
  const v=VIS[key]||VIS.etoile, h=hash(v.key);
  let deco='';
  for(let i=0;i<8;i++){
    const x=(h>>>(i*2))%320, y=((h>>>(i*3+1))*7)%180, r=6+((h>>>i)%26), o=(0.07+((h>>>(i+3))%9)/100).toFixed(2);
    deco+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${o}"/>`;
  }
  return `<svg class="vis" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(v.label)}"><defs><linearGradient id="g-${v.key}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${v.c1}"/><stop offset="1" stop-color="${v.c2}"/></linearGradient></defs><rect width="320" height="180" fill="url(#g-${v.key})"/>${deco}<circle cx="160" cy="90" r="60" fill="#fff" opacity=".2"/><text x="160" y="93" text-anchor="middle" dominant-baseline="central" font-size="76">${v.emoji}</text></svg>`;
}
function actImage(a,opts){
  if(a&&a.asset&&!(opts&&opts.noAssets))return `<img src="${window.EJ_ASSET_BASE||'/_blob/'}${esc(a.asset)}" alt="" loading="lazy">`;
  return visualSVG((a&&a.visual)||(CATS[a&&a.cat]||{}).visual||'etoile');
}
function whenText(a){
  const t=a.timing||{};
  if(t.mode==='range'&&(t.start||t.end))return '🕑 '+(t.start&&t.end?fmtT(t.start)+' – '+fmtT(t.end):t.start?'à partir de '+fmtT(t.start):'jusqu\'à '+fmtT(t.end));
  if(t.mode==='depart'&&(t.start||t.end))return '🚦 '+[t.start?'départ '+fmtT(t.start):'',t.end?'retour '+fmtT(t.end):''].filter(Boolean).join(' · ');
  return '';
}
function priceText(p){
  p=p||{};
  if(p.mode==='single')return euro(p.amount)||'Payant';
  if(p.mode==='ccv2cc')return [p.cc!==''&&p.cc!=null?'CCV2CC '+euro(p.cc):'',p.hc!==''&&p.hc!=null?'Hors comm. '+euro(p.hc):''].filter(Boolean).join(' · ')||'Payant';
  if(p.mode==='qf')return p.text||'Selon quotient familial';
  return 'Gratuit';
}
const PUBLICS={tous:'Tout public',preados:'Pré-ados (6e–4e)',ados:'Ados (3e et +)'};
function badgesHTML(a){
  const b=[];
  if(a.full)b.push('<span class="badge full">Complet</span>');
  if(a.booking&&a.booking.on)b.push(`<span class="badge book">📋 Sur réservation${a.booking.places?' · '+esc(a.booking.places)+' places':''}</span>`);
  if(a.transport)b.push('<span class="badge bus">🚍 Transport assuré</span>');
  const pm=(a.price||{}).mode||'free';
  if(pm==='free'){ if(a.booking&&a.booking.on) b.push('<span class="badge free">Gratuit</span>'); }
  else b.push(`<span class="badge price">🤑 ${esc(priceText(a.price))}</span>`);
  return b.length?`<div class="badges">${b.join('')}</div>`:'';
}
function cardHTML(a,opts){
  const c=CATS[a.cat]||{label:'Activité',emoji:'⭐'};
  const w=whenText(a);
  const pub=a.publics&&a.publics!=='tous'?' · '+esc(PUBLICS[a.publics]):'';
  return `<article class="card${a.morning?' morning':''}">
    <div class="card-img">${actImage(a,opts)}${a.full?'<span class="ribbon">Complet</span>':''}${a.morning?'<span class="tag-morning">☀️ Le matin</span>':''}</div>
    <div class="card-body">
      <div class="cat">${c.emoji} ${esc(c.label)}${pub}</div>
      <h3>${esc(a.title||'Activité')}</h3>
      ${w?`<div class="when">${esc(w)}</div>`:''}
      ${a.place?`<div class="where">📍 ${esc(a.place)}</div>`:''}
      ${a.desc?`<p class="desc">${esc(a.desc)}</p>`:''}
      ${badgesHTML(a)}
      ${a.closedDuring?'<p class="imp">💥 L\'accueil est fermé pendant cette sortie</p>':''}
      ${a.important?`<p class="imp">📣 ${esc(a.important)}</p>`:''}
      ${a.bring&&a.bring.length?`<div class="bring"><b>🎒 À prévoir</b><ul>${a.bring.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div></article>`;
}
function periodOf(date,periods){
  return (periods||[]).find(p=>p.start&&p.end&&date>=p.start&&date<=p.end)||null;
}
function hoursHTML(day){
  if(day.closed)return '';
  const s=(day.slots||[]).filter(x=>x.start||x.end);
  if(!s.length)return '';
  return `<div class="hours">${s.map(x=>`<span>🕑 ${x.label?esc(x.label)+' ':''}${fmtT(x.start)} – ${fmtT(x.end)}</span>`).join('')}</div>`;
}
function dayHTML(day,settings,opts){
  const per=periodOf(day.date,settings&&settings.periods);
  let h=`<section class="day-hero">${per?`<span class="kicker">${esc(per.name)}</span>`:''}${opts&&opts.statusOf?opts.statusOf(day.date):''}<h1>${esc(fmtLong(day.date))}</h1>${hoursHTML(day)}</section>`;
  if(day.note)h+=`<div class="alert">💥 ${esc(day.note)}</div>`;
  if(day.closed){
    h+=`<div class="closed-box"><div class="big">🔒</div><b>L'accueil est fermé</b>${day.closedReason?`<p>${esc(day.closedReason)}</p>`:''}</div>`;
  }
  const slots=day.slots||[];
  const total=slots.reduce((n,s)=>n+(s.acts||[]).length,0);
  if(!total&&!day.closed)h+=`<div class="empty-day">Pas d'activité programmée pour l'instant.<br>L'accueil est ouvert : passe nous voir ! 👋</div>`;
  slots.forEach(s=>{
    if(!(s.acts||[]).length)return;
    if(slots.filter(x=>(x.acts||[]).length).length>1)h+=`<h2 class="slot-title">${esc(s.label||'Accueil')} <small>${fmtT(s.start)} – ${fmtT(s.end)}</small></h2>`;
    h+=`<div class="cards">${s.acts.map(a=>cardHTML(a,opts)).join('')}</div>`;
  });
  return h;
}

/* Monte la page publique dans un conteneur. data = {days:{date:day}, settings} */
function mountPublic(root,data,opts){
  opts=opts||{};
  const st={days:{},settings:{},sel:null,sheet:false};
  let touchX=null;
  function keys(){return Object.keys(st.days).sort()}
  function render(){
    const ks=keys(), info=(st.settings&&st.settings.info)||{};
    const today=iso(new Date());
    if(!ks.length){
      root.innerHTML=`<div class="pub">${headHTML(info)}<div class="pub-empty">Le programme arrive bientôt ✨<br>Reviens un peu plus tard !</div>${footHTML(info)}</div>${st.sheet?sheetHTML(info):''}`;
      return;
    }
    if(!st.sel||!st.days[st.sel])st.sel=ks.find(k=>k>=today)||ks[ks.length-1];
    const i=ks.indexOf(st.sel), day=st.days[st.sel];
    let strip='',lastM=null;
    ks.forEach(k=>{
      const d=parse(k);
      if(d.getMonth()!==lastM){strip+=`<span class="month-sep">${MONTHS_S[d.getMonth()]}</span>`;lastM=d.getMonth()}
      const dd=st.days[k];
      strip+=`<button class="chip-day${k===st.sel?' sel':''}${k===today?' today':''}${dd.closed?' closed':''}" data-day="${k}"><div class="d1">${DAYS_S[dow(k)]}</div><div class="d2">${d.getDate()}</div><div class="d3">${(dd.slots||[]).reduce((n,s)=>n+(s.acts||[]).length,0)||'–'} act.</div></button>`;
    });
    root.innerHTML=`<div class="pub">${headHTML(info)}
      <div class="strip-wrap"><nav class="strip" aria-label="Jours du programme">${strip}</nav></div>
      <main class="dayview">${dayHTML(day,st.settings,opts)}</main>
      <div class="pager"><button data-go="-1" ${i<=0?'disabled':''}>‹ Jour précédent</button><button data-go="1" ${i>=ks.length-1?'disabled':''}>Jour suivant ›</button></div>
      ${footHTML(info)}</div>${st.sheet?sheetHTML(info):''}`;
    const sel=root.querySelector('.chip-day.sel');
    if(sel&&sel.scrollIntoView)sel.parentNode.scrollLeft=sel.offsetLeft-sel.parentNode.clientWidth/2+29;
  }
  function headHTML(info){
    return `<header class="pub-head"><div class="brand"><span class="logo">EJ</span><div><b>${esc(info.name||'Espace jeunes')}</b><small>${esc(info.sub||'le Programme des animations')}</small></div></div><button class="info-btn" data-info="1">Infos</button></header>`;
  }
  function footHTML(info){
    return `<footer class="pub-foot">${esc(info.footer||'Programme susceptible d\'être modifié en fonction de la météo, des envies, des opportunités.')}</footer>`;
  }
  function sheetHTML(info){
    return `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="Informations"><button class="close" data-close="1" aria-label="Fermer">✕</button><h2>Infos pratiques</h2>
      <div class="txt">${esc(info.text||'')}</div>
      ${info.phone||info.email||info.address?`<div class="contact">${info.address?'📍 '+esc(info.address)+'<br>':''}${info.phone?'📞 '+esc(info.phone)+'<br>':''}${info.email?'✉️ '+esc(info.email):''}</div>`:''}
    </div></div>`;
  }
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-day],[data-go],[data-info],[data-close]');
    if(!t)return;
    if(t.dataset.close){ if(e.target===t||t.classList.contains('close')){st.sheet=false;render()} return; }
    if(t.dataset.info){st.sheet=true;render();return}
    if(t.dataset.day){st.sel=t.dataset.day;render();scrollTop();return}
    if(t.dataset.go){move(+t.dataset.go)}
  });
  function scrollTop(){const sc=opts.scroller||window;try{sc.scrollTo({top:0,behavior:'smooth'})}catch(_){}}
  function move(n){const ks=keys(),i=ks.indexOf(st.sel)+n;if(i>=0&&i<ks.length){st.sel=ks[i];render();scrollTop()}}
  root.addEventListener('touchstart',e=>{if(e.target.closest('.strip'))return;touchX=e.touches[0].clientX},{passive:true});
  root.addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>70)move(dx<0?1:-1)},{passive:true});

  update(data||{});

}
window.EJ={MONTHS,MONTHS_S,DAYS,DAYS_S,pad,iso,parse,addDays,dow,cap,fmtLong,fmtT,esc,euro,CATS,VIS,VIS_LIST,visualSVG,actImage,whenText,priceText,PUBLICS,badgesHTML,cardHTML,periodOf,dayHTML,mountPublic};
})();

<script id="cf-store">
/* ===== Stockage Cloudflare : l'API /api (Pages Functions + base D1) =====
   - Visiteurs : GET /api/public (aucun compte).
   - Créateur : jeton APP_TOKEN (secret Cloudflare), collé une fois et gardé sur cet appareil. */
(function(){
  if(window.claude&&window.claude.use)return; // sur claude.ai : base de données Claude
  const LS='ej-cf-token';
  let token=null;try{token=localStorage.getItem(LS)}catch(e){}
  window.EJ_ASSET_BASE='/api/img/';
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const err=(code,message)=>Object.assign(new Error(message||code),{code});
  const auth=()=>({'Authorization':'Bearer '+token});
  let canEdit=false;
  const store={settings:null,library:null,drafts:{},public:{}};
  const listeners={settings:[],library:[],drafts:[],public:[]};
  let loaded=null;
  function load(){
    if(!loaded)loaded=(async()=>{
      const r=canEdit?await fetch('/api/all',{headers:auth(),cache:'no-store'}):await fetch('/api/public',{cache:'no-store'});
      if(!r.ok)throw err('unavailable','API '+r.status);
      const d=await r.json();
      if(canEdit)Object.assign(store,{settings:d.settings,library:d.library,drafts:d.drafts||{},public:d.public||{}});
      else{store.public=d.days||{};store.settings=d.settings||null}
    })();
    return loaded;
  }
  const notify=k=>listeners[k].forEach(f=>{try{f()}catch(e){console.error(e)}});
  function route(path){
    if(path==='config/settings')return ['settings'];
    if(path==='config/library')return ['library'];
    const p=path.split('/');if(p.length===2&&(p[0]==='drafts'||p[0]==='public'))return [p[0],p[1]];
    throw new TypeError('chemin non géré : '+path);
  }
  async function write(path,data){
    if(!canEdit)throw err('invalid_argument','lecture seule');
    const [k,key]=route(path);
    if(key){if(data===null)delete store[k][key];else store[k][key]=clone(data)}else store[k]=clone(data);
    setTimeout(()=>notify(k),0);
    let r;
    try{r=await fetch('/api/doc',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify({path,data})})}
    catch(e){throw err('unavailable','réseau')}
    if(r.status===401){window.EJ_CF.expired();throw err('invalid_argument','session expirée')}
    if(!r.ok)throw err(r.status===413?'quota_exceeded':'unavailable','API '+r.status);
  }
  const snap=(k,key)=>{const v=key?store[k][key]:store[k];return {id:key||k,exists:v!=null,data:()=>clone(v),metadata:{fromCache:false,hasPendingWrites:false}}};
  function sub(k,fn,onErr){listeners[k].push(fn);load().then(fn,e=>onErr&&onErr(e));return()=>{listeners[k]=listeners[k].filter(x=>x!==fn)}}
  const db={
    doc(path){const [k,key]=route(path);return {path,id:key||k,get:async()=>{await load();return snap(k,key)},
      set:d=>write(path,d),update:d=>write(path,Object.assign(clone(snap(k,key).data()||{}),d)),delete:()=>write(path,null),
      onSnapshot:(next,onErr)=>sub(k,()=>next(snap(k,key)),onErr)}},
    collection(k){if(!['drafts','public'].includes(k))throw new TypeError('collection non gérée : '+k);
      return {path:k,doc:id=>db.doc(k+'/'+id),onSnapshot:(next,onErr)=>sub(k,()=>{const docs=Object.keys(store[k]).sort().map(x=>snap(k,x));next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}})},onErr)}}
  };
  // Réduit l'image (1600 px max, JPEG) avant envoi
  async function shrink(file){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q=0.82,d=c.toDataURL('image/jpeg',q);
      while(d.length>1300000&&q>0.4){q-=0.12;d=c.toDataURL('image/jpeg',q)}
      return d.split(',')[1];
    }finally{URL.revokeObjectURL(url)}
  }
  const assets={async upload(file){
    const data=await shrink(file);
    const r=await fetch('/api/img',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify({type:'image/jpeg',data})});
    if(!r.ok)throw err('unavailable','API '+r.status);
    return await r.json();
  }};
  const ready=(async()=>{
    if(!token)return;
    try{const r=await fetch('/api/me',{headers:auth(),cache:'no-store'});canEdit=r.ok;if(r.status===401){try{localStorage.removeItem(LS)}catch(e){}token=null}}
    catch(e){canEdit=false}
  })();
  window.claude={use:async name=>{
    await ready;
    if(name==='db')return db;
    if(name==='user')return {canEdit:async()=>canEdit,isOwner:async()=>canEdit,can:async()=>canEdit};
    if(name==='assets')return canEdit?assets:null;
    return null;
  }};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  window.EJ_CF={
    logout(){try{localStorage.removeItem(LS)}catch(e){}location.hash='';location.reload()},
    expired(){if(!window.EJ_CF._warned){window.EJ_CF._warned=true;try{localStorage.removeItem(LS)}catch(e){}alert('Le jeton n\'est plus valide : reconnecte-toi.');location.reload()}},
    async backup(){
      const r=await fetch('/api/backup',{headers:auth()});if(!r.ok)throw new Error('API '+r.status);
      const blob=await r.blob(),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='sauvegarde-programme-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    },
    async restore(file){
      const txt=await file.text();

      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('API '+r.status));return j.restored;
    },
    renderLogin(app){
      const dg=getDel();
      const h=(location.hash||'').slice(1);
      if(dg&&h!=='acces-admin')return renderDelegue(app,dg);
      const ask=h==='acces';
      app.innerHTML=`<div class="cr"><header class="cr-top"><div class="r1"><span class="app">AppProg<span class="ver">${window.EJ_VERSION||''}</span></span><span class="role" style="background:#D9D3E0">Connexion</span></div></header>
      <div class="cr-main" style="max-width:520px">
        <div class="seg" style="margin-bottom:12px"><button data-m="ask" class="${ask?'on':''}">Demander un accès</button><button data-m="adm" class="${ask?'':'on'}">Administrateur</button></div>
        ${ask?`<section class="panel"><h2>🙋 Demander un accès</h2>
          <p class="hint">Ta demande est envoyée à l'administrateur de l'Espace jeunes. Une fois acceptée, tu pourras consulter ce qu'il t'a ouvert depuis cet appareil.</p>
          <form id="askf"><div class="row"><label class="fld" style="flex:1"><span>Prénom</span><input class="in" id="ap" autocomplete="given-name" required></label><label class="fld" style="flex:1"><span>Nom</span><input class="in" id="an" autocomplete="family-name" required></label></div>
          <label class="fld"><span>Adresse mail</span><input class="in" id="am" type="email" autocomplete="email" required></label>
          <p id="aerr" style="color:var(--red);font-weight:800;min-height:1.2em;margin:4px 0"></p>
          <div class="row"><button class="btn pri" type="submit">Envoyer la demande</button><a class="btn ghost" href="#">← Page publique</a></div></form></section>`
        :`<section class="panel"><h2>🔐 Jeton d'accès</h2>
          <p class="hint">Colle le jeton <b>APP_TOKEN</b> défini dans Cloudflare. Il reste enregistré sur cet appareil jusqu'à « Se déconnecter ».</p>
          <form id="cflogin"><label class="fld"><span>Jeton</span><input class="in" id="cfpw" type="password" autocomplete="off" autofocus></label>
          <p id="cferr" style="color:var(--red);font-weight:800;min-height:1.2em;margin:4px 0"></p>
          <div class="row"><button class="btn pri" type="submit">Se connecter</button><a class="btn ghost" href="#">← Page publique</a></div></form></section>`}
      </div></div>`;
      app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.m==='ask'?'acces':'createur'});
      const lf=app.querySelector('#cflogin');
      if(lf)lf.onsubmit=async e=>{
        e.preventDefault();const out=app.querySelector('#cferr'),t=app.querySelector('#cfpw').value.trim();if(!t)return;out.textContent='Vérification…';
        try{
          const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+t},cache:'no-store'});
          if(!r.ok){const j=await r.json().catch(()=>({}));out.textContent=j.error||'Jeton non reconnu.';return}
          try{localStorage.setItem(LS,t)}catch(e){}location.hash='createur';location.reload();
        }catch(e){out.textContent='Serveur injoignable.'}
      };
      const af=app.querySelector('#askf');
      if(af)af.onsubmit=async e=>{
        e.preventDefault();const out=app.querySelector('#aerr');out.textContent='Envoi…';
        const k=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>('0'+x.toString(16)).slice(-2)).join('');
        try{
          const r=await fetch('/api/acces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:app.querySelector('#ap').value,nom:app.querySelector('#an').value,email:app.querySelector('#am').value,k})});
          const j=await r.json().catch(()=>({}));
          if(!r.ok){out.textContent=j.error||'Envoi impossible.';return}
          setDel({id:j.id,k});renderDelegue(app,getDel());
        }catch(e){out.textContent='Serveur injoignable.'}

    mountToken(el,{toast,confirmBox}){
      const t=token||'';
      el.innerHTML=`<h2>🔑 Token de sauvegarde</h2>
        <p class="hint">Ce jeton (secret <b>APP_TOKEN</b> dans Cloudflare) donne l'accès <b>administrateur</b> sur cet appareil. Sans lui, l'appareil n'affiche que la page publique.</p>
        <div class="row"><input class="in" id="tkv" type="password" value="${esc(t)}" autocomplete="off" style="font-family:monospace"><button class="btn" id="tkshow" title="Afficher">👁️</button></div>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="tksave">Enregistrer le jeton</button><button class="btn warn" id="tkdel">Retirer de cet appareil</button></div>`;
      const v=el.querySelector('#tkv');
      el.querySelector('#tkshow').onclick=()=>{v.type=v.type==='password'?'text':'password'};
      el.querySelector('#tksave').onclick=async()=>{
        const n=v.value.trim();if(!n||n===token){toast('Jeton inchangé');return}
        const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+n},cache:'no-store'}).catch(()=>null);
        if(!r||!r.ok){toast('Ce jeton n\'est pas reconnu',true);return}

      };
      el.querySelector('#tkdel').onclick=async()=>{

      el.innerHTML=`<h2>👥 Accès des utilisateurs</h2>

    const days=Object.assign({},d.public,d.drafts);

  }
  window.EJ_GH=window.EJ_CF; // même point d'entrée pour l'écran de connexion
})();

<script>

(function(){
