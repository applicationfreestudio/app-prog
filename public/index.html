<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace jeunes de Selles-sur-Cher — le Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="public-css">
:root{
  --cream:#F5F4F1; --paper:#FFFFFF; --ink:#141317; --ink2:#6A6772; --line:#E5E2DC;
  --orange:#E0662F; --orange-soft:#FBEBE2; --pink:#C2477A; --teal:#1E8C84; --violet:#5B4BC4;
  --red:#C42B3A; --red-soft:#FBE9EB; --green:#1F8A4C; --amber:#D99A12;
  --r:16px; --shadow:0 1px 2px rgba(20,19,23,.05);
  --ig:linear-gradient(45deg,#F9CE34 0%,#EE2A7B 55%,#6228D7 100%);
  --lift:0 1px 1px rgba(20,19,23,.04),0 6px 18px -8px rgba(20,19,23,.22);
  --hi:inset 0 1px 0 rgba(255,255,255,.75);
  --head:'Inter',system-ui,-apple-system,Segoe UI,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;cursor:pointer}
.vis{display:block;width:100%;height:100%}

/* ---------- Page publique ---------- */
.pub{--pf:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;--top:0px;--hh:74px;font-family:var(--pf);max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cream)}
.pub-head{position:sticky;top:var(--top);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--hh);padding:0 18px;background:rgba(245,244,241,.72);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(20,19,23,.06)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px;letter-spacing:.02em;flex:0 0 auto;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 0 4px #EE2A7B}
.logo.img{background:#fff}
.logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink2);font-weight:400;font-size:13px;margin-top:1px}
.info-btn{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift);border-radius:12px;padding:0 14px;height:38px;font-weight:500;font-size:14px;flex:0 0 auto}
.days{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column;gap:30px}
.day{scroll-margin-top:calc(var(--top) + var(--hh) + 10px)}
.dgrid{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:start}
.dcol{position:sticky;top:calc(var(--top) + var(--hh) + 12px)}
.cal-ico{width:76px;border-radius:16px;overflow:hidden;text-align:center;display:flex;flex-direction:column;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}
.cal-ico .m{background:var(--ig);color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.cal-ico .d{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;padding:7px 0 0}
.cal-ico .w{font-size:12px;font-weight:500;color:var(--ink2);padding:2px 0 7px}
.cal-ico .h{border-top:1px dashed #E2DED8;padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;font-size:14px;gap:1px;font-weight:600;line-height:1.15}
.cal-ico .h .to{color:var(--ink2);font-weight:500}
.cal-ico .h .to::before{content:"↓";display:block;font-size:10px;color:#B5B1AA;line-height:1.1}
.cal-ico .h i{display:block;width:18px;height:1px;background:var(--line);margin:5px 0}
.cal-ico .h .off{color:var(--ink2);font-weight:500;font-size:13px}
.acts{min-width:0;display:flex;flex-direction:column;gap:12px}
.cards{display:flex;flex-direction:column;gap:12px}
.alert{display:flex;gap:10px;align-items:flex-start;background:#FFF4F2;color:var(--red);border-radius:10px;padding:11px 13px;font-weight:500;font-size:15px;line-height:1.4;box-shadow:inset 0 0 0 1px rgba(196,43,58,.18)}
.alert .warn{flex:0 0 28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 3px rgba(196,43,58,.25)}
.closed-box{background:var(--paper);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink2);box-shadow:var(--lift)}
.closed-box b{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px}
.slot-title{font-size:14px;font-weight:500;color:var(--ink2);display:flex;gap:8px;margin-top:4px}
.card{background:var(--paper);border:1px solid rgba(20,19,23,.06);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:104px minmax(0,1fr);box-shadow:var(--lift)}
.card.morning{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(45deg,#F9CE34,#FA7E1E) border-box}
.card-img{position:relative;background:#eee;min-height:110px}
.card-img img,.card-img .vis{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-body{padding:13px 14px 14px;min-width:0}
.tag-morning{display:inline-block;font-size:13px;font-weight:500;color:#E06A12;margin-bottom:2px}
.card h3{font-size:19px;font-weight:600;line-height:1.2;margin:0 0 5px;letter-spacing:-.01em}
.when{font-weight:500;font-size:14px;margin:1px 0}
.where{font-size:14px;color:var(--ink2)}
.desc{margin:5px 0 0;font-size:14px;line-height:1.5;color:#3E3B44}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:4px 8px;border-radius:5px;background:#F4F2EE;color:#3E3B44;box-shadow:inset 0 0 0 1px rgba(20,19,23,.08)}
.badge.full{background:var(--red);color:#fff;box-shadow:none}
.badge.ico{padding:4px 6px}
.imp,.bring{display:flex;gap:7px;align-items:flex-start;margin:8px 0 0;font-size:14px;line-height:1.4}
.imp{color:var(--red);font-weight:500}
.bring{color:#3E3B44}
.bring b{font-weight:600;color:var(--ink)}
.em{flex:0 0 auto;font-size:15px;line-height:1.3}
.empty-day{background:var(--paper);border-radius:var(--r);padding:20px 16px;text-align:center;color:var(--ink2);font-size:15px;box-shadow:var(--lift)}
.past-btn{align-self:center;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink2);box-shadow:var(--hi)}
.stl .pill{font-family:var(--body)}
.pub-foot{padding:18px 16px 30px;color:var(--ink2);font-size:13px;text-align:center;line-height:1.5}
.pub-empty{margin:40px 16px;text-align:center;color:var(--ink2)}
.sheet-bg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;font-family:var(--pf,'Poppins',system-ui,sans-serif);background:rgba(20,19,23,.32);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);animation:shFade .2s ease-out}
.sheet{position:relative;width:100%;max-width:440px;max-height:min(82vh,680px);display:flex;flex-direction:column;border-radius:22px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:0 30px 70px -20px rgba(98,40,215,.45),0 12px 30px -12px rgba(238,42,123,.35);animation:shPop .26s cubic-bezier(.2,.9,.3,1.2)}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid #F0EDE8}
.sh-t{flex:1;min-width:0}
.sheet h2{margin:0;font-size:20px;font-weight:600;line-height:1.2}
.sh-t small{display:block;color:var(--ink2);font-size:13px}
.sheet .txt{white-space:pre-wrap;line-height:1.6;font-size:15px;padding:14px 18px 6px;overflow:auto}
.sheet .close{flex:0 0 auto;border:0;background:#F4F2EE;border-radius:12px;width:36px;height:36px;font-size:15px;box-shadow:var(--hi)}
.contact{margin:10px 16px 16px;background:#F7F5F2;border-radius:14px;padding:10px 12px;line-height:1.5;font-size:15px;display:flex;flex-direction:column;gap:6px}
.contact div{display:flex;gap:10px;align-items:center}
.contact span{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 2px rgba(20,19,23,.08);flex:0 0 auto}
@keyframes shFade{from{opacity:0}to{opacity:1}}
@keyframes shPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:430px){.card{grid-template-columns:86px minmax(0,1fr)}.card-body{padding:12px 12px 13px}}
@media (max-width:380px){.dgrid{grid-template-columns:66px minmax(0,1fr);gap:10px}.cal-ico{width:66px}.cal-ico .d{font-size:28px}.card{grid-template-columns:84px minmax(0,1fr)}.card h3{font-size:18px}}
@media (min-width:600px){.dgrid{grid-template-columns:88px minmax(0,1fr);gap:18px}.cal-ico{width:88px}.card{grid-template-columns:140px minmax(0,1fr)}}

/* barre du haut : toujours visible, sous l'encoche éventuelle */
.pub-head{padding-top:env(safe-area-inset-top)}
.pub-head .hb{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.fs-btn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(20,19,23,.1);background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:var(--hi),0 1px 2px rgba(20,19,23,.06);flex:0 0 auto}
.fs-btn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;box-shadow:none}
.psep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink2);margin:2px 0 -14px}
.psep::before,.psep::after{content:"";flex:1;height:1px;background:var(--line)}
.psep span{padding:4px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.psep.vac span{background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;border:1.5px solid transparent;box-shadow:none;color:var(--ink)}
.card{position:relative}
.full-tag{position:absolute;top:10px;right:10px;z-index:2;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;box-shadow:0 2px 6px -2px rgba(196,43,58,.5)}
.card .badges{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:5px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:14px}
.brand>div{min-width:0}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badges::-webkit-scrollbar{display:none}
.card .badge{white-space:nowrap;flex:0 0 auto}
.cal-ico .h small{font-size:11px;font-weight:400;color:var(--ink2)}
.cal-ico .h span{white-space:nowrap}
.realview{position:fixed;inset:0;z-index:200;background:var(--cream);overflow:auto}
.realview .pub{--top:0px}
.rv-exit{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:210;border:0;border-radius:999px;padding:11px 18px;background:rgba(20,19,23,.86);color:#fff;font:500 14px/1 var(--body);box-shadow:0 8px 24px -6px rgba(20,19,23,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* --- v8 : étiquettes, horaires, alerte, infos pratiques, partenaires --- */
.card h3{font-weight:700}
.when{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when i{flex:0 0 6px;height:6px;border-radius:50%;background:var(--ig)}
.badges{align-items:center;gap:5px;margin-top:8px}
.badge{font-size:12px;line-height:1.25;padding:2px 7px;border-radius:5px}
.bus{font-size:15px;line-height:1;flex:0 0 auto;display:inline-flex;align-items:center;height:20px}
.imps{margin-top:12px;padding-top:10px;border-top:1px dashed #ECE8E2}
.imps .imp{margin:0}
.imps .imp+.imp{margin-top:6px}
.cal-ico{width:86px}
.dgrid{grid-template-columns:86px minmax(0,1fr)}
.cal-ico .h{font-size:12.5px;padding:7px 2px 8px}
.cal-ico .h span{white-space:nowrap}
.alert{background:none;box-shadow:none;padding:2px 0 0;color:var(--red);font-weight:600;font-size:16px;line-height:1.35;align-items:center;gap:10px}
.alert .warn{flex:0 0 24px;width:24px;height:24px;filter:drop-shadow(0 2px 4px rgba(238,42,123,.3))}
.sheet .txt{font-size:16px;line-height:1.5}
.sheet .txt p{margin:0 0 .5em}
.sheet .txt .emo{font-size:1.25em;line-height:1;vertical-align:-.08em}
.partners{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 22px;margin:0 0 14px}
.partners img{height:40px;max-width:120px;object-fit:contain}
@media (max-width:380px){.cal-ico{width:76px}.dgrid{grid-template-columns:76px minmax(0,1fr)}.cal-ico .h{font-size:11.5px}}
@media (min-width:600px){.cal-ico{width:92px}.dgrid{grid-template-columns:92px minmax(0,1fr)}}

.card .badges{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}
.when{font-size:13.5px}
@media (max-width:430px){
  .dgrid{grid-template-columns:90px minmax(0,1fr);gap:10px}
  .cal-ico{width:90px}
  .cal-ico .h{font-size:11.5px;letter-spacing:-.01em}
  .card{grid-template-columns:70px minmax(0,1fr)}
  .card-img{min-height:90px}
  .card-body{padding:11px 11px 12px}
  .card h3{font-size:17.5px}
  .when{font-size:13px}
}

/* --- v10 --- */
.when i{background:var(--ac,#EE2A7B)}
.card h3{margin-bottom:2px}
.desc{margin:2px 0 4px;font-size:13.5px;color:var(--ink2)}
.card .badges{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);padding-right:12px}
.card .badges::-webkit-scrollbar{display:none}
.badge .sep{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45;margin:0 6px;vertical-align:middle}
.card{grid-template-columns:110px minmax(0,1fr)}
@media (max-width:430px){.card{grid-template-columns:56px minmax(0,1fr)}.card-img{min-height:80px}.badge{font-size:11.5px;padding:2px 6px}}
@media (min-width:600px){.card{grid-template-columns:120px minmax(0,1fr)}}
.card.isfull h3{padding-right:72px}

/* --- v12 : carte image + en-tête, infos sur toute la largeur --- */
.card,.card.morning{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-areas:"img head" "info info";gap:10px 12px;padding:10px}
.card-img{grid-area:img;width:72px;height:72px;min-height:0;border-radius:12px;overflow:hidden;align-self:start}
.card-head{grid-area:head;min-width:0;align-self:center}
.card-info{grid-area:info;min-width:0;border-top:1px solid #F1EEEA;padding-top:9px}
.card-info .badges{margin-top:0;flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}
.card-info .bring{margin-top:8px}
.card-info .bring:first-child{margin-top:0}
.card-info .imps{margin-top:9px;padding-top:8px}
.card-info>.imps:first-child{margin-top:0;padding-top:0;border-top:0}
.card h3{font-size:18px;margin:0 0 2px}
.desc{font-size:14.5px;line-height:1.4;margin:1px 0 4px;color:var(--ink2)}
.when{font-size:14px;font-weight:500}
.when i{display:none}
.card.isfull h3{padding-right:64px}
.full-tag{top:10px;right:10px}
.alert{justify-content:center;text-align:center;color:#9A5B00;font-weight:600;font-size:16px;padding:4px 6px 2px}
.alert .bang{font-size:26px;font-weight:800;line-height:1;background:linear-gradient(180deg,#FFD84D,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent;flex:0 0 auto}
.night{display:block;margin-top:8px;text-align:center;font-size:12px;font-weight:600;color:#fff;padding:4px 6px;border-radius:9px;background:linear-gradient(135deg,#2B1B6B,#6228D7 60%,#EE2A7B);box-shadow:0 4px 12px -4px rgba(98,40,215,.55);white-space:nowrap}
@media (max-width:430px){.card,.card.morning{grid-template-columns:64px minmax(0,1fr);padding:9px}.card-img{width:64px;height:64px}.card h3{font-size:17px}.badge{font-size:12px}}
@media (min-width:600px){.card,.card.morning{grid-template-columns:96px minmax(0,1fr)}.card-img{width:96px;height:96px}}

/* --- v13 --- */
.card,.card.morning{grid-template-columns:minmax(0,1fr) 72px;grid-template-areas:"head img" "info info";padding:0;gap:0}
.card-img{grid-area:img;width:72px;height:72px;border-radius:0 0 0 16px;align-self:start}
.card-head{padding:11px 12px 10px 13px;align-self:start}
.card-info{margin:0 13px;padding:9px 0 12px}
.card.morning .card-img{border-radius:0 0 0 14px}
.card-head .tags{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.card-head .tags .tag-morning{margin:0}
.card-head .full-tag{position:static;font-size:11.5px;padding:2px 7px}
.card{overflow:visible}
.card-img{overflow:hidden;border-top-right-radius:calc(var(--r) - 1px)}
.card.isfull h3{padding-right:0}
@media (max-width:430px){.card,.card.morning{grid-template-columns:minmax(0,1fr) 66px}.card-img{width:66px;height:66px}}
@media (min-width:600px){.card,.card.morning{grid-template-columns:minmax(0,1fr) 92px}.card-img{width:92px;height:92px}}
.night{font-weight:400;font-size:12px;letter-spacing:.01em;background:linear-gradient(45deg,#D9AE14 0%,#D01C68 55%,#5220BE 100%);box-shadow:0 3px 8px -4px rgba(98,40,215,.45);padding:3px 6px}
.dnote{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12.5px;font-weight:500;line-height:1.3;color:#9A5B00}
.dnote .warn{width:22px;height:22px}
.fs-btn:not(.dark){border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}
.sheet .txt{font-size:15px}
.sheet .txt .emo{font-size:19px}
.sheet .txt p,.desc,.bring>span,.imp>span,.closed-box,.empty-day,.contact .adr p{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.contact .adr{align-items:flex-start}
.contact .adr p{margin:3px 0 0;line-height:1.45}

/* --- v14 --- */
.card,.card.morning{grid-template-columns:72px minmax(0,1fr);grid-template-areas:"img head" "info info";border:1px solid rgba(20,19,23,.06);background:var(--paper);overflow:hidden;padding:0;gap:0}
.card-img{grid-area:img;width:72px;height:72px;border-radius:0 0 14px 0;align-self:start}
.card.morning .card-img{border-radius:0 0 14px 0}
.card.noinfo{grid-template-areas:"img head"}
.card.noinfo .card-img{height:100%;min-height:72px;border-radius:0;align-self:stretch}
.card-head{padding:11px 13px 10px 13px}
.card-info{grid-area:info;margin:0;border-top:0;padding:9px 13px 12px calc(72px + 13px);position:relative}
.card-info::before{content:"";position:absolute;top:0;left:calc(72px + 13px);right:13px;height:1px;background:#EEEAE4}
.card-info .badges,.card-info .bring,.card-info .imps{margin-left:calc(-72px)}
.when{display:flex;align-items:center;gap:4px 7px;flex-wrap:wrap}
.when .wt{white-space:nowrap}
.when .bus{height:auto;font-size:15px}
.when .full-tag{position:static;margin-left:auto;font-size:11.5px;padding:2px 7px;flex:0 0 auto}
.badge .sep{margin:0 7px;width:4px;height:4px}
.sheet .txt p,.desc,.bring>span,.imp>span,.closed-box,.empty-day,.contact .adr p{text-align:left;-webkit-hyphens:manual;hyphens:manual}
.j,.j>span{text-align:justify!important}
.dnote{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:15px;font-weight:600;line-height:1.35;color:#9A5B00;margin:0;padding:10px 12px;border-radius:16px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}
.dnote .warn{flex:0 0 24px;width:24px;height:24px}

<script id="public-lib">
/* Bibliothèque publique : dates, visuels, rendu de la page publique.
   Ce bloc est aussi recopié tel quel dans l'export HTML autonome. */
(function(){
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONTHS_S=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DAYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const DAYS_S=['lun','mar','mer','jeu','ven','sam','dim'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';

  return s.map(x=>(x.label?x.label+' ':'')+rng(x.start,x.end)).join(' · ');
}
function dayHTML(day,settings,opts){
  const d=parse(day.date);
  const sl=day.closed?[]:(day.slots||[]).filter(x=>x.start||x.end);
  const U=opts&&opts.until, d2=U?parse(U):null, sameM=!U||(d.getMonth()===d2.getMonth());
  const head=U?`<div class="m">${MONTHS_S[d.getMonth()].replace('.','')}${sameM?'':' – '+MONTHS_S[d2.getMonth()].replace('.','')}</div><div class="rng2"><span><small>du</small> ${DAYS_S[dow(day.date)]}. ${d.getDate()}${sameM?'':' '+MONTHS_S[d.getMonth()]}</span><span><small>au</small> ${DAYS_S[dow(U)]}. ${d2.getDate()}${sameM?'':' '+MONTHS_S[d2.getMonth()]}</span></div>`
    :`<div class="m">${MONTHS_S[d.getMonth()].replace('.','')}</div><div class="d">${d.getDate()}</div><div class="w">${DAYS_S[dow(day.date)]}.</div>`;
  const left=`<aside class="dcol"><div class="cal-ico${day.closed?' shut':''}${U?' multi':''}"${day.closed&&day.closedReason?` title="${esc(day.closedReason)}"`:''}>${head}
    <div class="h">${day.closed?'<span class="off">Fermé</span>':(()=>{
      const hasActs=(day.slots||[]).some(x=>(x.acts||[]).length);
      const lab=(day.slots||[]).some(x=>(x.start||x.end)&&x.label&&String(x.label).trim());
      const rgH=(a,b)=>a&&b?`<span class="rg"><span><small>de</small> ${fmtTH(a)}</span><span><small>à</small> ${fmtTH(b)}</span></span>`:a?`<span class="rg"><span><small>à partir de</small> ${fmtTH(a)}</span></span>`:b?`<span class="rg"><span><small>jusqu'à</small> ${fmtTH(b)}</span></span>`:'';
      if(lab)return slotRanges(day).map(([a,b,s])=>rgH(a,b)+(s.label&&String(s.label).trim()?`<span class="slbl">${esc(lc1(s.label))}</span>`:'')).join('<i></i>');
      return dayRanges(day).map(([a,b])=>rgH(a,b)).join('<i></i>')||'';
    })()}</div></div>${(()=>{if(day.closed)return '';const hasActs=(day.slots||[]).some(x=>(x.acts||[]).length);if(!hasActs)return '';
      const ims=(day.slots||[]).filter(x=>(x.start||x.end)&&(x.visual||x.asset));
      return ims.length?`<div class="slot-ims n${Math.min(ims.length,3)}">${ims.map(x=>`<span class="si">${actImage({visual:x.visual,asset:x.asset},opts)}</span>`).join('')}</div>`:''})()}${isNight(day)?`<span class="night"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#FCD34D"/></svg>${esc(cap(LBL.night))}</span>`:''}</aside>`;
  let r='';
  if(opts&&opts.statusOf)r+=`<div class="stl">${opts.statusOf(day.date)}</div>`;
  if(day.note)r+=`<div class="dnote"><svg class="warn" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><defs><linearGradient id="wy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs><path d="M10.3 3.6a2 2 0 0 1 3.4 0l8 13.6a2 2 0 0 1-1.7 3H4a2 2 0 0 1-1.7-3z" fill="url(#wy)" stroke="url(#wy)" stroke-width="1.8" stroke-linejoin="round"/><rect x="11" y="8.6" width="2" height="5.8" rx="1" fill="#5A3A00"/><circle cx="12" cy="17.1" r="1.2" fill="#5A3A00"/></svg><span>${esc(lc1(day.note))}</span></div>`;
  const slots=day.slots||[];
  const total=slots.reduce((n,s)=>n+(s.acts||[]).length,0);
  const dayHasActs=(day.slots||[]).some(x=>(x.acts||[]).length);
  const imgSlot=x=>!dayHasActs&&(x.visual||x.asset)&&(x.start||x.end)&&!day.closed;
  if(!total&&!day.closed&&!slots.some(imgSlot))r+=`<div class="empty-day">Pas d'activité programmée. L'établissement est ouvert : passe nous voir.</div>`;
  const multi=slots.filter(x=>(x.acts||[]).length||imgSlot(x)).length>1;
  slots.forEach(s=>{
    if(imgSlot(s)){r+=`<div class="cards">${cardHTML({id:'sl-'+(s.id||''),title:s.label||'Établissement ouvert',cat:'',visual:s.visual,asset:s.asset,timing:{mode:'none'},bring:[]},Object.assign({},opts,{date:day.date}))}</div>`;return}
    if(!(s.acts||[]).length)return;
    if(multi)r+=`<div class="slot-title">${esc(s.label||'Ouverture')} <span>${rng(s.start,s.end)}</span></div>`;
    r+=`<div class="cards">${s.acts.map(a=>cardHTML(a,Object.assign({},opts,{date:day.date}))).join('')}</div>`;
  });
  return `<section class="day" id="j-${day.date}"><div class="dgrid">${left}<div class="acts">${r}</div></div></section>`;
}

/* Monte la page publique dans un conteneur. data = {days:{date:day}, settings}
   Les journées s'empilent ; le cartouche calendrier de chaque jour reste collé sous le bandeau puis glisse dessous. */
function mountPublic(root,data,opts){
  opts=opts||{};
  const st={days:{},settings:{},sheet:false,past:false};
  function logoHTML(info){
    if(info.logo&&!opts.noAssets)return `<span class="logo img"><img src="${window.EJ_ASSET_BASE||'/_blob/'}${esc(info.logo)}" alt=""></span>`;
    const ini=(info.name||'Espace jeunes').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<span class="logo">${esc(ini)}</span>`;
  }
  function headHTML(info,wm){
    return `<header class="pub-head">${wm?wm.replace('class="wm ','class="wm wm-in '):''}<div class="brand">${logoHTML(info)}<div><b>${esc(info.name||'Espace jeunes')}</b><small>${esc(info.sub||'le Programme des animations')}</small></div></div><div class="hb"><button class="info-btn" data-info="1">Infos</button>${opts.noFs?'':fsBtn()}</div></header>`;
  }
  function footHTML(info){
    const pl=(info.partners||[]).filter(Boolean);
    const logos=(pl.length&&!opts.noAssets)||info.partnersText?`<div class="partners-box">${pl.length&&!opts.noAssets?`<div class="partners">${pl.map(id=>`<img src="${window.EJ_ASSET_BASE||'/_blob/'}${esc(id)}" alt="" loading="lazy">`).join('')}</div>`:''}${info.partnersText?`<p>${esc(info.partnersText).replace(/\n/g,'<br>')}</p>`:''}</div>`:'';
    const af=(info.actFooter||'Programme susceptible d\'être modifié en fonction de la météo, des envies, des opportunités.').trim();
    const ft=(info.footer||'').trim();
    return `<footer class="pub-foot">${logos}${ft&&ft!==af?`<div>${esc(ft)}</div>`:''}</footer>`;
  }
  function richText(t){
    return String(t||'').split('\n').map(l=>l.trim()?`<p${l.length>=90?' class="j"':''}>${esc(l).replace(/(\p{Extended_Pictographic}\uFE0F?)/gu,'<span class="emo">$1</span>')}</p>`:'<p class="gap"></p>').join('');
  }
  function sheetHTML(info){
    const font=FONTS[info.font]?info.font:'Poppins';
    return `<div class="sheet-bg" data-close="1" style="--pf:'${font}',system-ui,sans-serif"><div class="sheet" role="dialog" aria-modal="true" aria-label="Infos pratiques">
      <div class="sh-head">${logoHTML(info)}<div class="sh-t"><h2>Infos pratiques</h2><small>${esc(info.name||'Espace jeunes')}</small></div><button class="close" data-close="1" aria-label="Fermer">✕</button></div>
      <div class="txt">${richText(info.text)}</div>
      ${info.phone||info.email||info.address?`<div class="contact">${info.address?`<div class="adr"><span>📍</span><p>${esc(info.address).replace(/\n/g,'<br>')}</p></div>`:''}${info.phone?`<div><span>📞</span>${esc(info.phone)}</div>`:''}${info.email?`<div><span>✉️</span>${esc(info.email)}</div>`:''}</div>`:''}
    </div></div>`;
  }
  function split(day){
    // retire les séjours et les activités épinglées de la journée
    const stays=[], d=JSON.parse(JSON.stringify(day));
    d.slots=(d.slots||[]).map(s=>Object.assign(s,{acts:(s.acts||[]).filter(a=>{if(a.pinned)return false;if(a.cat==='sejour'){stays.push(a);return false}return true})}));
    const left=d.slots.reduce((n,s)=>n+s.acts.length,0), had=(day.slots||[]).reduce((n,s)=>n+(s.acts||[]).length,0);
    return {d,stays,skip:had>0&&left===0&&!d.note&&!d.closed};
  }
  function stayHTML(a,date){
    const end=a.endDate&&a.endDate>date?a.endDate:date, d1=parse(date), d2=parse(end);
    const sameM=d1.getMonth()===d2.getMonth()&&d1.getFullYear()===d2.getFullYear();
    const m=sameM?MONTHS_S[d1.getMonth()].replace('.',''):MONTHS_S[d1.getMonth()].replace('.','')+' – '+MONTHS_S[d2.getMonth()].replace('.','');
    const f1=DAYS_S[dow(date)]+'. '+d1.getDate()+(sameM?'':' '+MONTHS_S[d1.getMonth()]);
    const f2=DAYS_S[dow(end)]+'. '+d2.getDate()+(sameM?'':' '+MONTHS_S[d2.getMonth()]);
    return `<section class="day stay"><div class="dgrid"><aside class="dcol"><div class="cal-ico sj"><div class="m">${esc(m)}</div><div class="rng2"><span><small>du</small> ${esc(f1)}</span><span><small>au</small> ${esc(f2)}</span></div></div><span class="stay-tag">${esc(cap(a.stayLabel||'séjour'))}</span></aside><div class="acts"><div class="cards">${cardHTML(a,Object.assign({},opts,{date}))}</div></div></div></section>`;
  }
  // signature d'une journée : deux jours consécutifs identiques sont regroupés « du … au … »
  function sig(d){
    const A=x=>(x.acts||[]).map(a=>{const c=Object.assign({},a);delete c.id;delete c.rev;return c});
    if(d.closed)return JSON.stringify({c:1,n:d.note||'',acts:(d.slots||[]).flatMap(A)});
    return JSON.stringify({c:0,n:d.note||'',s:(d.slots||[]).filter(x=>x.start||x.end||(x.acts||[]).length).map(x=>({a:x.start||'',b:x.end||'',l:(x.label||'').trim(),v:x.visual||'',i:x.asset||'',f:!!x.free,acts:A(x)}))});
  }
  function withSeps(ks){
    let prev, h='', g=null;
    const flush=()=>{if(g){h+=dayHTML(g.d,st.settings,Object.assign({},opts,g.end!==g.d.date?{until:g.end}:{}));g=null}};
    ks.forEach(k=>{
      const p=periodOf(k,st.settings&&st.settings.periods), id=p?p.name:'';
      const sp=split(st.days[k]), sg=sp.skip?null:sig(sp.d);
      if(g&&id===prev&&!sp.stays.length&&sg&&sg===g.sig&&addDays(g.end,1)===k){g.end=k;return}
      flush();
      if(id!==prev){h+=`<div class="psep${p&&p.type==='vacances'?' vac':''}"><span>${esc(sepLabel(p))}</span></div>`;prev=id}
      sp.stays.forEach(a=>{h+=stayHTML(a,k)});
      if(!sp.skip)g={d:sp.d,sig:sg,end:k};
    });
    flush();
    return h;
  }
  function pinnedHTML(shown){
    const today=iso(new Date()), items=[], vis=new Set(shown||[]);
    Object.keys(st.days).sort().forEach(k=>(st.days[k].slots||[]).forEach(s=>(s.acts||[]).forEach(a=>{
      if(a.pinned&&((a.endDate||k)>=today||opts.allDays||vis.has(k)))items.push([k,a]);
    })));
    if(!items.length)return '';
    return `<section class="pinned"><div class="cards">${items.map(([k,a])=>{
      const d=parse(k), e=a.endDate&&a.endDate>k?parse(a.endDate):null;
      const dl=DAYS_S[dow(k)]+'. '+d.getDate()+' '+MONTHS_S[d.getMonth()]+(e?' → '+DAYS_S[(e.getDay()+6)%7]+'. '+e.getDate()+' '+MONTHS_S[e.getMonth()]:'');
      return cardHTML(a,Object.assign({},opts,{date:k,dateLine:a.cat==='sejour'?'':(a.cat==='projet'&&!e?'à partir du ':'')+esc(dl)}));
    }).join('')}</div></section>`;
  }
  function render(){
    const all=Object.keys(st.days).sort(), info=(st.settings&&st.settings.info)||{};
    const today=iso(new Date());
    const past=all.filter(k=>k<today), next=all.filter(k=>k>=today);
    let ks=opts.allDays||st.past?all:next;
    if(!ks.length&&past.length)ks=past.slice(-7);
    const hidden=all.length-ks.length;
    const pastBtn=!opts.allDays&&!st.past&&hidden>0?`<button class="past-btn" data-past="1">Voir les jours passés (${hidden})</button>`:'';
    setLabels(info.labels);
    const font=FONTS[info.font]?info.font:'Poppins';loadFont(font);
    const wm=info.watermark&&!opts.noAssets?`<img class="wm wm-${esc(info.wmStyle||'doux')}" src="${window.EJ_ASSET_BASE||'/_blob/'}${esc(info.watermark)}" alt="" aria-hidden="true">`:'';
    root.innerHTML=`<div class="pub" style="--pf:'${font}',system-ui,-apple-system,Segoe UI,sans-serif">${wm}${headHTML(info,wm)}
      <main class="days">${pinnedHTML(ks)}${ks.length&&info.actFooter!==' '?`<p class="act-foot">${esc(info.actFooter||'Programme susceptible d\'être modifié en fonction de la météo, des envies, des opportunités.')}</p>`:''}${ks.length?pastBtn+withSeps(ks):'<div class="pub-empty">Le programme arrive bientôt.</div>'}</main>
      ${footHTML(info)}</div>${st.sheet?sheetHTML(info):''}`;
    markWraps();wmClip();fitStay();
  }
  // horaires de séjour : une seule ligne, police réduite si besoin
  function fitStay(){
    requestAnimationFrame(()=>root.querySelectorAll('.sj-when,.card:not(.tw) .card-head .when').forEach(w=>{
      w.style.fontSize='';w.classList.remove('noa','nowd','now');const base=parseFloat(getComputedStyle(w).fontSize)||14;
      const kids=w.classList.contains('sj-when')?[...w.children]:[w];
      const over=()=>kids.some(d=>d.scrollWidth>d.clientWidth+.5);
      const steps=w.classList.contains('sj-when')?[[],['noa'],['noa','nowd'],['noa','nowd','now']]:[[]];
      for(let i=0;i<steps.length;i++){
        w.classList.remove('noa','nowd','now');steps[i].forEach(c=>w.classList.add(c));
        let f=base;w.style.fontSize='';const min=i<steps.length-1?12:8;
        while(over()&&f>min){f-=.25;w.style.fontSize=f+'px'}
        if(!over())break;
      }
    }));
    // trait de séparation prolongé jusqu'au bord gauche quand l'image est entièrement au-dessus
    requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('.card').forEach(c=>{
      const im=c.querySelector('.card-img'), inf=c.querySelector('.card-info');if(!im||!inf)return;
      c.classList.toggle('fullsep',inf.getBoundingClientRect().top>=im.getBoundingClientRect().bottom+2);
    })));
  }
  window.addEventListener('resize',()=>fitStay());
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitStay());
  // le filigrane du bandeau reste net mais s'efface là où une carte passe dessous
  let wmRaf=0;
  function wmClip(){
    const c=root.querySelector('.pub-head .wm-in'), h=root.querySelector('.pub-head');if(!c||!h)return;
    const r=c.getBoundingClientRect(), hb=h.getBoundingClientRect();
    let d=`M0 0H${r.width}V${r.height}H0Z`;
    root.querySelectorAll('.days .card,.days .dnote,.days .cal-ico,.days .stay-tag,.days .night,.days .act-foot,.days .psep>span,.days .pin-t,.days .past-btn,.days .empty-day,.days .slot-title').forEach(e=>{
      const b=e.getBoundingClientRect();
      if(b.bottom<=hb.top||b.top>=hb.bottom||b.right<=r.left||b.left>=r.right)return;
      d+=`M${(b.left-r.left).toFixed(1)} ${(b.top-r.top).toFixed(1)}h${b.width.toFixed(1)}v${b.height.toFixed(1)}h${(-b.width).toFixed(1)}Z`;
    });
    c.style.clipPath=`path(evenodd,"${d}")`;
  }
  const wmTick=()=>{if(!wmRaf)wmRaf=requestAnimationFrame(()=>{wmRaf=0;wmClip()})};
  document.addEventListener('scroll',wmTick,{passive:true,capture:true});window.addEventListener('resize',wmTick);
  // titre sur deux lignes (sans complément) : l'horaire se place à la suite de la seconde ligne
  function markWraps(){
    requestAnimationFrame(()=>root.querySelectorAll('.card:not(.hasdesc)').forEach(c=>{
      const h=c.querySelector('h3');if(!h)return;c.classList.remove('tw');
      const lh=parseFloat(getComputedStyle(h).lineHeight)||22;
      if(h.offsetHeight>lh*1.5&&c.querySelector('.when'))c.classList.add('tw');
    }));
  }
  // zoom d'une activité au toucher
  function zoom(card){
    const ov=document.createElement('div');ov.className='zoom-bg';
    const cl=card.cloneNode(true);cl.classList.add('zoomed');
    ov.appendChild(cl);root.querySelector('.pub').appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('on'));fitStay();setTimeout(fitStay,260);
    ov.addEventListener('click',()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),200)});
  }
  root.addEventListener('click',e=>{
    const ab=e.target.closest('[data-auth]');if(ab){e.stopPropagation();authPDF(ab.dataset.auth,ab);return}
    const t=e.target.closest('[data-info],[data-close],[data-past]');
    if(!t){const c=e.target.closest('.card');if(c&&!c.closest('.zoom-bg'))zoom(c);return}
    if(t.dataset.close){ if(e.target===t||t.classList.contains('close')){st.sheet=false;render()} return; }
    if(t.dataset.info){st.sheet=true;render();return}
    if(t.dataset.past){st.past=true;render()}
  });
  function loadJsPDF(){
    if(window.jspdf)return Promise.resolve(window.jspdf);
    return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=()=>res(window.jspdf);sc.onerror=rej;document.head.appendChild(sc)});
  }
  const noEmo=t=>String(t||'').replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/[⩽]/g,'<=').replace(/[⩾]/g,'>=').replace(/→/g,'->').replace(/\s+/g,' ').trim();
  function loadH2C(){
    if(window.html2canvas)return Promise.resolve(window.html2canvas);
    return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=()=>res(window.html2canvas);sc.onerror=rej;document.head.appendChild(sc)});
  }
  const AUTH_TXT='J\'ai bien pris note des conditions d\'organisation de l\'activité et du matériel nécessaire à son bon déroulement, et que la participation de mon enfant ne sera pas possible au moment du départ s\'il n\'a pas le matériel prévu ci-dessus.';
  async function authPDF(id,btn){
    const reg=ACTS_REG[id];if(!reg)return;
    const {a,date}=reg, info=(st.settings&&st.settings.info)||{};
    const old=btn.textContent;btn.textContent='…';
    const base=window.EJ_ASSET_BASE||'/_blob/';
    const font=FONTS[info.font]?info.font:'Poppins';
    const box=document.createElement('div');
    box.className='pub pdfdoc';box.style.setProperty('--pf',`'${font}',system-ui,sans-serif`);
    const pl=(info.partners||[]).filter(Boolean);
    const ctext=(info.authText||AUTH_TXT).trim();
    box.innerHTML=`<div class="pd-head">${info.logo?`<img class="pd-logo" src="${base}${esc(info.logo)}" alt="">`:`<span class="logo">${esc((info.name||'EJ').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>`}<div><b>${esc(info.name||'Espace jeunes')}</b><small>${esc(info.sub||'')}</small></div></div>
      <h1 class="pd-t">Autorisation parentale</h1>
      <div class="pd-lines"><p>Je soussigné(e), Madame / Monsieur <i></i></p><p>représentant(e) légal(e) de <i></i></p><p>autorise sa participation à l'activité suivante :</p></div>
      <div class="pd-card">${a.cat==='sejour'?`<span class="stay-tag">${esc(cap(a.stayLabel||'séjour'))}</span>`:`<div class="pd-date">${esc(cap(fmtLong(date)))} ${parse(date).getFullYear()}</div>`}${cardHTML(a,{date,noAuthBtn:true})}</div>
      ${info.authCheck===false||!ctext?'':`<div class="pd-check"><span class="box"></span><p>${esc(ctext).replace(/\n/g,'<br>')}</p></div>`}
      <div class="pd-sign"><div>Fait le <i></i> / <i></i> / <i class="y"></i></div><div class="sig"><span>Signature du représentant légal</span></div></div>
      ${pl.length?`<div class="partners-box"><div class="partners">${pl.map(x=>`<img src="${base}${esc(x)}" alt="">`).join('')}</div>${info.partnersText?`<p>${esc(info.partnersText)}</p>`:''}</div>`:''}`;
    document.body.appendChild(box);
    try{
      const [{jsPDF},h2c]=await Promise.all([loadJsPDF(),loadH2C()]);
      await Promise.all([...box.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
      try{await document.fonts.ready}catch(_){}
      const cv=await h2c(box,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const doc=new jsPDF({unit:'mm',format:'a4'});
      const W=210,H=297, r=cv.height/cv.width;let w=W,h=W*r;if(h>H){h=H;w=H/r}
      doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',(W-w)/2,0,w,h);
      const fn='autorisation-'+noEmo(a.title||'activite').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+date+'.pdf';
      doc.save(fn);
    }catch(e){console.error('PDF',e&&e.message,e&&e.stack);alert('Création du PDF impossible pour le moment.')}
    finally{box.remove();btn.textContent=old}
  }
  function update(d){if(d.days)st.days=d.days;if(d.settings)st.settings=d.settings;render()}
  update(data||{});

<script id="cf-store">
/* ===== Stockage Cloudflare : l'API /api (Pages Functions + base D1) =====
   - Visiteurs : GET /api/public (aucun compte).
   - Créateur : jeton APP_TOKEN (secret Cloudflare), collé une fois et gardé sur cet appareil. */
(function(){
  if(window.claude&&window.claude.use)return; // sur claude.ai : base de données Claude
  const LS='ej-cf-token';
  let token=null;try{token=localStorage.getItem(LS)}catch(e){}
  window.EJ_ASSET_BASE='/api/img/';
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const err=(code,message)=>Object.assign(new Error(message||code),{code});
  const auth=()=>({'Authorization':'Bearer '+token});
  let canEdit=false;
  const store={settings:null,library:null,drafts:{},public:{}};
  const listeners={settings:[],library:[],drafts:[],public:[]};
  let loaded=null;
  function load(){
    if(!loaded)loaded=(async()=>{
      const r=canEdit?await fetch('/api/all',{headers:auth(),cache:'no-store'}):await fetch('/api/public',{cache:'no-store'});
      if(!r.ok)throw err('unavailable','API '+r.status);
      const d=await r.json();
      if(canEdit)Object.assign(store,{settings:d.settings,library:d.library,drafts:d.drafts||{},public:d.public||{}});
      else{store.public=d.days||{};store.settings=d.settings||null}
    })();
    return loaded;
  }
  const notify=k=>listeners[k].forEach(f=>{try{f()}catch(e){console.error(e)}});
  function route(path){
    if(path==='config/settings')return ['settings'];
    if(path==='config/library')return ['library'];
    const p=path.split('/');if(p.length===2&&(p[0]==='drafts'||p[0]==='public'))return [p[0],p[1]];
    throw new TypeError('chemin non géré : '+path);
  }
  async function write(path,data){
    if(!canEdit)throw err('invalid_argument','lecture seule');
    const [k,key]=route(path);
    if(key){if(data===null)delete store[k][key];else store[k][key]=clone(data)}else store[k]=clone(data);
    setTimeout(()=>notify(k),0);
    let r;
    try{r=await fetch('/api/doc',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify({path,data})})}
    catch(e){throw err('unavailable','réseau')}
    if(r.status===401){window.EJ_CF.expired();throw err('invalid_argument','session expirée')}
    if(!r.ok)throw err(r.status===413?'quota_exceeded':'unavailable','API '+r.status);
  }

  const db={
    doc(path){const [k,key]=route(path);return {path,id:key||k,get:async()=>{await load();return snap(k,key)},
      set:d=>write(path,d),update:d=>write(path,Object.assign(clone(snap(k,key).data()||{}),d)),delete:()=>write(path,null),
      onSnapshot:(next,onErr)=>sub(k,()=>next(snap(k,key)),onErr)}},

      return {path:k,doc:id=>db.doc(k+'/'+id),onSnapshot:(next,onErr)=>sub(k,()=>{const docs=Object.keys(store[k]).sort().map(x=>snap(k,x));next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}})},onErr)}}
  };
  // Réduit l'image (1600 px max, JPEG) avant envoi
  async function shrink(file,png){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const sc=Math.min(1,(png?800:1600)/Math.max(img.naturalWidth||800,img.naturalHeight||800));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      if(png){const d=c.toDataURL('image/png');if(d.length<1300000)return d.split(',')[1]}
      let q=0.82,d=c.toDataURL('image/jpeg',q);
      while(d.length>1300000&&q>0.4){q-=0.12;d=c.toDataURL('image/jpeg',q)}
      return d.split(',')[1];
    }finally{URL.revokeObjectURL(url)}
  }
  const assets={async upload(file,o){
    const png=!!(o&&o.logo);
    let data=await shrink(file,png);
    const type=png&&data&&atob(data.slice(0,8)).charCodeAt(1)===80?'image/png':'image/jpeg';
    const r=await fetch('/api/img',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify({type,data})});
    if(!r.ok)throw err('unavailable','API '+r.status);
    return await r.json();
  },async remove(id){
    const r=await fetch('/api/img/'+encodeURIComponent(id),{method:'DELETE',headers:auth()});

    renderLogin(app){

          <p class="hint">Ta demande est envoyée à l'administrateur de l'Espace jeunes. Une fois acceptée, tu pourras consulter ce qu'il t'a ouvert depuis cet appareil.</p>
          <form id="askf"><div class="row"><label class="fld" style="flex:1"><span>Prénom</span><input class="in" id="ap" autocomplete="given-name" required></label><label class="fld" style="flex:1"><span>Nom</span><input class="in" id="an" autocomplete="family-name" required></label></div>

        :`<section class="panel"><h2>🔐 Jeton d'accès</h2>

      app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.m==='ask'?'acces':'createur'});
      const lf=app.querySelector('#cflogin');

<script>
/* ======================= Espace créateur ======================= */
(function(){
const {MONTHS,DAYS,DAYS_S,iso,parse,addDays,dow,cap,fmtLong,fmtT,esc,CATS,VIS,VIS_LIST,visualSVG,actImage,whenText,priceText,PUBLICS,periodOf,mountPublic}=window.EJ;
const app=document.getElementById('app');
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const TODAY=iso(new Date());
const APP_VERSION='v261120.52';
window.EJ_VERSION=APP_VERSION;

const S={db:null,user:null,canEdit:false,assets:null,downloads:null,
  settings:null,library:null,drafts:{},pub:{},
  ready:{settings:false,pub:false,drafts:false,library:false},stale:false,readonly:false};
const UI={open:{},view:'programme',month:TODAY.slice(0,7),drawer:null,libCat:'all',libFlt:null,libQ:'',previewDrafts:true,setDraft:null};

/* ---------- Valeurs par défaut (structure vide, jamais écrites automatiquement) ---------- */
function emptySettings(){
  const wk=()=>Array.from({length:7},()=>({open:false,slots:[]}));
  return {info:{},periods:[],holidays:[],weeks:{scolaire:wk(),vacances:wk()}};
}
const settings=()=>S.settings||emptySettings();
const library=()=>(S.library&&S.library.items)||[];

/* ---------- Écritures : une à la fois par document ---------- */
const queues={};
function write(path,fn){
  const p=(queues[path]||Promise.resolve()).then(fn);
  queues[path]=p.catch(()=>{});
  return p.catch(e=>{
    const code=e&&e.code;
    if(code==='invalid_argument'&&!S.wroteOnce){S.readonly=true;toast('Tu peux consulter mais pas modifier ce programme.',true)}
    else if(code==='quota_exceeded')toast('Base de données pleine : supprime d\'anciennes journées.',true);
    else toast('Enregistrement impossible pour l\'instant ('+(code||'erreur')+').',true);
    throw e;
  }).then(r=>{S.wroteOnce=true;return r});
}
const docSet=(path,data)=>write(path,()=>S.db.doc(path).set(data));
const docDel=path=>write(path,()=>S.db.doc(path).delete());

/* ---------- Logique calendrier ---------- */
function dayType(date){
  const st=settings();
  const hol=(st.holidays||[]).find(h=>h.date===date);
  if(hol)return {type:'ferie',label:hol.label||'Férié',period:null};
  const p=periodOf(date,st.periods);
  if(!p)return {type:'hors',label:'Hors période',period:null};
  return {type:p.type,label:p.name||(p.type==='vacances'?'Vacances':'Période scolaire'),period:p};
}
function templateDay(date){
  const t=dayType(date), st=settings();
  const base={date,closed:false,closedReason:'',note:'',slots:[],rev:0,pubRev:-1};
  if(t.type==='ferie'){base.closed=true;base.closedReason=t.label;return base}
  if(t.type==='hors'){base.closed=true;return base}
  const w=((st.weeks||{})[t.type]||[])[dow(date)];
  if(!w||!w.open){base.closed=true;return base}
  base.slots=(w.slots||[]).map(s=>({id:uid(),start:s.start||'',end:s.end||'',label:s.label||'',visual:s.visual||'',asset:s.asset||'',acts:[]}));
  return base;
}
function getDay(date){return S.drafts[date]?clone(S.drafts[date]):templateDay(date)}
function status(date){
  const d=S.drafts[date], p=S.pub[date];
  if(p&&d&&d.rev!==d.pubRev)return 'mod';
  if(p)return 'pub';
  if(d)return 'draft';
  return 'todo';
}
const ST_LABEL={todo:'À construire',draft:'Brouillon',pub:'En ligne',mod:'Modifié depuis la mise en ligne'};
function publicCopy(d){
  const o=clone(d);delete o.rev;delete o.pubRev;delete o.updatedAt;
  o.publishedAt=new Date().toISOString();return o;
}

/* ---------- Toast & dialogues ---------- */
let toastT;
function toast(msg,err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),err?5200:2600);
}
const modals=[];
function openModal(html,{cls='',onClose}={}){
  const bg=document.createElement('div');bg.className='modal-bg';bg.style.zIndex=60+modals.length*2;
  bg.innerHTML=`<div class="modal ${cls}" role="dialog">${html}</div>`;
  document.body.appendChild(bg);
  const m={bg,el:bg.firstElementChild,close(){bg.remove();modals.splice(modals.indexOf(m),1);onClose&&onClose()}};
  bg.addEventListener('mousedown',e=>{if(e.target===bg)m.close()});
  modals.push(m);return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)modals[modals.length-1].close();else if(UI.drawer)closeDrawer()}});
function confirmBox(msg,{ok='Confirmer',no='Annuler',danger=false}={}){
  return new Promise(res=>{
    const m=openModal(`<div class="mh"><h3>Confirmer</h3></div><div class="mb"><p style="margin:0;font-size:15px;line-height:1.5">${esc(msg)}</p></div><div class="mf"><button class="btn" data-a="no">${esc(no)}</button><button class="btn ${danger?'warn':'pri'}" data-a="ok">${esc(ok)}</button></div>`,{cls:'sm',onClose:()=>res(false)});
    // répondre AVANT de fermer : la fermeture répond « non » par défaut (clic à côté, Échap)
    m.el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;res(a.dataset.a==='ok');m.close()});
  });
}

/* ---------- Calendrier ---------- */
function ensureKitDefs(){if(document.getElementById('kitdefs'))return;const d=document.createElement('div');d.id='kitdefs';d.innerHTML='<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="kitg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F9CE34"/><stop offset=".5" stop-color="#EE2A7B"/><stop offset="1" stop-color="#6228D7"/></linearGradient></defs></svg>';document.body.appendChild(d)}
function renderCalendar(main){ensureKitDefs();
  const st=settings();
  if(!S.ready.drafts||!S.ready.settings){main.innerHTML='<div class="loading">Chargement du calendrier…</div>';return}
  const [y,m]=UI.month.split('-').map(Number);
  const first=iso(new Date(y,m-1,1));
  let start=addDays(first,-dow(first));
  const last=iso(new Date(y,m,0));
  const end=addDays(last,6-dow(last));
  const pers=(st.periods||[]).slice().sort((a,b)=>a.start<b.start?-1:1);
  const monthDays=[];for(let d=first;d<=last;d=addDays(d,1))monthDays.push(d);
  const draftsInMonth=monthDays.filter(d=>['draft','mod'].includes(status(d))&&S.drafts[d]);
  let cells='';
  {const pk=d=>{const p=periodOf(d,st.periods);return p?p.name:''},sep=(d,cls,extra)=>{const p=periodOf(d,st.periods);return `<div class="${cls}${p&&p.type==='vacances'?' vac':''}"><span>${esc(EJ.sepLabel(p))}${extra||''}</span></div>`};
   let prev=null;
   for(let w=start;w<=end;w=addDays(w,7)){
     // séparateur « semaine » (grille ordinateur) quand une période commence dans la semaine
     for(let i=0;i<7;i++){const d=addDays(w,i);if(d.slice(0,7)!==UI.month)continue;if(pk(d)!==prev){if(prev!==null||i===0||true)cells+=sep(d,'wsep',i?' · dès le '+EJ.fmtShortDate(d):'');break}}
     for(let i=0;i<7;i++){const d=addDays(w,i);const inM=d.slice(0,7)===UI.month;
       if(inM&&pk(d)!==prev){cells+=sep(d,'psep');prev=pk(d)}
       cells+=cellHTML(d,!inM);}
   }}
  main.innerHTML=`
    ${!st.periods||!st.periods.length?`<div class="note">👉 Commence par les <b>Paramètres</b> : périodes scolaires et de vacances, puis les semaines types avec les horaires d'ouverture. Le calendrier se pré-remplit ensuite tout seul.</div>`:''}
    <div class="cal-bar">
      <div class="l1"><button class="btn" data-mv="-1" aria-label="Mois précédent">‹</button><h1>${cap(MONTHS[m-1])} ${y}</h1><button class="btn" data-mv="1" aria-label="Mois suivant">›</button><button class="btn" data-mv="0" title="Aujourd'hui">Auj.</button></div>
      <div class="l2"><button class="btn" id="legend" title="Légende" aria-label="Légende">LG</button><button class="btn" id="jump">Aller à une période… ▾</button>
      <button class="btn go" id="pubmonth" ${draftsInMonth.length?'':'disabled'} title="Mettre en ligne les brouillons du mois">${draftsInMonth.length?'Publier '+draftsInMonth.length+' brouillon'+(draftsInMonth.length>1?'s':''):'Rien à publier'}</button></div>
    </div>
    <div class="cal">${DAYS.map(d=>`<div class="cal-h">${d}</div>`).join('')}${cells}</div>`;
  main.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const n=+b.dataset.mv;if(!n)UI.month=TODAY.slice(0,7);else{const d=new Date(y,m-1+n,1);UI.month=iso(d).slice(0,7)}render()});
  main.querySelector('#jump').onclick=()=>{
    const m=openModal(`<div class="mb"><div class="plist">${pers.map(p=>`<button class="prow${p.type==='vacances'?' vac':''}" data-go="${p.start}"><span class="pe">${kitIcon(p.type==='vacances'?'vacances':'scolaire',18)}</span><span>${fmtShort(p.start)} → ${fmtShort(p.end)}</span></button>`).join('')||'<p class="hint">Aucune période dans les paramètres.</p>'}</div></div>`,{cls:'leg'});
    m.el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{UI.month=b.dataset.go.slice(0,7);m.close();render()});
  };
  {const cal=main.querySelector('.cal');let x0=null,y0=0;
   cal.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});
   cal.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
     if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.6){const d=new Date(y,m-1+(dx<0?1:-1),1);UI.month=iso(d).slice(0,7);render()}},{passive:true});}
  main.querySelector('#legend').onclick=()=>{
    const m=openModal(`<div class="mh"><h3>Légende</h3><button class="ico" data-x>✕</button></div><div class="mb">
      <div class="leg-row"><i class="dot st-todo"></i>À construire (semaine type)</div>
      <div class="leg-row"><i class="dot st-draft"></i>Brouillon, non visible</div>
      <div class="leg-row"><i class="dot st-pub"></i>En ligne</div>
      <div class="leg-row"><i class="dot st-mod"></i>Modifié depuis la mise en ligne</div>
      <div class="leg-row">${kitIcon('activite',16)}&nbsp;activité</div>
      <div class="leg-row">${kitIcon('sejour',16)}&nbsp;nuitée &amp; séjour</div>
      <div class="leg-row">${kitIcon('projet',16)}&nbsp;projet &amp; staff</div>
      <div class="leg-row"><i class="tg m">M</i>activité du matin</div>
      <div class="leg-row"><i class="tg c">C</i>activité complète</div>
      <div class="leg-row">${kitIcon('epingle',14)}&nbsp;activité épinglée à la une</div>
      <div class="leg-row">${kitIcon('nocturne',14)}&nbsp;journée avec nocturne</div>
      <div class="leg-row">${kitIcon('vacances',16)} ${kitIcon('scolaire',16)}&nbsp;semaine de vacances / scolaire</div></div>`,{cls:'leg'});
    m.el.querySelector('[data-x]').onclick=()=>m.close();
  };
  main.querySelectorAll('.cell').forEach(c=>c.onclick=()=>openDrawer(c.dataset.date));
  main.querySelector('#pubmonth').onclick=async()=>{
    if(!await confirmBox(`Mettre en ligne ${draftsInMonth.length} journée(s) de ${MONTHS[m-1]} ? Elles seront visibles sur la page publique.`,{ok:'Mettre en ligne'}))return;
    for(const d of draftsInMonth)await publishDay(d,true);
    toast(draftsInMonth.length+' journée(s) en ligne');
  };
}
const fmtShort=s=>s?parse(s).getDate()+' '+EJ.MONTHS_S[parse(s).getMonth()]:'';
function cellHTML(d,out){
  const t=dayType(d), s=status(d), day=S.drafts[d]||templateDay(d);
  const acts=(day.slots||[]).flatMap(x=>x.acts||[]);
  const cls=['cell',out?'out':'',t.type==='vacances'?'t-vacances':'',(day.closed&&!acts.length)?'t-off':'',d===TODAY?'today':''].join(' ');
  const hrs=day.closed?'Fermé':(day.slots||[]).map(x=>EJ.rng(x.start,x.end)).join(' · ');
  const dd=parse(d);
  return `<button class="${cls}" data-date="${d}">
    <span class="mside"><span class="mcal${day.closed?' shut':''}"><b>${EJ.MONTHS_S[dd.getMonth()].replace('.','')}</b><i>${dd.getDate()}</i><small>${EJ.DAYS_S[dow(d)]}.</small></span>
    ${(()=>{const n=!day.closed&&EJ.isNight(day),pn=acts.some(a=>a.pinned);return n||pn?`<span class="mflags">${n?`<i title="Nocturne">${kitIcon('nocturne',14)}</i>`:''}${pn?`<i title="Épinglée à la une">${kitIcon('epingle',14)}</i>`:''}</span>`:''})()}</span>
    <div class="top"><span class="dt">${EJ.fmtShortDate(d)}</span>${hrs?`<span class="hr">${esc(hrs)}</span>`:''}</div>
    <i class="dot stdot st-${s}" title="${ST_LABEL[s]}"></i>
    ${t.type==='ferie'?`<span class="ty">${esc(t.label)}</span>`:''}
    ${acts.map((a,k)=>`<span class="al${k>2?' x3':''}">${a.morning?'<i class="tg m" title="Activité du matin">M</i>':''}${a.full?'<i class="tg c" title="Complet">C</i>':''}${kitIcon(actType(a),15)} ${esc(a.title)}</span>`).join('')}
    ${acts.length>3?`<span class="more">+ ${acts.length-3} autre(s)</span>`:''}
    ${!acts.length&&!day.closed&&s==='todo'?'<span class="ghost-txt">à construire</span>':''}
  </button>`;
}

/* ---------- Panneau d'une journée ---------- */
let saveT=null, dirty=false;
function openDrawer(date){
  UI.drawer={date,day:getDay(date)};dirty=false;
  renderDrawer();
}
function closeDrawer(silent){
  flushSave();
  document.querySelectorAll('.scrim,.drawer').forEach(e=>e.remove());
  UI.drawer=null;
  if(!silent)render();
}
function scheduleSave(){
  dirty=true;setSaving('Modifications…');
  clearTimeout(saveT);saveT=setTimeout(flushSave,700);
}
function flushSave(){
  clearTimeout(saveT);
  if(!dirty||!UI.drawer)return;
  dirty=false;
  const d=UI.drawer.day;
  d.rev=(d.rev||0)+1;d.updatedAt=new Date().toISOString();
  const body=clone(d);
  setSaving('Enregistrement…');
  docSet('drafts/'+d.date,body).then(()=>{if(UI.drawer&&UI.drawer.date===d.date){setSaving('✓ Enregistré');refreshDrawerStatus()}}).catch(()=>setSaving('⚠️ Non enregistré'));
  S.drafts[d.date]=body;
}
function setSaving(t){const el=document.getElementById('saving');if(el)el.textContent=t}
function refreshDrawerStatus(){
  if(!UI.drawer)return;
  const el=document.getElementById('drstatus'),ft=document.getElementById('drfoot');if(!el||!ft)return;
  const sv=(document.getElementById('saving')||{}).textContent;
  el.innerHTML=statusBar(UI.drawer.date);ft.innerHTML=footHTML(UI.drawer.date);if(sv)setSaving(sv);bindStatus();
}
const ST_SHORT={todo:'À construire',draft:'Brouillon',pub:'En ligne',mod:'Modifié'};
function statusBar(date){
  const s=status(date);
  return `<span class="pill p-${s}" title="${ST_LABEL[s]}">${s==='todo'?'Type':ST_SHORT[s]}</span>`;
}
function footHTML(date){
  const s=status(date);
  const del=S.drafts[date], un=s==='pub'||s==='mod';
  return `<div class="sec">
      ${del?'<button class="dbtn sm warn" data-pa="del">Effacer le brouillon</button>':''}
      ${un?'<button class="dbtn sm warn" data-pa="unpub">Retirer du site</button>':''}
      <button class="dbtn sm" data-pa="tpl">Revenir à la semaine type</button>
    </div>
    <div class="pri">
      <button class="dbtn" data-pa="save">Enregistrer le brouillon</button>
      <button class="dbtn go" data-pa="pub">${s==='mod'?'Mettre à jour':s==='pub'?'En ligne ✓':'Publier'}</button>
      <button class="dbtn eye" id="drprev" title="Voir le rendu" aria-label="Voir le rendu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="dbtn ok" data-x="1">OK</button>
    </div>`;
}
function bindStatus(){
  document.querySelectorAll('.drawer [data-x]').forEach(b=>b.onclick=()=>closeDrawer());
  document.querySelectorAll('.drawer #drprev').forEach(b=>b.onclick=()=>window.__drPrev&&window.__drPrev());
  document.querySelectorAll('.drawer [data-pa]').forEach(b=>b.onclick=async()=>{
    const date=UI.drawer.date, a=b.dataset.pa;
    if(a==='save'){if(!S.drafts[date])dirty=true;flushSave();await (queues['drafts/'+date]||Promise.resolve());toast('Brouillon enregistré ✓');closeDrawer();return}
    if(a==='pub'){if(!S.drafts[date])dirty=true;flushSave();await publishDay(date);closeDrawer();return}
    if(a==='unpub'){if(!await confirmBox('Retirer cette journée de la page publique ? Elle reste en brouillon.',{ok:'Retirer',danger:true}))return;await unpublishDay(date);refreshDrawerStatus();return}
    if(a==='tpl')return resetTemplate();
    if(a==='del')return deleteDraft();
  });
}
async function publishDay(date,quiet){
  let d=S.drafts[date]?clone(S.drafts[date]):(UI.drawer&&UI.drawer.date===date?clone(UI.drawer.day):templateDay(date));
  if(!S.drafts[date]){d.rev=1}
  if(!quiet)toast('Mise en ligne…');
  try{
    // attendre l'éventuel enregistrement en cours du brouillon
    await (queues['drafts/'+date]||Promise.resolve());
    if(S.drafts[date])d=clone(S.drafts[date]);
    await docSet('public/'+date,publicCopy(d));
    d.pubRev=d.rev;
    await docSet('drafts/'+date,d);
    S.drafts[date]=d;S.pub[date]=publicCopy(d);
    if(UI.drawer&&UI.drawer.date===date){UI.drawer.day.rev=d.rev;UI.drawer.day.pubRev=d.pubRev}
    if(!quiet)toast('Journée en ligne ✓');
  }catch(e){}
}
async function unpublishDay(date){
  try{await docDel('public/'+date);delete S.pub[date];toast('Journée retirée de la page publique')}catch(e){}
}
async function resetTemplate(){
  const day=UI.drawer.day, n=day.slots.reduce((k,s)=>k+(s.acts||[]).length,0);
  if(!await confirmBox('Réinitialiser cette journée sur la semaine type ? Les horaires et images des périodes seront remplacés. '+(n?'Les '+n+' activité(s) seront rangées dans la première période.':''),{ok:'Réinitialiser'}))return;
  const t=templateDay(day.date), acts=day.slots.flatMap(s=>s.acts||[]);
  day.closed=t.closed;day.slots=t.slots;
  if(acts.length){if(!day.slots.length)day.slots.push({id:uid(),start:'',end:'',label:'',acts:[]});day.slots[0].acts=acts}
  scheduleSave();renderDrawer();
}
async function deleteDraft(){
  const day=UI.drawer.day;
  if(!await confirmBox('Effacer le brouillon de cette journée ? '+(S.pub[day.date]?'La version en ligne sera aussi retirée.':''),{ok:'Effacer',danger:true}))return;
  clearTimeout(saveT);dirty=false;
  try{if(S.pub[day.date])await unpublishDay(day.date);await docDel('drafts/'+day.date);delete S.drafts[day.date];openDrawer(day.date);render()}catch(e){}
}
function renderDrawer(){ensureKitDefs();
  const {date,day}=UI.drawer;
  const t=dayType(date);
  let scrim=document.querySelector('.scrim'),dr=document.querySelector('.drawer');
  if(!scrim){scrim=document.createElement('div');scrim.className='scrim';scrim.onclick=()=>closeDrawer();document.body.appendChild(scrim)}
  if(!dr){dr=document.createElement('aside');dr.className='drawer';document.body.appendChild(dr)}
  const keepScroll=dr.querySelector('.dr-body')?dr.querySelector('.dr-body').scrollTop:0;
  dr.innerHTML=`<div class="dr-head">
      <div class="r1"><button class="dhb nav" data-nav="-1" title="Jour précédent" aria-label="Jour précédent">‹</button><h2>${esc(EJ.fmtShortDate(date))}</h2><button class="dhb nav" data-nav="1" title="Jour suivant" aria-label="Jour suivant">›</button><span class="dty dhb" title="${esc(t.type==='vacances'?'Semaine de vacances':t.type==='scolaire'?'Semaine scolaire':t.label)}">${t.type==='vacances'||t.type==='scolaire'||t.type==='ferie'?kitIcon(t.type,24):'—'}</span><span id="drstatus" class="st">${statusBar(date)}</span></div>
      <span class="saving" id="saving" hidden></span>
    </div>
    <div class="dr-body">

function slotHTML(s,i){

async function navDay(n){

   body.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;

  dr.querySelectorAll('.slot').forEach(sec=>{

  if(af)af.onclick=()=>openComposer({mode:'day',cats:['sejour','projet'],onSave:a=>{let fs=day.slots.find(x=>x.free);if(!fs){fs={id:uid(),start:'',end:'',label:'Sans horaire',free:true,acts:[]};day.slots.push(fs)}fs.acts.push(a);scheduleSave();renderDrawer()}});
  dr.querySelector('#addslot').onclick=()=>{const last=day.slots[day.slots.length-1];day.slots.push({id:uid(),start:last?last.end:'14:00',end:'',label:'',acts:[]});day.closed=false;scheduleSave();renderDrawer()};
  dr.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const si=+b.dataset.add;

  });
  const ij=v=>v.split(':').map(Number);
  dr.querySelectorAll('[data-edit]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('.tools'))return;
    const [i,j]=ij(row.dataset.edit);
    openComposer({mode:'day',initial:day.slots[i].acts[j],onSave:a=>{day.slots[i].acts[j]=a;scheduleSave();renderDrawer()},onDelete:()=>{day.slots[i].acts.splice(j,1);scheduleSave();renderDrawer()}});
  });
  dr.querySelectorAll('[data-mvup],[data-mvdn]').forEach(b=>b.onclick=()=>{
    const up='mvup' in b.dataset,[i,j]=ij(up?b.dataset.mvup:b.dataset.mvdn),a=day.slots[i].acts,k=up?j-1:j+1;

// Recadrage carré, comme l'image apparaît sur les cartes du site
function cropImage(file,opt){
  opt=opt||{};
  return new Promise(resolve=>{
    const isUrl=typeof file==='string', url=isUrl?file:URL.createObjectURL(file), img=new Image();
    const revoke=()=>{if(!isUrl)URL.revokeObjectURL(url)};
    img.onload=()=>{
      const m=openModal(`<div class="mh"><h3>Recadrer l'image</h3><button class="ico" data-a="x">✕</button></div>
        <div class="mb"><p class="hint" style="margin:0 0 10px">Fais glisser l'image et ajuste le zoom : le carré montre ce qui apparaîtra sur la carte de l'activité.</p>
          <div class="crop"><div class="crop-v"><img alt="" draggable="false"></div></div>
          <label class="crop-z"><span>－</span><input type="range" min="1" max="4" step="0.01" value="1"><span>＋</span></label></div>
        <div class="mf"><button class="btn" data-a="x">Annuler</button>${opt.reuse?'<button class="btn" data-a="same">Telle quelle</button>':''}<button class="btn pri" data-a="ok">${opt.reuse?'Recadrer':'Utiliser cette image'}</button></div>`,{onClose:()=>{revoke();if(!done)resolve(null)}});
      let done=false;
      const v=m.el.querySelector('.crop-v'), im=v.querySelector('img'), z=m.el.querySelector('input[type=range]');
      im.src=url;
      const W=img.naturalWidth,H=img.naturalHeight;
      let S0,sc=1,x=0,y=0; // x,y : décalage du centre en px d'affichage
      const box=()=>v.clientWidth;
      const clamp=()=>{const b=box(),w=W*S0*sc,h=H*S0*sc;const mx=Math.max(0,(w-b)/2),my=Math.max(0,(h-b)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y))};
      const draw=()=>{const b=box();S0=b/Math.min(W,H);clamp();im.style.width=(W*S0*sc)+'px';im.style.height=(H*S0*sc)+'px';im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`};
      requestAnimationFrame(draw);
      z.oninput=()=>{sc=+z.value;draw()};
      const pts=new Map();let last=null,dist0=0,sc0=1;
      v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)last=[e.clientX,e.clientY];if(pts.size===2){const [a,b]=[...pts.values()];dist0=Math.hypot(a[0]-b[0],a[1]-b[1]);sc0=sc}});
      v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
        if(pts.size===2){const [a,b]=[...pts.values()];sc=Math.max(1,Math.min(4,sc0*Math.hypot(a[0]-b[0],a[1]-b[1])/(dist0||1)));z.value=sc;draw();return}
        if(last){x+=e.clientX-last[0];y+=e.clientY-last[1];last=[e.clientX,e.clientY];draw()}});
      const up=e=>{pts.delete(e.pointerId);last=pts.size===1?[...pts.values()][0]:null};
      v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
      v.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(1,Math.min(4,sc*(e.deltaY<0?1.08:1/1.08)));z.value=sc;draw()},{passive:false});
      m.el.querySelectorAll('[data-a="x"]').forEach(b=>b.onclick=()=>m.close());
      const sm=m.el.querySelector('[data-a="same"]');if(sm)sm.onclick=()=>{done=true;m.close();resolve('same')};
      m.el.querySelector('[data-a="ok"]').onclick=()=>{
        const b=box(),k=1/(S0*sc);            // px source par px affiché
        const side=b*k, cx=W/2-x*k, cy=H/2-y*k;
        const out=Math.min(900,Math.round(side)), c=document.createElement('canvas');c.width=c.height=out;
        c.getContext('2d').drawImage(img,cx-side/2,cy-side/2,side,side,0,0,out,out);
        c.toBlob(bl=>{done=true;m.close();revoke();resolve(bl)},'image/jpeg',.88);
      };
    };
    img.onerror=()=>{revoke();toast('Image illisible',true);resolve(null)};
    img.src=url;
  });
}

  m.el.querySelector('[data-a="x"]').onclick=()=>m.close();
  const na=m.el.querySelector('[data-a="noasset"]');if(na)na.onclick=()=>{f.asset='';m.close();done()};
  const up=m.el.querySelector('#upl');
  if(up)up.onchange=async()=>{
    const file=up.files[0];up.value='';if(!file)return;
    const blob=await cropImage(file);if(!blob)return;
    const st=m.el.querySelector('#uplst');st.textContent='Envoi…';
    try{const r=await S.assets.upload(blob);f.asset=r.id;rememberImage(r.id);m.close();done();toast('Image importée ✓')}

function overlapWarn(ps){
  const s=ps.filter(p=>p.start&&p.end).slice().sort((a,b)=>a.start<b.start?-1:1);const w=[];
  for(let i=1;i<s.length;i++)if(s[i].start<=s[i-1].end)w.push(`« ${esc(s[i-1].name)} » et « ${esc(s[i].name)} » se chevauchent`);
  ps.forEach(p=>{if(p.start&&p.end&&p.end<p.start)w.push(`« ${esc(p.name)} » : la fin est avant le début`)});
  return w.length?`<div class="note" style="margin:10px 0 0">⚠️ ${w.join('<br>⚠️ ')}</div>`:'';
}
function weekPanel(st,type,title){
  const wk=st.weeks[type];
  const open=wk.filter(d=>d.open).length;
  return `<div data-wt="${type}">${fold('wk-'+type,title,`<p class="hint">Horaires d'ouverture, jour par jour. Plusieurs périodes possibles (ex. journée + soirée).</p>
    ${wk.map((d,i)=>`<div class="wk" data-wd="${i}"><span class="dn">${cap(DAYS[i])}</span>
      <label class="sw" style="font-size:13px"><input type="checkbox" data-wopen ${d.open?'checked':''}></label>
      <div class="sl">${d.open?(d.slots.map((s,j)=>`<div class="row" data-ws="${j}"><input class="in t" type="time" data-wf="start" value="${esc(s.start)}">–<input class="in t" type="time" data-wf="end" value="${esc(s.end)}"><input class="in t" data-wf="label" value="${esc(s.label)}" placeholder="Nom" style="width:110px"><button class="slot-img sm${s.visual||s.asset?' on':''}" data-wsimg="${j}" title="Image affichée quand il n'y a pas d'activité">${s.visual||s.asset?actImage({visual:s.visual,asset:s.asset}):'🖼️'}</button><button class="ico" data-wsdel="${j}">✕</button></div>`).join('')+`<button class="btn sm ghost" data-wsadd style="align-self:flex-start">＋ période</button>`):'<span class="kbd" style="padding-top:6px">Fermé</span>'}</div></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-copyfrom="${type}">Copier le mercredi sur tous les jours ouverts</button></div>`,open+' jours ouverts')}</div>`;
}
function bindSettings(main,st){
  const rerender=()=>render();
  const changedBtn=()=>{const b=main.querySelector('#ssave');if(b){b.disabled=false;b.textContent='💾 Enregistrer les paramètres'}};
  main.querySelectorAll('[data-pi]').forEach(tr=>{const p=st.periods[+tr.dataset.pi];tr.querySelectorAll('[data-pf]').forEach(e=>{e.oninput=e.onchange=()=>{p[e.dataset.pf]=e.value;changedBtn()};e.onblur=()=>{if(e.type==='date'||e.tagName==='SELECT')rerender()}})});
  main.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{st.periods.splice(+b.dataset.pdel,1);rerender()});
  main.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{st.periods.push({id:uid(),type:b.dataset.padd,name:b.dataset.padd==='vacances'?'Vacances':'Période scolaire',start:'',end:''});rerender()});
  main.querySelectorAll('[data-hi]').forEach(r=>{const h=st.holidays[+r.dataset.hi];r.querySelectorAll('[data-hf]').forEach(e=>e.oninput=()=>{h[e.dataset.hf]=e.value;changedBtn()})});
  main.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{st.holidays.splice(+b.dataset.hdel,1);rerender()});
  main.querySelector('#hadd').onclick=()=>{st.holidays.push({date:'',label:'Jour férié'});rerender()};
  main.querySelectorAll('[data-if]').forEach(e=>e.oninput=()=>{st.info[e.dataset.if]=e.value;changedBtn()});
  main.querySelectorAll('[data-wt]').forEach(sec=>{
    const wk=st.weeks[sec.dataset.wt];
    sec.querySelectorAll('[data-wd]').forEach(row=>{
      const d=wk[+row.dataset.wd];
      row.querySelector('[data-wopen]').onchange=e=>{d.open=e.target.checked;if(d.open&&!d.slots.length)d.slots.push({start:'14:00',end:'18:00',label:''});rerender()};
      row.querySelectorAll('[data-ws]').forEach(r=>{const s=d.slots[+r.dataset.ws];r.querySelectorAll('[data-wf]').forEach(e=>e.oninput=()=>{s[e.dataset.wf]=e.value;changedBtn()})});
      row.querySelectorAll('[data-wsimg]').forEach(b=>b.onclick=()=>{const s=d.slots[+b.dataset.wsimg];const o={cat:'jeux',visual:s.visual||'',asset:s.asset||''};openImagePicker(o,()=>{s.visual=o.visual||'';s.asset=o.asset||'';changedBtn();rerender()})});
      row.querySelectorAll('[data-wsdel]').forEach(b=>b.onclick=()=>{d.slots.splice(+b.dataset.wsdel,1);if(!d.slots.length)d.open=false;rerender()});
      const a=row.querySelector('[data-wsadd]');if(a)a.onclick=()=>{const l=d.slots[d.slots.length-1];d.slots.push({start:l?l.end:'14:00',end:'',label:''});rerender()};
    });
    sec.querySelector('[data-copyfrom]').onclick=()=>{const src=wk[2];if(!src.open){toast('Le mercredi est fermé dans cette semaine type',true);return}wk.forEach((d,i)=>{if(i!==2&&d.open)d.slots=clone(src.slots)});rerender()};
  });
  const tp=main.querySelector('#tokenpanel');if(tp)window.EJ_CF.mountToken(tp,{toast,confirmBox});
  const ap=main.querySelector('#accespanel');if(ap)window.EJ_CF.mountAccess(ap,{toast,confirmBox});
  const bk=main.querySelector('#bkdl');if(bk)bk.onclick=()=>window.EJ_CF.backup().then(()=>toast('Sauvegarde téléchargée ✓')).catch(()=>toast('Sauvegarde impossible',true));
  const bu=main.querySelector('#bkup');if(bu)bu.onchange=async()=>{const f=bu.files[0];bu.value='';if(!f)return;
    if(!await confirmBox('Remplacer TOUT le contenu actuel par cette sauvegarde ? Pense à télécharger une sauvegarde de l\'état actuel avant.',{ok:'Restaurer',danger:true}))return;
    try{const n=await window.EJ_CF.restore(f);toast(n+' éléments restaurés — rechargement…');setTimeout(()=>location.reload(),1200)}catch(e){toast('Restauration impossible : '+e.message,true)}};
  const rs=main.querySelector('#sreset');if(rs)rs.onclick=()=>{UI.setDraft=null;rerender()};
  main.querySelector('#ssave').onclick=async()=>{
    const out=clone(st);out.updatedAt=new Date().toISOString();
    try{await docSet('config/settings',out);S.settings=out;UI.setDraft=null;toast('Paramètres enregistrés ✓');rerender()}catch(e){}
  };
}
