<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace jeunes de Selles-sur-Cher — le Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="public-css">
:root{
  --cream:#F5F4F1; --paper:#FFFFFF; --ink:#141317; --ink2:#6A6772; --line:#E5E2DC;
  --orange:#E0662F; --orange-soft:#FBEBE2; --pink:#C2477A; --teal:#1E8C84; --violet:#5B4BC4;
  --red:#C42B3A; --red-soft:#FBE9EB; --green:#1F8A4C; --amber:#D99A12;
  --r:16px; --shadow:0 1px 2px rgba(20,19,23,.05);
  --ig:linear-gradient(45deg,#F9CE34 0%,#EE2A7B 55%,#6228D7 100%);
  --lift:0 1px 1px rgba(20,19,23,.04),0 6px 18px -8px rgba(20,19,23,.22);
  --hi:inset 0 1px 0 rgba(255,255,255,.75);
  --head:'Inter',system-ui,-apple-system,Segoe UI,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;cursor:pointer}
.vis{display:block;width:100%;height:100%}

/* ---------- Page publique ---------- */
.pub{--pf:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;--top:0px;--hh:74px;font-family:var(--pf);max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cream)}
.pub-head{position:sticky;top:var(--top);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--hh);padding:0 18px;background:rgba(245,244,241,.72);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(20,19,23,.06)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px;letter-spacing:.02em;flex:0 0 auto;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 0 4px #EE2A7B}
.logo.img{background:#fff}
.logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink2);font-weight:400;font-size:13px;margin-top:1px}
.info-btn{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift);border-radius:12px;padding:0 14px;height:38px;font-weight:500;font-size:14px;flex:0 0 auto}
.days{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column;gap:30px}
.day{scroll-margin-top:calc(var(--top) + var(--hh) + 10px)}
.dgrid{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:start}
.dcol{position:sticky;top:calc(var(--top) + var(--hh) + 12px)}
.cal-ico{width:76px;border-radius:16px;overflow:hidden;text-align:center;display:flex;flex-direction:column;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}
.cal-ico .m{background:var(--ig);color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.cal-ico .d{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;padding:7px 0 0}
.cal-ico .w{font-size:12px;font-weight:500;color:var(--ink2);padding:2px 0 7px}
.cal-ico .h{border-top:1px dashed #E2DED8;padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;font-size:14px;gap:1px;font-weight:600;line-height:1.15}
.cal-ico .h .to{color:var(--ink2);font-weight:500}
.cal-ico .h .to::before{content:"↓";display:block;font-size:10px;color:#B5B1AA;line-height:1.1}
.cal-ico .h i{display:block;width:18px;height:1px;background:var(--line);margin:5px 0}
.cal-ico .h .off{color:var(--ink2);font-weight:500;font-size:13px}
.acts{min-width:0;display:flex;flex-direction:column;gap:12px}
.cards{display:flex;flex-direction:column;gap:12px}
.alert{display:flex;gap:10px;align-items:flex-start;background:#FFF4F2;color:var(--red);border-radius:10px;padding:11px 13px;font-weight:500;font-size:15px;line-height:1.4;box-shadow:inset 0 0 0 1px rgba(196,43,58,.18)}
.alert .warn{flex:0 0 28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 3px rgba(196,43,58,.25)}
.closed-box{background:var(--paper);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink2);box-shadow:var(--lift)}
.closed-box b{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px}
.slot-title{font-size:14px;font-weight:500;color:var(--ink2);display:flex;gap:8px;margin-top:4px}
.card{background:var(--paper);border:1px solid rgba(20,19,23,.06);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:104px minmax(0,1fr);box-shadow:var(--lift)}
.card.morning{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(45deg,#F9CE34,#FA7E1E) border-box}
.card-img{position:relative;background:#eee;min-height:110px}
.card-img img,.card-img .vis{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-body{padding:13px 14px 14px;min-width:0}
.tag-morning{display:inline-block;font-size:13px;font-weight:500;color:#E06A12;margin-bottom:2px}
.card h3{font-size:19px;font-weight:600;line-height:1.2;margin:0 0 5px;letter-spacing:-.01em}
.when{font-weight:500;font-size:14px;margin:1px 0}
.where{font-size:14px;color:var(--ink2)}
.desc{margin:5px 0 0;font-size:14px;line-height:1.5;color:#3E3B44}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:4px 8px;border-radius:5px;background:#F4F2EE;color:#3E3B44;box-shadow:inset 0 0 0 1px rgba(20,19,23,.08)}
.badge.full{background:var(--red);color:#fff;box-shadow:none}
.badge.ico{padding:4px 6px}
.imp,.bring{display:flex;gap:7px;align-items:flex-start;margin:8px 0 0;font-size:14px;line-height:1.4}
.imp{color:var(--red);font-weight:500}
.bring{color:#3E3B44}
.bring b{font-weight:600;color:var(--ink)}
.em{flex:0 0 auto;font-size:15px;line-height:1.3}
.empty-day{background:var(--paper);border-radius:var(--r);padding:20px 16px;text-align:center;color:var(--ink2);font-size:15px;box-shadow:var(--lift)}
.past-btn{align-self:center;margin:-6px auto -18px;display:block;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--ink2);box-shadow:var(--hi)}
.stl .pill{font-family:var(--body)}
.pub-foot{padding:18px 16px 30px;color:var(--ink2);font-size:13px;text-align:center;line-height:1.5}
.pub-empty{margin:40px 16px;text-align:center;color:var(--ink2)}
.sheet-bg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;font-family:var(--pf,'Poppins',system-ui,sans-serif);background:rgba(20,19,23,.32);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);animation:shFade .2s ease-out}
.sheet{position:relative;width:100%;max-width:440px;max-height:min(82vh,680px);display:flex;flex-direction:column;border-radius:22px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:0 30px 70px -20px rgba(98,40,215,.45),0 12px 30px -12px rgba(238,42,123,.35);animation:shPop .26s cubic-bezier(.2,.9,.3,1.2)}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid #F0EDE8}
.sh-t{flex:1;min-width:0}
.sheet h2{margin:0;font-size:20px;font-weight:600;line-height:1.2}
.sh-t small{display:block;color:var(--ink2);font-size:13px}
.sheet .txt{white-space:pre-wrap;line-height:1.6;font-size:15px;padding:14px 18px 6px;overflow:auto}
.sheet .close{flex:0 0 auto;border:0;background:#F4F2EE;border-radius:12px;width:36px;height:36px;font-size:15px;box-shadow:var(--hi)}
.contact{margin:10px 16px 16px;background:#F7F5F2;border-radius:14px;padding:10px 12px;line-height:1.5;font-size:15px;display:flex;flex-direction:column;gap:6px}
.contact div{display:flex;gap:10px;align-items:center}
.contact span{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 2px rgba(20,19,23,.08);flex:0 0 auto}
@keyframes shFade{from{opacity:0}to{opacity:1}}
@keyframes shPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:430px){.card{grid-template-columns:86px minmax(0,1fr)}.card-body{padding:12px 12px 13px}}
@media (max-width:380px){.dgrid{grid-template-columns:66px minmax(0,1fr);gap:10px}.cal-ico{width:66px}.cal-ico .d{font-size:28px}.card{grid-template-columns:84px minmax(0,1fr)}.card h3{font-size:18px}}
@media (min-width:600px){.dgrid{grid-template-columns:88px minmax(0,1fr);gap:18px}.cal-ico{width:88px}.card{grid-template-columns:140px minmax(0,1fr)}}

/* barre du haut : toujours visible, sous l'encoche éventuelle */
.pub-head{padding-top:env(safe-area-inset-top)}
.pub-head .hb{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.fs-btn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(20,19,23,.1);background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:var(--hi),0 1px 2px rgba(20,19,23,.06);flex:0 0 auto}
.fs-btn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;box-shadow:none}
.psep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink2);margin:2px 0 -14px}
.psep::before,.psep::after{content:"";flex:1;height:1px;background:var(--line)}
.psep span{padding:4px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.psep.vac span{background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;border:1.5px solid transparent;box-shadow:none;color:var(--ink)}
.card{position:relative}
.full-tag{position:absolute;top:10px;right:10px;z-index:2;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;box-shadow:0 2px 6px -2px rgba(196,43,58,.5)}
.card .badges{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:5px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:14px}
.brand>div{min-width:0}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badges::-webkit-scrollbar{display:none}
.card .badge{white-space:nowrap;flex:0 0 auto}
.cal-ico .h small{font-size:11px;font-weight:400;color:var(--ink2)}
.cal-ico .h span{white-space:nowrap}
.realview{position:fixed;inset:0;z-index:200;background:var(--cream);overflow:auto}
.realview .pub{--top:0px}
.rv-exit{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:210;border:0;border-radius:999px;padding:11px 18px;background:rgba(20,19,23,.86);color:#fff;font:500 14px/1 var(--body);box-shadow:0 8px 24px -6px rgba(20,19,23,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* --- v8 : étiquettes, horaires, alerte, infos pratiques, partenaires --- */
.card h3{font-weight:700}
.when{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when i{flex:0 0 6px;height:6px;border-radius:50%;background:var(--ig)}
.badges{align-items:center;gap:5px;margin-top:8px}
.badge{font-size:12px;line-height:1.25;padding:2px 7px;border-radius:5px}
.bus{font-size:15px;line-height:1;flex:0 0 auto;display:inline-flex;align-items:center;height:20px}
.imps{margin-top:12px;padding-top:10px;border-top:1px dashed #ECE8E2}
.imps .imp{margin:0}
.imps .imp+.imp{margin-top:6px}
.cal-ico{width:86px}
.dgrid{grid-template-columns:86px minmax(0,1fr)}
.cal-ico .h{font-size:12.5px;padding:7px 2px 8px}
.cal-ico .h span{white-space:nowrap}
.alert{background:none;box-shadow:none;padding:2px 0 0;color:var(--red);font-weight:600;font-size:16px;line-height:1.35;align-items:center;gap:10px}
.alert .warn{flex:0 0 24px;width:24px;height:24px;filter:drop-shadow(0 2px 4px rgba(238,42,123,.3))}
.sheet .txt{font-size:16px;line-height:1.5}
.sheet .txt p{margin:0 0 .5em}
.sheet .txt .emo{font-size:1.25em;line-height:1;vertical-align:-.08em}
.partners{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 22px;margin:0 0 14px}
.partners img{height:40px;max-width:120px;object-fit:contain}
@media (max-width:380px){.cal-ico{width:76px}.dgrid{grid-template-columns:76px minmax(0,1fr)}.cal-ico .h{font-size:11.5px}}
@media (min-width:600px){.cal-ico{width:92px}.dgrid{grid-template-columns:92px minmax(0,1fr)}}

.card .badges{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}
.when{font-size:13.5px}
@media (max-width:430px){
  .dgrid{grid-template-columns:90px minmax(0,1fr);gap:10px}
  .cal-ico{width:90px}
  .cal-ico .h{font-size:11.5px;letter-spacing:-.01em}
  .card{grid-template-columns:70px minmax(0,1fr)}
  .card-img{min-height:90px}
  .card-body{padding:11px 11px 12px}
  .card h3{font-size:17.5px}
  .when{font-size:13px}
}

/* --- v10 --- */
.when i{background:var(--ac,#EE2A7B)}
.card h3{margin-bottom:2px}
.desc{margin:2px 0 4px;font-size:13.5px;color:var(--ink2)}
.card .badges{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);padding-right:12px}
.card .badges::-webkit-scrollbar{display:none}
.badge .sep{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45;margin:0 6px;vertical-align:middle}
.card{grid-template-columns:110px minmax(0,1fr)}
@media (max-width:430px){.card{grid-template-columns:56px minmax(0,1fr)}.card-img{min-height:80px}.badge{font-size:11.5px;padding:2px 6px}}
@media (min-width:600px){.card{grid-template-columns:120px minmax(0,1fr)}}
.card.isfull h3{padding-right:72px}

/* --- v12 : carte image + en-tête, infos sur toute la largeur --- */
.card,.card.morning{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-areas:"img head" "info info";gap:10px 12px;padding:10px}
.card-img{grid-area:img;width:72px;height:72px;min-height:0;border-radius:12px;overflow:hidden;align-self:start}
.card-head{grid-area:head;min-width:0;align-self:center}
.card-info{grid-area:info;min-width:0;border-top:1px solid #F1EEEA;padding-top:9px}
.card-info .badges{margin-top:0;flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}
.card-info .bring{margin-top:8px}
.card-info .bring:first-child{margin-top:0}
.card-info .imps{margin-top:9px;padding-top:8px}
.card-info>.imps:first-child{margin-top:0;padding-top:0;border-top:0}
.card h3{font-size:18px;margin:0 0 2px}
.desc{font-size:14.5px;line-height:1.4;margin:1px 0 4px;color:var(--ink2)}
.when{font-size:14px;font-weight:500}
.when i{display:none}
.card.isfull h3{padding-right:64px}
.full-tag{top:10px;right:10px}
.alert{justify-content:center;text-align:center;color:#9A5B00;font-weight:600;font-size:16px;padding:4px 6px 2px}
.alert .bang{font-size:26px;font-weight:800;line-height:1;background:linear-gradient(180deg,#FFD84D,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent;flex:0 0 auto}
.night{display:block;margin-top:8px;text-align:center;font-size:12px;font-weight:600;color:#fff;padding:4px 6px;border-radius:9px;background:linear-gradient(135deg,#2B1B6B,#6228D7 60%,#EE2A7B);box-shadow:0 4px 12px -4px rgba(98,40,215,.55);white-space:nowrap}
@media (max-width:430px){.card,.card.morning{grid-template-columns:64px minmax(0,1fr);padding:9px}.card-img{width:64px;height:64px}.card h3{font-size:17px}.badge{font-size:12px}}
@media (min-width:600px){.card,.card.morning{grid-template-columns:96px minmax(0,1fr)}.card-img{width:96px;height:96px}}

/* --- v13 --- */
.card,.card.morning{grid-template-columns:minmax(0,1fr) 72px;grid-template-areas:"head img" "info info";padding:0;gap:0}
.card-img{grid-area:img;width:72px;height:72px;border-radius:0 0 0 16px;align-self:start}
.card-head{padding:11px 12px 10px 13px;align-self:start}
.card-info{margin:0 13px;padding:9px 0 12px}
.card.morning .card-img{border-radius:0 0 0 14px}
.card-head .tags{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.card-head .tags .tag-morning{margin:0}
.card-head .full-tag{position:static;font-size:11.5px;padding:2px 7px}
.card{overflow:visible}
.card-img{overflow:hidden;border-top-right-radius:calc(var(--r) - 1px)}
.card.isfull h3{padding-right:0}
@media (max-width:430px){.card,.card.morning{grid-template-columns:minmax(0,1fr) 66px}.card-img{width:66px;height:66px}}
@media (min-width:600px){.card,.card.morning{grid-template-columns:minmax(0,1fr) 92px}.card-img{width:92px;height:92px}}
.night{font-weight:400;font-size:12px;letter-spacing:.01em;background:linear-gradient(45deg,#D9AE14 0%,#D01C68 55%,#5220BE 100%);box-shadow:0 3px 8px -4px rgba(98,40,215,.45);padding:3px 6px}
.dnote{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12.5px;font-weight:500;line-height:1.3;color:#9A5B00}
.dnote .warn{width:22px;height:22px}
.fs-btn:not(.dark){border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}
.sheet .txt{font-size:15px}
.sheet .txt .emo{font-size:19px}
.sheet .txt p,.desc,.bring>span,.imp>span,.closed-box,.empty-day,.contact .adr p{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.contact .adr{align-items:flex-start}
.contact .adr p{margin:3px 0 0;line-height:1.45}

/* --- v14 --- */
.card,.card.morning{grid-template-columns:72px minmax(0,1fr);grid-template-areas:"img head" "info info";border:1px solid rgba(20,19,23,.06);background:var(--paper);overflow:hidden;padding:0;gap:0}
.card-img{grid-area:img;width:72px;height:72px;border-radius:0 0 14px 0;align-self:start}
.card.morning .card-img{border-radius:0 0 14px 0}
.card.noinfo{grid-template-areas:"img head"}
.card.noinfo .card-img{height:100%;min-height:72px;border-radius:0;align-self:stretch}
.card-head{padding:11px 13px 10px 13px}
.card-info{grid-area:info;margin:0;border-top:0;padding:9px 13px 12px calc(72px + 13px);position:relative}
.card-info::before{content:"";position:absolute;top:0;left:calc(72px + 13px);right:13px;height:1px;background:#EEEAE4}
.card-info .badges,.card-info .bring,.card-info .imps{margin-left:calc(-72px)}
.when{display:flex;align-items:center;gap:4px 7px;flex-wrap:wrap}
.when .wt{white-space:nowrap}
.when .bus{height:auto;font-size:15px}
.when .full-tag{position:static;margin-left:auto;font-size:11.5px;padding:2px 7px;flex:0 0 auto}
.badge .sep{margin:0 8px;width:4px;height:4px}
.sheet .txt p,.desc,.bring>span,.imp>span,.closed-box,.empty-day,.contact .adr p{text-align:left;-webkit-hyphens:manual;hyphens:manual}
.j,.j>span{text-align:justify!important}
.dnote{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:15px;font-weight:600;line-height:1.35;color:#9A5B00;margin:0;padding:10px 12px;border-radius:16px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--ig) border-box;box-shadow:var(--lift)}

.btn{box-shadow:none}

select.btn{appearance:auto}

/* Panneau de journée */
.scrim{position:fixed;inset:0;background:rgba(20,16,26,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#FBF9F6;z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.dr-head{padding:10px 12px;border-bottom:1px solid var(--cr-line);background:#fff}
.dr-head .r1{display:flex;align-items:center;gap:8px}

.dr-head .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#EFEAE3}
.pill.p-draft{background:#FFF0C7;color:#7A5300}.pill.p-pub{background:#DDF4E7;color:#146B3E}.pill.p-mod{background:#E2ECFD;color:#1D57B5}.pill.p-todo{background:#EFEAE3;color:#6B6257}
.saving{font-size:12px;color:var(--ink2);font-weight:700;margin-left:auto}
.dr-body{flex:1;overflow:auto;padding:12px 14px 24px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:5px}
.in,textarea.in,select.in{width:100%;border:1px solid var(--cr-line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea.in{min-height:64px;resize:vertical}
.in.t{width:auto;padding:6px 8px;font-weight:600}
.in.red{color:var(--red);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;cursor:pointer;user-select:none;padding:4px 0}
.sw input{appearance:none;width:42px;height:24px;border-radius:999px;background:#D8D0C5;position:relative;transition:.15s;flex:0 0 auto;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked{background:var(--green)}

.slot{background:#fff;border:1px solid var(--cr-line);border-radius:12px;margin:14px 0;overflow:hidden}

.slot-head .lbl{flex:1;min-width:110px}
.slot-acts{padding:8px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:10px;align-items:center;border:1px solid var(--cr-line);border-radius:12px;padding:6px;background:#fff;cursor:pointer}
.act:hover{border-color:var(--ink)}

.act .tx{flex:1;min-width:0}

.act .tx small{display:block;font-size:14px;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .tools{display:flex;gap:2px}
.ico{border:0;background:transparent;width:30px;height:30px;border-radius:8px;font-size:15px;display:grid;place-items:center}
.ico:hover{background:#EFEAE3}
.add-act{width:100%;border:2px dashed #CFC5B8;background:transparent;border-radius:12px;padding:14px;font-weight:600;color:#6B6257;font-size:16px}
.add-act:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.empty-slot{color:#9B9184;font-size:14px;text-align:center;padding:6px 0 0}
/* Modales */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,26,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#FBF9F6;border-radius:12px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}

.tpl{border:1px solid var(--cr-line);background:#fff;border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.tpl:hover{border-color:var(--ink)}

.tpl .bd{padding:8px 10px 10px}
.tpl .bd b{display:block;font-size:15px;line-height:1.2}
.tpl .bd small{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:3px}
.tpl.blank{border-style:dashed;align-items:center;justify-content:center;min-height:120px;font-weight:600;color:#6B6257}
.mini-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mini-badges span{font-size:11px;font-weight:600;background:#F3EEE7;border-radius:6px;padding:2px 6px}
.form-grid{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:700px){.form-grid{grid-template-columns:1fr}}
.vis-pick{border-radius:14px;overflow:hidden;aspect-ratio:16/9;position:relative;cursor:pointer;border:0;padding:0;width:100%}
.vis-pick img{width:100%;height:100%;object-fit:cover}
.vis-pick .chg{position:absolute;bottom:8px;right:8px;background:rgba(20,16,26,.75);color:#fff;font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px}
.seg{display:inline-flex;background:#EFEAE3;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-weight:600;font-size:13.5px;color:#5B5466}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.box{background:#fff;border:1px solid var(--cr-line);border-radius:14px;padding:10px 12px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .in{flex:1;min-width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;background:#F3EEE7;border-radius:999px;padding:5px 6px 5px 11px;font-size:13.5px;font-weight:700}

.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.sugg button:hover{border-color:var(--ink);color:var(--ink)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:none;aspect-ratio:16/9;position:relative}
.pick.on{border-color:var(--ink)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11.5px;font-weight:600;padding:10px 6px 4px;text-align:left}
.sec-t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:14px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--cr-line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Paramètres */
.panel{background:#fff;border:1px solid var(--cr-line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.fold{padding:0}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .15s;flex:0 0 auto}
.fold[open] summary::after{transform:rotate(-135deg)}
.fold .fsub{font-size:13px;color:var(--ink2);font-weight:500;white-space:nowrap}
@media (max-width:560px){.fold .fsub{display:none}}
.fold .fbody{padding:0 16px 16px}
.logo-prev{width:52px;height:52px;border:1px solid var(--cr-line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff;color:var(--ink2)}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.cr-main.full{max-width:none;padding:0 0 0}
.cr-main.full .pv-bar{padding:8px 14px 10px}
.cr-main.full .pub{min-height:auto}

.pv-bar{position:sticky;top:var(--hdr,96px);z-index:15;background:var(--cream);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0 10px;border-bottom:1px solid var(--cr-line);margin-bottom:0}
.panel .hint{color:var(--ink2);font-size:15px;margin:0 0 10px;line-height:1.45}
.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:5px 4px;text-align:left;font-size:14px}

.ptable td:nth-child(2){width:38%}
@media (max-width:640px){
  .ptable thead{display:none}
  .ptable tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;padding:10px 0;border-top:1px solid #F0EAE2}
  .ptable tr:first-child{border-top:0}
  .ptable td{padding:0;width:auto!important}
  .ptable td:nth-child(1){grid-column:1}

@media (max-width:520px){.act .th{width:50px;height:34px}.act .tools .ico{width:26px}.drawer .dr-body{padding:12px 10px 40px}}
.wk{display:grid;grid-template-columns:110px 70px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid #F0EAE2}

@media (max-width:640px){

}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0;overflow-wrap:anywhere}

/* ---------- Paramètres : présentation minimaliste, commandes natives de l'appareil ---------- */

.setx .fold>summary .fsub{font-size:12.5px;color:#9a958f;font-weight:400}

.setx .tsh{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8a8580;margin:16px 0 6px}
.setx .hint{font-size:13px;color:#8a8580}
.setx .fld{display:block;margin:0 0 12px}

/* sous-rubriques : petit triangle à gauche du titre ; commandes sobres type système (petits arrondis, hauteur confortable) */
.setx .fold>summary,.setx .tsub>summary{justify-content:flex-start!important;gap:8px!important}
.setx .fold>summary::after,.setx .tsub>summary::after{content:none!important;display:none!important}
.setx .fold>summary::before,.setx .tsub>summary::before{content:''!important;display:block!important;width:0!important;height:0!important;border:0!important;border-left:6px solid #6f6a64!important;border-top:4.5px solid transparent!important;border-bottom:4.5px solid transparent!important;background:none!important;transition:transform .15s;flex:0 0 auto;margin:0 2px 0 1px!important;transform:none!important}
.setx .fold[open]>summary::before,.setx .tsub[open]>summary::before{transform:rotate(90deg)!important}
.setx .fold>summary h2{order:1}.setx .fold>summary .fsub{order:2}
.setx input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),.setx select,.setx textarea{appearance:auto;-webkit-appearance:auto;border:1px solid #C7C2BA!important;border-radius:6px!important;background:#fff!important;padding:9px 10px!important;font:inherit!important;font-size:15px!important;line-height:1.35!important;color:#1d1d1b!important;box-shadow:none!important;min-height:40px;height:auto!important}
.setx select{padding-right:8px!important}
.setx textarea{min-height:76px}
.setx input:focus,.setx select:focus,.setx textarea:focus{outline:2px solid #6aa0f5!important;outline-offset:0;border-color:#6aa0f5!important}
.setx button.btn:not(.thopt):not(.kitopt):not(.cmode):not(.fp),.setx label.btn,.setx button.ico{all:unset;box-sizing:border-box;display:inline-flex!important;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px!important;border:1px solid #C7C2BA!important;border-radius:6px!important;background:#fff!important;color:#1d1d1b!important;font:inherit!important;font-size:14.5px!important;font-weight:500!important;cursor:pointer;box-shadow:none!important;-webkit-tap-highlight-color:transparent}
.setx button.ico{min-width:38px;padding:8px!important}
.setx button.btn:active,.setx label.btn:active{background:#f0eeea!important}
.setx .btn.warn,.setx label.btn.warn{color:#b3261e!important}
.setx .row{gap:10px!important;margin-bottom:8px}
.setx .fld{margin:0 0 16px!important}
.setx .fld>span{margin:0 0 6px!important;text-transform:none!important;letter-spacing:0!important;font-size:13.5px!important;color:#5a5650!important;font-weight:500!important}
.setx .sw{margin:0 0 14px!important}
.setx .thopt,.setx .kitopt,.setx .cmode,.setx .fp{border-radius:8px!important;background:#fff!important;border:1px solid #C7C2BA!important;box-shadow:none!important}
.setx .thopt.on,.setx .kitopt.on,.setx .cmode.on,.setx .fp.on{border:2px solid #1d1d1b!important}
/* style « AppHike » : icônes monocouleurs, tout aligné à gauche sans retrait ; rubriques à chevron, sous-rubriques à « + » */
.setx .para>summary{padding:18px 0}
.setx .para>summary .pi{width:22px;height:22px;flex:0 0 auto;color:var(--ink,#141317)}

.setx .fold>summary,.setx .tsub>summary{padding:12px 0!important;justify-content:flex-start;gap:8px}
.setx .fold>summary::after,.setx .tsub>summary::after{content:'+'!important;width:auto!important;height:auto!important;border:0!important;transform:none!important;margin:0 0 0 auto!important;font-size:21px;font-weight:300;line-height:1;color:#8a8580;background:none!important}
.setx .fold[open]>summary::after,.setx .tsub[open]>summary::after{content:'−'!important;transform:none!important;margin:0 0 0 auto!important}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
const fmtLong=s=>{const d=parse(s);return cap(DAYS[dow(s)])+' '+d.getDate()+(d.getDate()===1?'er':'')+' '+MONTHS[d.getMonth()]};

      el.innerHTML=`<p class="hint">Ce jeton (secret <b>APP_TOKEN</b> dans Cloudflare) donne l'accès <b>administrateur</b> sur cet appareil. Sans lui, l'appareil n'affiche que la page publique.</p>
        <div class="row"><input class="in" id="tkv" type="password" value="${esc(t)}" autocomplete="off" style="font-family:monospace"><button class="btn" id="tkshow" title="Afficher">👁️</button></div>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="tksave">Enregistrer le jeton</button><button class="btn warn" id="tkdel">Retirer de cet appareil</button></div>`;
      const v=el.querySelector('#tkv');
      el.querySelector('#tkshow').onclick=()=>{v.type=v.type==='password'?'text':'password'};
      el.querySelector('#tksave').onclick=async()=>{
        const n=v.value.trim();if(!n||n===token){toast('Jeton inchangé');return}
        const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+n},cache:'no-store'}).catch(()=>null);
        if(!r||!r.ok){toast('Ce jeton n\'est pas reconnu',true);return}
        try{localStorage.setItem(LS,n)}catch(e){}toast('Jeton enregistré ✓');setTimeout(()=>location.reload(),800);
      };
      el.querySelector('#tkdel').onclick=async()=>{
        if(!await confirmBox('Retirer le jeton de cet appareil ? Il n\'affichera plus que la page publique, jusqu\'à ce que tu recolles le jeton.',{ok:'Retirer',danger:true}))return;
        window.EJ_CF.logout();
      };
    },
    async mountAccess(el,{toast,confirmBox}){
      const STL={attente:'En attente',active:'Accès accordé',refusee:'Refusée',revoquee:'Révoquée'};
      const PC={attente:'p-draft',active:'p-pub',refusee:'p-todo',revoquee:'p-todo'};
      let data;
      try{const r=await fetch('/api/acces',{headers:auth(),cache:'no-store'});if(!r.ok)throw 0;data=await r.json()}
      catch(e){el.innerHTML='<p class="hint">Liste indisponible pour le moment.</p>';return}
      const link=location.href.split('#')[0]+'#acces';
      const fmt=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
      const row=d=>`<div class="box" data-id="${d.id}">
        <div class="row"><b style="flex:1">${esc(d.prenom)} ${esc(d.nom)}</b><span class="pill ${PC[d.status]}">${STL[d.status]||esc(d.status)}</span></div>
        <div class="kbd">${esc(d.email)} · demande du ${fmt(d.at)}${d.last?' · dernière visite le '+fmt(d.last):''}</div>
        <div style="margin-top:6px">${data.catalogue.map(c=>`<label class="sw" style="font-size:14px"><input type="checkbox" data-dr="${c.key}" ${d.droits.includes(c.key)?'checked':''}> ${esc(c.label)}</label>`).join('')}</div>
        <div class="row" style="margin-top:6px">
          ${d.status!=='active'?'<button class="btn sm go" data-ac="accepter">Accepter</button>':''}
          ${d.status==='attente'?'<button class="btn sm" data-ac="refuser">Refuser</button>':''}
          ${d.status==='active'?'<button class="btn sm warn" data-ac="revoquer">Révoquer</button>':''}
          ${d.status!=='attente'&&d.status!=='active'?'<button class="btn sm ghost warn" data-ac="supprimer">Supprimer</button>':''}
        </div></div>`;
      const L=data.demandes, groups=[['attente','En attente'],['active','Accès accordés'],['autres','Refusées ou révoquées']];
      el.innerHTML=`<p class="hint">Lien à transmettre pour demander un accès : <b>${esc(link)}</b>. Les droits cochés s'appliquent dès que l'accès est accordé.</p>
        ${L.length?groups.map(([g,t])=>{const xs=L.filter(d=>g==='autres'?!['attente','active'].includes(d.status):d.status===g);return xs.length?`<div class="sec-t">${t} (${xs.length})</div>${xs.map(row).join('')}`:''}).join(''):'<p class="kbd">Aucune demande pour l\'instant.</p>'}`;
      const post=async(id,body)=>{const r=await fetch('/api/acces/'+id,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'erreur')};
      el.querySelectorAll('[data-id]').forEach(box=>{
        const id=box.dataset.id,d=L.find(x=>x.id===id);
        box.querySelectorAll('[data-dr]').forEach(cb=>cb.onchange=async()=>{
          const dr=[...box.querySelectorAll('[data-dr]:checked')].map(x=>x.dataset.dr);
          try{await post(id,{action:'droits',droits:dr});toast('Droits mis à jour ✓')}catch(e){cb.checked=!cb.checked;toast('Modification impossible',true)}
        });
        box.querySelectorAll('[data-ac]').forEach(b=>b.onclick=async()=>{
          const a=b.dataset.ac;
          if(a==='supprimer'&&!await confirmBox(`Supprimer définitivement la demande de ${d.prenom} ${d.nom} ?`,{ok:'Supprimer',danger:true}))return;
          if(a==='revoquer'&&!await confirmBox(`Révoquer l'accès de ${d.prenom} ${d.nom} ? Ses droits sont conservés si tu l'acceptes à nouveau.`,{ok:'Révoquer',danger:true}))return;
          try{await post(id,{action:a});toast('Fait ✓');window.EJ_CF.mountAccess(el,{toast,confirmBox})}catch(e){toast('Action impossible',true)}
        });
      });
    }};
  // ----- Utilisateur externe -----
  const LSD='ej-cf-delegue';
  function getDel(){try{return JSON.parse(localStorage.getItem(LSD)||'null')}catch(e){return null}}
  function setDel(v){try{v?localStorage.setItem(LSD,JSON.stringify(v)):localStorage.removeItem(LSD)}catch(e){}}
  const dAuth=dg=>({'Authorization':'Bearer '+dg.id+'.'+dg.k});
  async function renderDelegue(app,dg){
    const shell=(title,body,role)=>`<div class="cr"><header class="cr-top"><div class="r1"><span class="app">AppProg<span class="ver">${window.EJ_VERSION||''}</span></span><span class="role ${role?'ed':''}">${role||'Demande d\'accès'}</span>${window.EJ.fsBtn('dark')}</div></header><div class="cr-main" style="max-width:640px">${body}<p style="margin-top:18px"><button class="btn ghost warn" id="dgout">Oublier mon accès sur cet appareil</button></p></div></div>`;
    const bind=()=>{const o=app.querySelector('#dgout');if(o)o.onclick=()=>{setDel(null);location.hash='';location.reload()};const r=app.querySelector('#dgref');if(r)r.onclick=()=>renderDelegue(app,dg)};
    app.innerHTML=shell('Mon accès','<div class="loading">Vérification…</div>');bind();
    let me;
    try{const r=await fetch('/api/acces/moi',{headers:dAuth(dg),cache:'no-store'});if(r.status===404){setDel(null);app.innerHTML=shell('Mon accès','<section class="panel"><h2>Demande introuvable</h2><p class="hint">Elle a peut-être été supprimée. Tu peux en faire une nouvelle.</p><a class="btn pri" href="#acces" onclick="setTimeout(()=>location.reload(),0)">Nouvelle demande</a></section>');bind();return}me=await r.json()}
    catch(e){app.innerHTML=shell('Mon accès','<section class="panel"><p class="hint">Serveur injoignable. Réessaie plus tard.</p><button class="btn" id="dgref">Réessayer</button></section>');bind();return}
    const hello=`Bonjour ${esc(me.prenom)}`;
    if(me.status==='attente'){app.innerHTML=shell('Mon accès',`<section class="panel"><h2>⏳ Demande envoyée</h2><p class="hint">${hello}, ta demande est en attente de validation par l'administrateur. Reviens sur cette page plus tard, depuis cet appareil.</p><button class="btn" id="dgref">Actualiser</button></section>`);bind();return}
    if(me.status!=='active'){app.innerHTML=shell('Mon accès',`<section class="panel"><h2>🚫 Accès ${me.status==='refusee'?'refusé':'révoqué'}</h2><p class="hint">${hello}, ton accès n'est pas ouvert. Contacte l'équipe de l'Espace jeunes si besoin.</p></section>`);bind();return}
    if(!me.droits.includes('brouillons')){app.innerHTML=shell('Mon accès',`<section class="panel"><h2>✅ Accès accordé</h2><p class="hint">${hello}, ton accès est validé, mais aucun droit ne t'a encore été attribué.</p><button class="btn" id="dgref">Actualiser</button></section>`,'Éditeur');bind();return}
    // Droit « brouillons » : calendrier de travail en lecture seule
    let d;
    try{const r=await fetch('/api/brouillons',{headers:dAuth(dg),cache:'no-store'});if(!r.ok)throw 0;d=await r.json()}
    catch(e){app.innerHTML=shell('Calendrier de travail','<section class="panel"><p class="hint">Calendrier indisponible pour le moment.</p><button class="btn" id="dgref">Réessayer</button></section>');bind();return}
    const days=Object.assign({},d.public,d.drafts);
    const st=k=>{const dr=d.drafts[k],p=d.public[k];if(p&&(!dr||dr.rev===dr.pubRev))return['p-pub','En ligne'];if(p)return['p-mod','Modifié, pas encore en ligne'];return['p-draft','Non publié']};
    app.innerHTML=`<div class="cr-top" style="position:sticky;top:0;z-index:6"><div class="r1"><span class="app">AppProg<span class="ver">${window.EJ_VERSION||''}</span></span><button class="ico" id="dgref" title="Actualiser" style="color:#fff;font-size:18px">↻</button><span class="role ed">Éditeur</span>${window.EJ.fsBtn('dark')}</div><div style="color:#C9C2D1;font-size:14px;font-weight:500;margin-top:6px">Calendrier de travail, non publié · ${hello}</div></div><div id="dgpub"></div>`;
    bind();
    window.EJ_LIBDATA=d.library||[];
    window.EJ.mountPublic(app.querySelector('#dgpub'),{days,settings:d.settings},{allDays:true,statusOf:k=>{const [c,l]=st(k);return `<span class="pill ${c}" style="margin-left:6px">${l}</span>`}});
    {const hb=app.querySelector('.cr-top'),pb=app.querySelector('#dgpub .pub');if(hb&&pb)pb.style.setProperty('--top',hb.offsetHeight+'px')}
  }
  window.EJ_GH=window.EJ_CF; // même point d'entrée pour l'écran de connexion
})();
</script>
<script>
/* ======================= Espace créateur ======================= */
(function(){
const {MONTHS,DAYS,DAYS_S,iso,parse,addDays,dow,cap,fmtLong,fmtT,esc,CATS,VIS,VIS_LIST,visualSVG,actImage,whenText,priceText,PUBLICS,periodOf,mountPublic,QF_OPS,gridSummary,qfLine,spanOf,isInfo}=window.EJ;
window.EJ_TARIFS_FN=()=>(settings().tarifs)||[];
const syncAges=()=>EJ.setAges((settings().info||{}).ages);
const resolveGridC=p=>window.EJ.resolveGrid(p);
const app=document.getElementById('app');
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const TODAY=iso(new Date());
const APP_VERSION='v261128.6';
window.EJ_VERSION=APP_VERSION;

const S={db:null,user:null,canEdit:false,assets:null,downloads:null,
  settings:null,library:null,drafts:{},pub:{},
  ready:{settings:false,pub:false,drafts:false,library:false},stale:false,readonly:false};
const UI={pvMode:'all',open:{},view:'programme',month:TODAY.slice(0,7),drawer:null,libCat:'all',libFlt:null,libQ:'',previewDrafts:true,setDraft:null};

/* ---------- Valeurs par défaut (structure vide, jamais écrites automatiquement) ---------- */
function emptySettings(){
  const wk=()=>Array.from({length:7},()=>({open:false,slots:[]}));
  return {info:{},periods:[],holidays:[],weeks:{scolaire:wk(),vacances:wk()}};
}
const settings=()=>S.settings||emptySettings();
const library=()=>(S.library&&S.library.items)||[];
window.EJ_LIB=()=>S.library?library():(window.EJ_LIBDATA||[]);

/* ---------- Écritures : une à la fois par document ---------- */
const queues={};
function write(path,fn){
  const p=(queues[path]||Promise.resolve()).then(fn);
  queues[path]=p.catch(()=>{});
  return p.catch(e=>{
    const code=e&&e.code;
    if(code==='invalid_argument'&&!S.wroteOnce){S.readonly=true;toast('Tu peux consulter mais pas modifier ce programme.',true)}
    else if(code==='quota_exceeded')toast('Base de données pleine : supprime d\'anciennes journées.',true);
    else toast('Enregistrement impossible pour l\'instant ('+(code||'erreur')+').',true);
    throw e;
  }).then(r=>{S.wroteOnce=true;return r});
}
const docSet=(path,data)=>write(path,()=>S.db.doc(path).set(data));
const docDel=path=>write(path,()=>S.db.doc(path).delete());

/* ---------- Logique calendrier ---------- */
function dayType(date){
  const st=settings();
  const hol=(st.holidays||[]).find(h=>h.date===date);
  if(hol)return {type:'ferie',label:hol.label||'Férié',period:null};
  const p=periodOf(date,st.periods);
  if(!p)return {type:'hors',label:'Hors période',period:null};
  return {type:p.type,label:p.name||(p.type==='vacances'?'Vacances':'Période scolaire'),period:p};
}
function templateDay(date){
  const t=dayType(date), st=settings();
  const base={date,closed:false,closedReason:'',note:'',slots:[],rev:0,pubRev:-1};
  if(t.type==='ferie'){base.closed=true;base.closedReason=t.label;return base}
  if(t.type==='hors'){base.closed=true;return base}
  const w=((st.weeks||{})[t.type]||[])[dow(date)];
  if(!w||!w.open){base.closed=true;return base}
  base.slots=(w.slots||[]).map(s=>({id:uid(),start:s.start||'',end:s.end||'',label:s.label||'',visual:s.visual||'',asset:s.asset||'',acts:[]}));
  return base;
}
function getDay(date){return S.drafts[date]?clone(S.drafts[date]):templateDay(date)}
function status(date){
  const d=S.drafts[date], p=S.pub[date];
  if(p&&d&&d.rev!==d.pubRev)return 'mod';
  if(p)return 'pub';
  if(d)return 'draft';
  return 'todo';
}
const ST_LABEL={todo:'À construire',draft:'Brouillon',pub:'En ligne',mod:'Modifié depuis la mise en ligne'};
function publicCopy(d){
  const o=clone(d);delete o.rev;delete o.pubRev;delete o.updatedAt;
  o.publishedAt=new Date().toISOString();return o;
}

/* ---------- Toast & dialogues ---------- */
let toastT;
function toast(msg,err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),err?5200:2600);
}
const modals=[];
function openModal(html,{cls='',onClose}={}){
  const bg=document.createElement('div');bg.className='modal-bg';bg.style.zIndex=60+modals.length*2;
  bg.innerHTML=`<div class="modal ${cls}" role="dialog">${html}</div>`;
  document.body.appendChild(bg);
  const m={bg,el:bg.firstElementChild,close(){bg.remove();modals.splice(modals.indexOf(m),1);onClose&&onClose()}};
  bg.addEventListener('mousedown',e=>{if(e.target===bg)m.close()});
  modals.push(m);return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)modals[modals.length-1].close();else if(UI.drawer)closeDrawer()}});
function confirmBox(msg,{ok='Confirmer',no='Annuler',danger=false}={}){
  return new Promise(res=>{
    const m=openModal(`<div class="mh"><h3>Confirmer</h3></div><div class="mb"><p style="margin:0;font-size:15px;line-height:1.5">${esc(msg)}</p></div><div class="mf"><button class="btn" data-a="no">${esc(no)}</button><button class="btn ${danger?'warn':'pri'}" data-a="ok">${esc(ok)}</button></div>`,{cls:'sm',onClose:()=>res(false)});
    // répondre AVANT de fermer : la fermeture répond « non » par défaut (clic à côté, Échap)
    m.el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;res(a.dataset.a==='ok');m.close()});
  });
}

/* ---------- Rendu principal ---------- */
function render(){
  if(!S.canEdit){const h=(location.hash||'').slice(1);if(window.EJ_GH&&['createur','activites','parametres','apercu','acces'].includes(h)){window.EJ_GH.renderLogin(app);return}renderPublicOnly();return}
  const v=UI.view;
  app.innerHTML=`<div class="cr">
    <header class="cr-top"><div class="r1"><span class="app">AppProg<span class="ver">${APP_VERSION}</span></span>${S.stale?'<span class="who">⚠️ pas à jour</span>':''}<span class="role">Administrateur</span>${EJ.fsBtn('dark')}</div>
      <nav class="tabs">${tabBtn('createur','Calendrier')}${tabBtn('activites','les Cartes')}${tabBtn('parametres','Paramètres')}${tabBtn('apercu','Aperçu public')}</nav></header>
    <div class="cr-main" id="crmain"></div></div>`;
  const main=document.getElementById('crmain');
  if(v==='activites')renderLibrary(main);
  else if(v==='parametres')renderSettings(main);
  else if(v==='apercu')renderPreview(main);
  else renderCalendar(main);
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  const on=app.querySelector('.tab.on');if(on&&on.scrollIntoView)on.parentNode.scrollLeft=on.offsetLeft-12;
  syncBars();
}
const tabBtn=(k,l)=>`<button class="tab${UI.view===k||(k==='createur'&&UI.view==='programme')?' on':''}" data-tab="${k}">${l}</button>`;
function go(view){if(location.hash!=='#'+view)location.hash=view;else route()}
function route(){
  const h=(location.hash||'').replace('#','');
  UI.view=['createur','activites','parametres','apercu','programme'].includes(h)?h:(S.canEdit?'createur':'programme');
  if(UI.drawer&&UI.view!=='createur')closeDrawer(true);
  render();
}
window.addEventListener('hashchange',route);

/* ---------- Hauteurs des barres collées ---------- */
function syncBars(){
  const hb=document.querySelector('.cr-top'), pv=document.querySelector('.pv-bar'), main=document.getElementById('crmain');
  const h=hb?hb.offsetHeight:0;
  document.documentElement.style.setProperty('--hdr',h+'px');
  const pub=main&&main.querySelector('.pub');
  if(pub)pub.style.setProperty('--top',(h+(pv?pv.offsetHeight:0))+'px');
}
window.addEventListener('resize',()=>syncBars());
/* ---------- Page publique seule ---------- */
let pubMount=null;
function pubData(){return {days:S.pub,settings:{info:settings().info,periods:settings().periods}}}
function renderPublicOnly(){
  if(!S.ready.pub){app.innerHTML='<div class="loading">Chargement du programme…</div>';return}
  if(!pubMount||!app.contains(pubMount.el)){
    app.innerHTML='<div id="pubroot"></div>';
    const el=document.getElementById('pubroot');
    pubMount={el,api:mountPublic(el,pubData(),{home:true,hashNav:true})};
  } else pubMount.api.update(pubData());
}

/* ---------- Calendrier ---------- */
function ensureKitDefs(){if(document.getElementById('kitdefs'))return;const d=document.createElement('div');d.id='kitdefs';d.innerHTML='<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="kitg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F9CE34"/><stop offset=".5" stop-color="#EE2A7B"/><stop offset="1" stop-color="#6228D7"/></linearGradient></defs></svg>';document.body.appendChild(d)}
function renderCalendar(main){ensureKitDefs();
  const st=settings();
  if(!S.ready.drafts||!S.ready.settings){main.innerHTML='<div class="loading">Chargement du calendrier…</div>';return}
  const [y,m]=UI.month.split('-').map(Number);
  const first=iso(new Date(y,m-1,1));
  let start=addDays(first,-dow(first));
  const last=iso(new Date(y,m,0));
  const end=addDays(last,6-dow(last));
  const pers=(st.periods||[]).slice().sort((a,b)=>a.start<b.start?-1:1);
  const monthDays=[];for(let d=first;d<=last;d=addDays(d,1))monthDays.push(d);
  const FK=['todo','draft','pub','mod'], flt=UI.filter||FK, fOn=flt.length<FK.length;
  const okF=d=>flt.includes(status(d));
  const draftsInMonth=monthDays.filter(d=>okF(d)&&status(d)!=='pub'&&(status(d)!=='todo'||flt.includes('todo')));
  let cells='';
  {const pk=d=>{const p=periodOf(d,st.periods);return p?p.name:''},sep=(d,cls,extra)=>{const p=periodOf(d,st.periods);return `<div class="${cls}${p&&p.type==='vacances'?' vac':''}"><span>${esc(EJ.sepLabel(p))}${extra||''}</span></div>`};
   let prev=null;
   for(let w=start;w<=end;w=addDays(w,7)){
     // séparateur « semaine » (grille ordinateur) quand une période commence dans la semaine
     if(!fOn)for(let i=0;i<7;i++){const d=addDays(w,i);if(d.slice(0,7)!==UI.month)continue;if(pk(d)!==prev){cells+=sep(d,'wsep',i?' · dès le '+EJ.fmtShortDate(d):'');break}}
     for(let i=0;i<7;i++){const d=addDays(w,i);const inM=d.slice(0,7)===UI.month;
       if(fOn&&(!inM||!okF(d)))continue;
       if(inM&&pk(d)!==prev){cells+=sep(d,'psep');prev=pk(d)}
       cells+=cellHTML(d,!inM);}
   }}
  main.innerHTML=`
    ${!st.periods||!st.periods.length?`<div class="note">👉 Commence par les <b>Paramètres</b> : périodes scolaires et de vacances, puis les semaines types avec les horaires d'ouverture. Le calendrier se pré-remplit ensuite tout seul.</div>`:''}
    <div class="cal-bar" ${(()=>{requestAnimationFrame(()=>{const h=document.querySelector('.cr-top');if(h)document.documentElement.style.setProperty('--crh',h.offsetHeight+'px')});return ''})()}>
      <div class="l1"><button class="btn" data-mv="-1" aria-label="Mois précédent">‹</button><h1>${cap(MONTHS[m-1])} ${y}</h1><button class="btn" data-mv="1" aria-label="Mois suivant">›</button><button class="btn" data-mv="0" title="Aujourd'hui">Auj.</button></div>
      <div class="l2"><button class="btn" id="legend" title="Légende" aria-label="Légende">Lg</button><button class="btn" id="raz" title="Réinitialiser le mois sur les semaines types" aria-label="Réinitialiser le mois">Raz</button><button class="btn${fOn?' fon':''}" id="filt">Filtre${fOn?' ('+flt.length+')':''} ▾</button>
      <button class="btn go" id="pubmonth" ${draftsInMonth.length?'':'disabled'} title="Mettre en ligne les brouillons du mois">${draftsInMonth.length?'Publier '+MONTHS[m-1]+'<small>'+draftsInMonth.length+' jour'+(draftsInMonth.length>1?'s':'')+'</small>':'Rien à publier'}</button></div>
    </div>
    <div class="cal">${DAYS.map(d=>`<div class="cal-h">${d}</div>`).join('')}${cells}</div>`;
  main.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const n=+b.dataset.mv;if(!n)UI.month=TODAY.slice(0,7);else{const d=new Date(y,m-1+n,1);UI.month=iso(d).slice(0,7)}render()});
  main.querySelector('#filt').onclick=e=>{
    if(document.querySelector('.fpop')){document.querySelectorAll('.pvpop').forEach(x=>x.remove());return}

async function publishDay(date,quiet){

    // attendre l'éventuel enregistrement en cours du brouillon

    await docSet('public/'+date,publicCopy(d));

  function bind(){
    const $=s=>m.el.querySelector(s), $$=s=>m.el.querySelectorAll(s);
    $$('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));
    $$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;step=2;draw()});
    const qi=$('#q');if(qi){qi.oninput=()=>{q=qi.value;$('#qres').innerHTML='<button class="tpl blank" data-blank="1">＋ Carte vierge</button>'+searchRes();bindTpl();const bl2=$('[data-blank]');if(bl2)bl2.onclick=()=>{f=blankActivity(cat);step=3;draw()}};}
    bindTpl();
    const bl=$('[data-blank]');if(bl)bl.onclick=()=>{f=blankActivity(cat);step=3;draw()};
    if(step!==3)return;
    const inp=(id,fn)=>{const e=$(id);if(e)e.oninput=()=>fn(e.value)};
    inp('#flink',v=>f.link=v.trim());inp('#ftitle',v=>f.title=v);inp('#fabout',v=>f.about=v);inp('#fdesc',v=>f.desc=v);inp('#fplace',v=>f.place=v);inp('#fstay',v=>f.stayLabel=v);inp('#fimp',v=>f.important=v);
    inp('#tstart',v=>f.timing.start=v);inp('#tend',v=>f.timing.end=v);inp('#fplaces',v=>f.booking.places=v);
    const pgb=$('#pgridb');if(pgb)pgb.onclick=()=>{document.querySelectorAll('.pvpop').forEach(x=>x.remove());
      const r=pgb.getBoundingClientRect(),pop=document.createElement('div');pop.className='pvpop tpop';const cur=f.price.mode==='grid'?f.price.gid:'free';
      pop.innerHTML=[['free','Gratuit']].concat((settings().tarifs||[]).map(g=>[g.id,g.name||'Tarif'])).map(([v,l])=>`<button data-v="${esc(v)}" class="${cur===v?'on':''}">${esc(l)}</button>`).join('');
      document.body.appendChild(pop);pop.style.left=r.left+'px';pop.style.minWidth=r.width+'px';
      const top=r.bottom+6+pop.offsetHeight>innerHeight-10?r.top-pop.offsetHeight-6:r.bottom+6;pop.style.top=top+'px';
      const off=ev=>{if(!pop.contains(ev.target)&&ev.target!==pgb){pop.remove();document.removeEventListener('mousedown',off,true);document.removeEventListener('touchstart',off,true)}};
      setTimeout(()=>{document.addEventListener('mousedown',off,true);document.addEventListener('touchstart',off,true)},0);
      pop.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{pop.remove();const sel=$('#pgrid');sel.value=b.dataset.v;sel.onchange()})};
    const pg=$('#pgrid');if(pg)pg.onchange=()=>{const v=pg.value;if(v==='free'){f.price={mode:'free'}}else if(v!=='legacy'&&v!=='keep'){const g=(settings().tarifs||[]).find(x=>x.id===v);if(g)f.price={mode:'grid',gid:g.id,name:g.name,type:g.type,rows:clone(g.rows||[]).map(r=>Object.assign(r,{amount:''}))}}draw()};
    $$('[data-phq]').forEach(e=>e.oninput=()=>{const i=+e.dataset.phq;f.price.rows=f.price.rows||[];while(f.price.rows.length<=i)f.price.rows.push({amount:''});f.price.rows[i].hqLabel=e.value});
    $$('[data-pam]').forEach(e=>e.oninput=()=>{const i=+e.dataset.pam;f.price.rows=f.price.rows||[];while(f.price.rows.length<=i)f.price.rows.push({amount:''});f.price.rows[i].amount=e.value});
    inp('#pamount',v=>f.price.amount=v);inp('#pcc',v=>f.price.cc=v);inp('#phc',v=>f.price.hc=v);inp('#ptext',v=>f.price.text=v);
    const chk=(id,fn)=>{const e=$(id);if(e)e.onchange=()=>{fn(e.checked);draw()}};
    chk('#fmorning',v=>f.morning=v);chk('#ffull',v=>f.full=v);chk('#fhl',v=>f.highlight=v);chk('#fauto',v=>f.autoUnfold=v);chk('#faopen',v=>{f.alwaysOpen=v;if(v)f.autoUnfold=false});chk('#fpin',v=>{f.pinned=v;if(!v)f.pinFix=false});chk('#fpinfix',v=>f.pinFix=v);chk('#fauth',v=>f.auth=v);chk('#ftransport',v=>f.transport=v);chk('#fclosed',v=>f.closedDuring=v);chk('#fbook',v=>f.booking.on=v);
    $$('[data-age]').forEach(e=>e.onchange=()=>{f.ages=[...m.el.querySelectorAll('[data-age]:checked')].map(x=>x.dataset.age);f.publics='tous'});
    const at=$('#astpl');if(at)at.onchange=()=>saveAsTpl=at.checked;
    const spRecalc=()=>{const sd=($('#fsd')||{}).value, ed=($('#fed')||{}).value, D=mode==='day'&&UI.drawer?UI.drawer.date:null;if(!D)return;
      let sp;if(sd&&sd!==D){$('#fsd').value=D;toast('La date de début est celle de la journée (vide = pas de date de début)')}
      const S2=$('#fsd').value;
      if(S2){if(!ed||($('#fed')||{}).disabled)sp='open';else if(ed>D)sp='multi';else{sp='day';if(ed<D)$('#fed').value=D}}else sp=ed?'until':'day';
      const old=spanOf(f);f.span=sp;f.endDate=(sp==='multi'||sp==='until')?ed:'';
      draw();if(false){const h=$('#sphint');if(h)h.firstChild.textContent=({day:'Sur la journée.',multi:'Sur plusieurs jours : affichée « du … au … ».',open:'Sans date de fin : affichée « à partir du … ».',until:'Sans date de début : affichée « jusqu\'au … » sur cette journée.'})[sp]+' '}};
    ['#fsd','#fed'].forEach(q=>{const e=$(q);if(e)e.onchange=spRecalc});
    const xs=$('#xstart');if(xs)xs.onclick=()=>{const D=UI.drawer.date,sd=$('#fsd'),ed=$('#fed');
      if(sd.disabled){sd.disabled=false;sd.value=D}else{sd.value='';sd.disabled=true;if(ed.disabled){ed.disabled=false}if(!ed.value||ed.value<=D){ed.value=addDays(D,7);toast('Indique la date de fin')}}

    const xe=$('#xend');if(xe)xe.onclick=()=>{const D=UI.drawer.date,sd=$('#fsd'),ed=$('#fed');

    $$('[data-seg]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const k=sg.dataset.seg,v=b.dataset.v;
      if(k==='publics')f.publics=v;else if(k==='tmode')f.timing.mode=v;else if(k==='pmode')f.price.mode=v;
      draw();
    }));
    {const bo=$('#bopen');if(bo)bo.onclick=()=>bringPicker(f,()=>draw());}
    const pv2=$('#pickvis2');if(pv2)pv2.onclick=()=>openImagePicker(f,()=>draw());
    const rc=$('#recrop');if(rc)rc.onclick=async()=>{const res=await cropImage((window.EJ_ASSET_BASE||'/_blob/')+f.asset,{reuse:true});if(!res||res==='same')return;
      try{const r=await S.assets.upload(res);f.asset=r.id;rememberImage(r.id);draw();toast('Image recadrée ✓')}catch(e){toast('Recadrage impossible',true)}};
    $$('[data-rmb]').forEach(b=>b.onclick=()=>{f.bring.splice(+b.dataset.rmb,1);draw()});
    $('#pickvis').onclick=()=>openImagePicker(f,()=>draw());
    $$('[data-rmg]').forEach(b=>b.onclick=()=>{f.gallery.splice(+b.dataset.rmg,1);draw()});
    const gu=$('#galup');if(gu)gu.onchange=async()=>{const fs=[...gu.files];gu.value='';if(!fs.length)return;toast('Envoi…');
      try{for(const x of fs){const r=await S.assets.upload(x);f.gallery=(f.gallery||[]).concat(r.id)}draw();toast(fs.length>1?'Images ajoutées ✓':'Image ajoutée ✓')}catch(e){toast('Envoi impossible',true)}};
  }
  function bindTpl(){
    m.el.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{
      const t=library().find(x=>x.id===b.dataset.tpl);if(!t)return;
      f=normalize(t);f.templateId=t.id;f.linked=true;f.id=uid();cat=f.cat;if(mode==='day')lt=t;step=3;draw();
    });
  }
  async function action(a){
    if(a==='cancel')return m.close();
    if(a==='back'){step=2;draw();return}
    if(a==='delete'){if(await confirmBox((lt?'Retirer « '+(f.title||'cette carte')+' » de cette journée ? La carte type reste disponible.':'Supprimer « '+(f.title||'cette carte')+' » ?'),{ok:lt?'Retirer':'Supprimer',danger:true})){m.close();onDelete()}return}
    if(a==='tdel'&&lt){const n=countTplUses(lt.id);if(!await confirmBox(`Supprimer la carte type « ${lt.title} » ? Elle sera retirée des ${n} journée${n>1?'s':''} qui l'utilisent, y compris en ligne.`,{ok:'Supprimer partout',danger:true}))return;
      m.close();await removeTemplate(lt.id,true);if(UI.drawer){const dd=S.drafts[UI.drawer.date];if(dd){UI.drawer.day=clone(dd)}renderDrawer&&renderDrawer()}render();toast('Carte type supprimée partout');return}
    if(a==='tdup'&&lt){const nt=clone(lt);nt.id=uid();nt.title=(f.title||lt.title)+' (copie)';await saveTemplate(nt);lt=nt;f.templateId=nt.id;f.linked=true;f.title=nt.title;draw();toast('Copie créée : cette journée utilise la nouvelle carte type ✓');return}
    if(a==='save'){
      if(!f.title.trim()){toast('Donne un titre à la carte',true);m.el.querySelector('#ftitle').focus();return}
      f.title=f.title.trim();
      if(!f.span)f.span=spanOf(f);
      f.timing.mode=(f.timing.start||f.timing.end)?(f.transport?'depart':'range'):'none';

      const out=clone(f);delete out._prevCat;
      if(lt){const nt=clone(out);EJ.OWN_KEYS.forEach(k=>delete nt[k]);nt.id=lt.id;nt.booking=Object.assign({},out.booking||{});
        if(lt.booking&&lt.booking.places!==undefined)nt.booking.places=lt.booking.places;else delete nt.booking.places;
        await saveTemplate(nt);out.templateId=lt.id;out.linked=true;m.close();onSave(out);toast('Carte type enregistrée : tout le calendrier est à jour ✓');render();return}
      if(saveAsTpl){out.templateId=uid();out.linked=true}
      m.close();onSave(out);
      if(saveAsTpl){const tpl=clone(out);EJ.OWN_KEYS.forEach(k=>delete tpl[k]);tpl.id=out.templateId;tpl.full=false;await saveTemplate(tpl);toast('Ajoutée aux cartes types ✓')}
    }
  }
  draw();
}

// Recadrage carré, comme l'image apparaît sur les cartes du site
function cropImage(file,opt){
  opt=opt||{};
  return new Promise(resolve=>{
    const isUrl=typeof file==='string', url=isUrl?file:URL.createObjectURL(file), img=new Image();
    const revoke=()=>{if(!isUrl)URL.revokeObjectURL(url)};
    img.onload=()=>{
      const m=openModal(`<div class="mh"><h3>Recadrer l'image</h3><button class="ico" data-a="x">✕</button></div>
        <div class="mb"><p class="hint" style="margin:0 0 10px">Fais glisser l'image et ajuste le zoom : le carré montre ce qui apparaîtra sur la carte.</p>
          <div class="crop"><div class="crop-v"><img alt="" draggable="false"></div></div>
          <label class="crop-z"><span>－</span><input type="range" min="1" max="4" step="0.01" value="1"><span>＋</span></label></div>
        <div class="mf"><button class="btn" data-a="x">Annuler</button>${opt.reuse?'<button class="btn" data-a="same">Telle quelle</button>':''}<button class="btn pri" data-a="ok">${opt.reuse?'Recadrer':'Utiliser cette image'}</button></div>`,{onClose:()=>{revoke();if(!done)resolve(null)}});
      let done=false;
      const v=m.el.querySelector('.crop-v'), im=v.querySelector('img'), z=m.el.querySelector('input[type=range]');
      im.src=url;
      const W=img.naturalWidth,H=img.naturalHeight;
      let S0,sc=1,x=0,y=0; // x,y : décalage du centre en px d'affichage
      const box=()=>v.clientWidth;
      const clamp=()=>{const b=box(),w=W*S0*sc,h=H*S0*sc;const mx=Math.max(0,(w-b)/2),my=Math.max(0,(h-b)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y))};
      const draw=()=>{const b=box();S0=b/Math.min(W,H);clamp();im.style.width=(W*S0*sc)+'px';im.style.height=(H*S0*sc)+'px';im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`};
      requestAnimationFrame(draw);
      z.oninput=()=>{sc=+z.value;draw()};
      const pts=new Map();let last=null,dist0=0,sc0=1;
      v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)last=[e.clientX,e.clientY];if(pts.size===2){const [a,b]=[...pts.values()];dist0=Math.hypot(a[0]-b[0],a[1]-b[1]);sc0=sc}});
      v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
        if(pts.size===2){const [a,b]=[...pts.values()];sc=Math.max(1,Math.min(4,sc0*Math.hypot(a[0]-b[0],a[1]-b[1])/(dist0||1)));z.value=sc;draw();return}
        if(last){x+=e.clientX-last[0];y+=e.clientY-last[1];last=[e.clientX,e.clientY];draw()}});
      const up=e=>{pts.delete(e.pointerId);last=pts.size===1?[...pts.values()][0]:null};
      v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
      v.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(1,Math.min(4,sc*(e.deltaY<0?1.08:1/1.08)));z.value=sc;draw()},{passive:false});
      m.el.querySelectorAll('[data-a="x"]').forEach(b=>b.onclick=()=>m.close());
      const sm=m.el.querySelector('[data-a="same"]');if(sm)sm.onclick=()=>{done=true;m.close();resolve('same')};
      m.el.querySelector('[data-a="ok"]').onclick=()=>{
        const b=box(),k=1/(S0*sc);            // px source par px affiché
        const side=b*k, cx=W/2-x*k, cy=H/2-y*k;
        const out=Math.min(900,Math.round(side)), c=document.createElement('canvas');c.width=c.height=out;
        c.getContext('2d').drawImage(img,cx-side/2,cy-side/2,side,side,0,0,out,out);
        c.toBlob(bl=>{done=true;m.close();revoke();resolve(bl)},'image/jpeg',.88);
      };
    };
    img.onerror=()=>{revoke();toast('Image illisible',true);resolve(null)};
    img.src=url;
  });
}

function bringPicker(f,done){
  const nrm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const pool=[...new Set(BRING_SUGG.concat(library().flatMap(a=>a.bring||[]),f.bring))].sort((a,b)=>a.localeCompare(b,'fr'));
  const m=openModal(`<div class="bp-top"><div class="combo"><input class="in" id="bpq" placeholder="Filtrer ou ajouter…" autocomplete="off"><button type="button" class="cbx" id="bpx" aria-label="Effacer le filtre" hidden>✕</button></div></div><div class="mb bp-list"></div><div class="mf"><span class="kbd" id="bpn"></span><span style="flex:1"></span><button class="btn pri" data-a="ok">OK</button></div>`,{cls:'bringm',onClose:()=>{vv&&vv.removeEventListener('resize',fit);vv&&vv.removeEventListener('scroll',fit);done()}});
  const q=m.el.querySelector('#bpq'),x=m.el.querySelector('#bpx'),L=m.el.querySelector('.bp-list'),n=m.el.querySelector('#bpn');
  const draw=()=>{const raw=q.value.trim(),k=nrm(raw);x.hidden=!raw;
    const hits=pool.filter(t=>!k||nrm(t).split(/[^a-z0-9€]+/).some(w=>w.startsWith(k)));
    const add=raw&&!pool.some(t=>nrm(t)===k)?`<button type="button" class="add" data-new="1">＋ Ajouter « ${esc(raw)} »</button>`:'';
    L.innerHTML=add+hits.map(t=>`<button type="button" data-t="${esc(t)}" class="${f.bring.includes(t)?'on':''}"><span class="ck">${f.bring.includes(t)?'✓':''}</span>${esc(t)}</button>`).join('')||'<p class="kbd" style="margin:8px">Aucun élément.</p>';
    n.textContent=f.bring.length?f.bring.length+' sélectionné'+(f.bring.length>1?'s':''):'';
    L.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t,i=f.bring.indexOf(t);if(i>=0)f.bring.splice(i,1);else f.bring.push(t);draw()});
    const nb=L.querySelector('[data-new]');if(nb)nb.onclick=()=>{f.bring.push(raw);pool.push(raw);q.value='';draw();q.focus()}};
  q.oninput=draw;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nb=L.querySelector('[data-new]');if(nb)nb.click()}};
  x.onclick=()=>{q.value='';draw();q.focus()};
  m.el.querySelector('[data-a="ok"]').onclick=()=>m.close();
  // reste au-dessus du clavier
  const vv=window.visualViewport;
  const fit=()=>{if(!vv)return;const h=vv.height,top=vv.offsetTop;m.el.style.maxHeight=(h-24)+'px';m.bg.style.alignItems='flex-start';m.bg.style.paddingTop=(top+12)+'px';m.bg.style.height=(top+h)+'px'};
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}
  draw();
}

  main.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{UI.libFlt=UI.libFlt===b.dataset.lf?null:b.dataset.lf;render()});

function overlapWarn(ps){
  const s=ps.filter(p=>p.start&&p.end).slice().sort((a,b)=>a.start<b.start?-1:1);const w=[];
  for(let i=1;i<s.length;i++)if(s[i].start<=s[i-1].end)w.push(`« ${esc(s[i-1].name)} » et « ${esc(s[i].name)} » se chevauchent`);
  ps.forEach(p=>{if(p.start&&p.end&&p.end<p.start)w.push(`« ${esc(p.name)} » : la fin est avant le début`)});
  return w.length?`<div class="note" style="margin:10px 0 0">⚠️ ${w.join('<br>⚠️ ')}</div>`:'';
}
function weekPanel(st,type,title){
  const wk=st.weeks[type];
  const open=wk.filter(d=>d.open).length;
  return `<div data-wt="${type}">${fold('wk-'+type,title,`<p class="hint">Horaires d'ouverture, jour par jour. Plusieurs périodes possibles (ex. journée + soirée).</p>
    ${wk.map((d,i)=>`<div class="wk" data-wd="${i}"><span class="dn">${cap(DAYS[i])}</span>
      <label class="sw" style="font-size:13px"><input type="checkbox" data-wopen ${d.open?'checked':''}></label>
      <div class="sl">${d.open?(d.slots.map((s,j)=>`<div class="row" data-ws="${j}"><input class="in t" type="time" data-wf="start" value="${esc(s.start)}">–<input class="in t" type="time" data-wf="end" value="${esc(s.end)}"><input class="in t" data-wf="label" value="${esc(s.label)}" placeholder="Nom" style="width:110px"><button class="slot-img sm${s.visual||s.asset?' on':''}" data-wsimg="${j}" title="Image affichée quand il n'y a pas de carte">${s.visual||s.asset?actImage({visual:s.visual,asset:s.asset}):'🖼️'}</button><button class="ico" data-wsdel="${j}">✕</button></div>`).join('')+`<button class="btn sm ghost" data-wsadd style="align-self:flex-start">＋ période</button>`):'<span class="kbd" style="padding-top:6px">Fermé</span>'}</div></div>`).join('')}
`,open+' jours ouverts')}</div>`;
}

      row.querySelector('[data-wopen]').onchange=e=>{d.open=e.target.checked;if(d.open&&!d.slots.length)d.slots.push({start:'14:00',end:'18:00',label:''});rerender()};
      row.querySelectorAll('[data-ws]').forEach(r=>{const s=d.slots[+r.dataset.ws];r.querySelectorAll('[data-wf]').forEach(e=>e.oninput=()=>{s[e.dataset.wf]=e.value;changedBtn()})});
      row.querySelectorAll('[data-wsimg]').forEach(b=>b.onclick=()=>{const s=d.slots[+b.dataset.wsimg];const o={cat:'jeux',visual:s.visual||'',asset:s.asset||''};openImagePicker(o,()=>{s.visual=o.visual||'';s.asset=o.asset||'';changedBtn();rerender()})});
      row.querySelectorAll('[data-wsdel]').forEach(b=>b.onclick=()=>{d.slots.splice(+b.dataset.wsdel,1);if(!d.slots.length)d.open=false;rerender()});
      const a=row.querySelector('[data-wsadd]');if(a)a.onclick=()=>{const l=d.slots[d.slots.length-1];d.slots.push({start:l?l.end:'14:00',end:'',label:''});rerender()};
    });
  });
  const tp=main.querySelector('#tokenpanel');if(tp)window.EJ_CF.mountToken(tp,{toast,confirmBox});
  const ap=main.querySelector('#accespanel');if(ap)window.EJ_CF.mountAccess(ap,{toast,confirmBox});
  const bk=main.querySelector('#bkdl');if(bk)bk.onclick=()=>window.EJ_CF.backup().then(()=>toast('Sauvegarde téléchargée ✓')).catch(()=>toast('Sauvegarde impossible',true));
  const bu=main.querySelector('#bkup');if(bu)bu.onchange=async()=>{const f=bu.files[0];bu.value='';if(!f)return;
    if(!await confirmBox('Remplacer TOUT le contenu actuel par cette sauvegarde ? Pense à télécharger une sauvegarde de l\'état actuel avant.',{ok:'Restaurer',danger:true}))return;
    try{const n=await window.EJ_CF.restore(f);toast(n+' éléments restaurés — rechargement…');setTimeout(()=>location.reload(),1200)}catch(e){toast('Restauration impossible : '+e.message,true)}};
  const rs=main.querySelector('#sreset');if(rs)rs.onclick=()=>{UI.setDraft=null;rerender()};
  main.querySelector('#ssave').onclick=async()=>{
    const out=clone(st);out.updatedAt=new Date().toISOString();
    try{await docSet('config/settings',out);S.settings=out;UI.setDraft=null;toast('Paramètres enregistrés ✓');rerender()}catch(e){}
  };
}

/* ---------- Aperçu mobile ---------- */
function renderPreview(main){
  const PM=UI.pvMode||'all';
  const src=PM==='pub'?S.pub:PM==='draft'?Object.fromEntries(Object.keys(S.drafts).filter(k=>!S.pub[k]||status(k)==='mod').map(k=>[k,S.drafts[k]])):Object.assign({},S.pub,S.drafts);
  const days={};Object.keys(src).forEach(k=>days[k]=src[k]);
  const url=location.href.split('#')[0];
  main.classList.add('full');
  main.innerHTML=`<div class="pv-bar">
      <button class="btn sm pvsel" id="pvseg">${({all:'Tout',draft:'Brouillons',pub:'En ligne'})[PM]}</button>
      <button class="btn sm" id="copylink">Copier le lien</button>
      <span style="flex:1"></span>
      <button class="btn sm pri" id="realview">Vue réelle</button>
      ${S.downloads?'<button class="btn sm" id="export">Exporter (HTML)</button>':''}
    </div><div id="pvroot"></div>`;
  mountPublic(main.querySelector('#pvroot'),{days,settings:{info:settings().info,periods:settings().periods}},{allDays:true,noFs:true,periodTitles:true});
  syncBars();
  main.querySelector('#realview').onclick=()=>{
    const ov=document.createElement('div');ov.className='realview';
    ov.innerHTML='<div class="rv-root"></div><button class="rv-exit">Quitter la vue réelle</button>';
    document.body.appendChild(ov);document.body.style.overflow='hidden';
    EJ.resetVisitor();ov.querySelector('.rv-root').scrollTop=0;
    mountPublic(ov.querySelector('.rv-root'),{days,settings:{info:settings().info,periods:settings().periods}},{home:true});
    ov.querySelector('.rv-exit').onclick=()=>{ov.remove();document.body.style.overflow=''};
  };
  main.querySelector('#pvseg').onclick=()=>{UI.pvMode=({all:'draft',draft:'pub',pub:'all'})[UI.pvMode||'all'];render()};

  // clic sur un jour ou une activité de l'aperçu : ouvre l'édition correspondante
  main.querySelector('#pvroot').addEventListener('click',e=>{
    const card=e.target.closest('.card[data-aid]'), ico=e.target.closest('.cal-ico'), sec=e.target.closest('section.day[id^="j-"]');
    if(!card&&!(ico&&sec))return;
    e.preventDefault();e.stopPropagation();
    if(card&&/^sl-/.test(card.dataset.aid||'')&&sec){openDrawer(sec.id.slice(2));return}
    if(card){const id=card.dataset.aid;
      const keys=[...new Set(Object.keys(S.drafts).concat(Object.keys(S.pub)))].sort();
      const pref=sec?sec.id.slice(2):null;
      const order=pref?[pref].concat(keys.filter(k=>k!==pref)):keys;
      for(const k of order){const d=getDay(k);for(let i=0;i<(d.slots||[]).length;i++){const j=(d.slots[i].acts||[]).findIndex(a=>a.id===id);
        if(j>=0){openDrawer(k);editActIn(i,j,()=>{if(UI.drawer)closeDrawer()});return}}}
      return;}
    openDrawer(sec.id.slice(2));
  },true);
  main.querySelector('#copylink').onclick=async()=>{
    try{await navigator.clipboard.writeText(url);toast('Lien copié ✓')}catch(e){toast('Lien : '+url,true)}
  };
  const ex=main.querySelector('#export');if(ex)ex.onclick=exportPublic;
}
async function exportPublic(){
  const css=document.getElementById('public-css').textContent;
  const lib=document.getElementById('public-lib').textContent;
  const data={days:S.pub,settings:{info:settings().info,periods:settings().periods}};
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(settings().info.name||'Espace jeunes')} — le Programme</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body><div id="app"></div><script>${lib}<\/script><script>EJ.mountPublic(document.getElementById('app'),${json},{noAssets:true});<\/script></body></html>`;
  try{await S.downloads.save({filename:'programme-espace-jeunes.html',data:html});toast('Fichier exporté ✓')}
  catch(e){toast('Export annulé ou impossible',true)}
}

/* ---------- Démarrage ---------- */
async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.ready.pub=true;S.ready.settings=true;renderPublicOnly();return}
  const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
  S.db=db;S.user=user;
  if(!db){app.innerHTML='<div class="pub"><div class="pub-empty">Connecte-toi à ton compte Claude pour voir le programme.</div></div>';return}
  try{S.canEdit=user?!!(await user.canEdit()):false}catch(e){S.canEdit=false}
  if(S.canEdit){
    [S.assets,S.downloads]=await Promise.all([cl.use('assets'),cl.use('downloads')]);
    loadImgDups();
  }
  const timer=setTimeout(()=>{S.stale=true;Object.keys(S.ready).forEach(k=>S.ready[k]=true);render()},10000);
  const done=()=>{if(S.ready.settings&&S.ready.pub&&(!S.canEdit||(S.ready.drafts&&S.ready.library)))clearTimeout(timer)};
  const err=k=>e=>{S.ready[k]=true;if(e&&e.code!=='revoked')S.stale=true;render()};
  db.doc('config/settings').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.ready.settings=true;done();if(UI.view!=='parametres'||!UI.setDraft)rerenderSoft()},err('settings'));
  db.collection('public').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.pub=o;S.ready.pub=true;done();rerenderSoft()},err('pub'));
  if(S.canEdit){
    db.collection('drafts').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.drafts=o;S.ready.drafts=true;done();rerenderSoft()},err('drafts'));
    db.doc('config/library').onSnapshot(s=>{S.library=s.exists?s.data():{items:[]};S.ready.library=true;done();rerenderSoft()},err('library'));
  }
  route();
}
let softT;
function rerenderSoft(){
  // ne pas reconstruire l'écran sous une modale ou pendant une saisie dans le panneau
  clearTimeout(softT);softT=setTimeout(()=>{
    if(modals.length)return;
    if(UI.drawer){refreshDrawerStatus();const main=document.getElementById('crmain');if(main&&UI.view==='createur')renderCalendar(main);return}
    const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,select')&&app.contains(a))return;
    render();
  },60);
}
boot();
})();
</script>
