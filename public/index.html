/* ---------- Valeurs par défaut (structure vide, jamais écrites automatiquement) ---------- */
function emptySettings(){
  const wk=()=>Array.from({length:7},()=>({open:false,slots:[]}));
  return {info:{},periods:[],holidays:[],weeks:{scolaire:wk(),vacances:wk()}};
}
const settings=()=>S.settings||emptySettings();
const library=()=>(S.library&&S.library.items)||[];

/* ---------- Écritures : une à la fois par document ---------- */
const queues={};
function write(path,fn){
  const p=(queues[path]||Promise.resolve()).then(fn);
  queues[path]=p.catch(()=>{});
  return p.catch(e=>{
    const code=e&&e.code;
    if(code==='invalid_argument'&&!S.wroteOnce){S.readonly=true;toast('Tu peux consulter mais pas modifier ce programme.',true)}
    else if(code==='quota_exceeded')toast('Base de données pleine : supprime d\'anciennes journées.',true);
    else toast('Enregistrement impossible pour l\'instant ('+(code||'erreur')+').',true);
    throw e;
  }).then(r=>{S.wroteOnce=true;return r});
}
const docSet=(path,data)=>write(path,()=>S.db.doc(path).set(data));
const docDel=path=>write(path,()=>S.db.doc(path).delete());

/* ---------- Logique calendrier ---------- */
function dayType(date){
  const st=settings();
  const hol=(st.holidays||[]).find(h=>h.date===date);
  if(hol)return {type:'ferie',label:hol.label||'Férié',period:null};
  const p=periodOf(date,st.periods);
  if(!p)return {type:'hors',label:'Hors période',period:null};
  return {type:p.type,label:p.name||(p.type==='vacances'?'Vacances':'Période scolaire'),period:p};
}
function templateDay(date){
  const t=dayType(date), st=settings();
  const base={date,closed:false,closedReason:'',note:'',slots:[],rev:0,pubRev:-1};
  if(t.type==='ferie'){base.closed=true;base.closedReason=t.label;return base}
  if(t.type==='hors'){base.closed=true;return base}
  const w=((st.weeks||{})[t.type]||[])[dow(date)];
  if(!w||!w.open){base.closed=true;return base}
  base.slots=(w.slots||[]).map(s=>({id:uid(),start:s.start||'',end:s.end||'',label:s.label||'',acts:[]}));
  return base;
}
function getDay(date){return S.drafts[date]?clone(S.drafts[date]):templateDay(date)}
function status(date){
  const d=S.drafts[date], p=S.pub[date];
  if(p&&d&&d.rev!==d.pubRev)return 'mod';
  if(p)return 'pub';
  if(d)return 'draft';
  return 'todo';
}
const ST_LABEL={todo:'À construire',draft:'Brouillon',pub:'En ligne',mod:'Modifié depuis la mise en ligne'};
function publicCopy(d){
  const o=clone(d);delete o.rev;delete o.pubRev;delete o.updatedAt;
  o.publishedAt=new Date().toISOString();return o;
}

/* ---------- Toast & dialogues ---------- */
let toastT;
function toast(msg,err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),err?5200:2600);
}
const modals=[];
function openModal(html,{cls='',onClose}={}){
  const bg=document.createElement('div');bg.className='modal-bg';bg.style.zIndex=60+modals.length*2;
  bg.innerHTML=`<div class="modal ${cls}" role="dialog">${html}</div>`;
  document.body.appendChild(bg);
  const m={bg,el:bg.firstElementChild,close(){bg.remove();modals.splice(modals.indexOf(m),1);onClose&&onClose()}};
  bg.addEventListener('mousedown',e=>{if(e.target===bg)m.close()});
  modals.push(m);return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)modals[modals.length-1].close();else if(UI.drawer)closeDrawer()}});
function confirmBox(msg,{ok='Confirmer',danger=false}={}){
  return new Promise(res=>{
    const m=openModal(`<div class="mh"><h3>Confirmer</h3></div><div class="mb"><p style="margin:0;font-size:15px;line-height:1.5">${esc(msg)}</p></div><div class="mf"><button class="btn" data-a="no">Annuler</button><button class="btn ${danger?'warn':'pri'}" data-a="ok">${esc(ok)}</button></div>`,{cls:'sm',onClose:()=>res(false)});
    // répondre AVANT de fermer : la fermeture répond « non » par défaut (clic à côté, Échap)
    m.el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;res(a.dataset.a==='ok');m.close()});
  });
}

/* ---------- Rendu principal ---------- */
function render(){
  if(!S.canEdit){const h=(location.hash||'').slice(1);if(window.EJ_GH&&['createur','activites','parametres','apercu','acces'].includes(h)){window.EJ_GH.renderLogin(app);return}renderPublicOnly();return}
  const v=UI.view;
  app.innerHTML=`<div class="cr">
    <header class="cr-top"><div class="r1"><span class="app">AppProg<span class="ver">${APP_VERSION}</span></span>${S.stale?'<span class="who">⚠️ pas à jour</span>':''}<span class="role">Administrateur</span></div>
      <nav class="tabs">${tabBtn('createur','📅 Calendrier')}${tabBtn('activites','🗂️ Activités')}${tabBtn('parametres','⚙️ Paramètres')}${tabBtn('apercu','📱 Aperçu')}</nav></header>
    <div class="cr-main" id="crmain"></div></div>`;
  const main=document.getElementById('crmain');
  if(v==='activites')renderLibrary(main);
  else if(v==='parametres')renderSettings(main);
  else if(v==='apercu')renderPreview(main);
  else renderCalendar(main);
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  const on=app.querySelector('.tab.on');if(on&&on.scrollIntoView)on.parentNode.scrollLeft=on.offsetLeft-12;
}
const tabBtn=(k,l)=>`<button class="tab${UI.view===k||(k==='createur'&&UI.view==='programme')?' on':''}" data-tab="${k}">${l}</button>`;
function go(view){if(location.hash!=='#'+view)location.hash=view;else route()}
function route(){
  const h=(location.hash||'').replace('#','');
  UI.view=['createur','activites','parametres','apercu','programme'].includes(h)?h:(S.canEdit?'createur':'programme');
  if(UI.drawer&&UI.view!=='createur')closeDrawer(true);
  render();
}
window.addEventListener('hashchange',route);

/* ---------- Page publique seule ---------- */
let pubMount=null;
function pubData(){return {days:S.pub,settings:{info:settings().info,periods:settings().periods}}}
function renderPublicOnly(){
  if(!S.ready.pub){app.innerHTML='<div class="loading">Chargement du programme…</div>';return}
  if(!pubMount||!app.contains(pubMount.el)){
    app.innerHTML='<div id="pubroot"></div>';
    const el=document.getElementById('pubroot');
    pubMount={el,api:mountPublic(el,pubData())};
  } else pubMount.api.update(pubData());
}

/* ---------- Calendrier ---------- */
function renderCalendar(main){
  const st=settings();
  if(!S.ready.drafts||!S.ready.settings){main.innerHTML='<div class="loading">Chargement du calendrier…</div>';return}
  const [y,m]=UI.month.split('-').map(Number);
  const first=iso(new Date(y,m-1,1));
  let start=addDays(first,-dow(first));
  const last=iso(new Date(y,m,0));
  const end=addDays(last,6-dow(last));
  const pers=(st.periods||[]).slice().sort((a,b)=>a.start<b.start?-1:1);
  const monthDays=[];for(let d=first;d<=last;d=addDays(d,1))monthDays.push(d);
  const draftsInMonth=monthDays.filter(d=>['draft','mod'].includes(status(d))&&S.drafts[d]);
  let cells='';
  for(let d=start;d<=end;d=addDays(d,1))cells+=cellHTML(d,d.slice(0,7)!==UI.month);
  main.innerHTML=`
    ${!st.periods||!st.periods.length?`<div class="note">👉 Commence par les <b>Paramètres</b> : périodes scolaires et de vacances, puis les semaines types avec les horaires d'ouverture. Le calendrier se pré-remplit ensuite tout seul.</div>`:''}
    <div class="cal-bar">
      <div class="l1"><button class="btn" data-mv="-1" aria-label="Mois précédent">‹</button><h1>${cap(MONTHS[m-1])} ${y}</h1><button class="btn" data-mv="1" aria-label="Mois suivant">›</button><button class="btn" data-mv="0" title="Aujourd'hui">Auj.</button><button class="btn" id="legend" title="Légende" aria-label="Légende">ⓘ</button></div>
      <div class="l2"><select class="btn" id="jump"><option value="">Aller à une période…</option>${pers.map(p=>`<option value="${p.start}">${p.type==='vacances'?'🏖️':'🎒'} ${esc(p.name)} (${fmtShort(p.start)} → ${fmtShort(p.end)})</option>`).join('')}</select>
      <button class="btn go" id="pubmonth" ${draftsInMonth.length?'':'disabled'} title="Mettre en ligne les brouillons du mois">🚀 ${draftsInMonth.length?draftsInMonth.length+' à publier':'Rien à publier'}</button></div>
    </div>
    <div class="cal">${DAYS.map(d=>`<div class="cal-h">${d}</div>`).join('')}${cells}</div>`;
  main.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const n=+b.dataset.mv;if(!n)UI.month=TODAY.slice(0,7);else{const d=new Date(y,m-1+n,1);UI.month=iso(d).slice(0,7)}render()});
  main.querySelector('#jump').onchange=e=>{if(e.target.value){UI.month=e.target.value.slice(0,7);render()}};
  main.querySelector('#legend').onclick=()=>{
    const m=openModal(`<div class="mh"><h3>Légende</h3><button class="ico" data-x>✕</button></div><div class="mb">
      <div class="leg-row"><i class="dot st-todo"></i>À construire : pré-rempli depuis la semaine type</div>
      <div class="leg-row"><i class="dot st-draft"></i>Brouillon : pas encore visible par le public</div>
      <div class="leg-row"><i class="dot st-pub"></i>En ligne : visible sur la page publique</div>
      <div class="leg-row"><i class="dot st-mod"></i>Modifié depuis la mise en ligne</div>
      <div class="leg-row">🏖️ Vacances · 🎒 Période scolaire · 🚫 Fermeture</div>
      <div class="leg-row"><span style="color:#C2560F">● Texte orange</span> : activité du matin</div></div>`,{cls:'sm'});
    m.el.querySelector('[data-x]').onclick=()=>m.close();
  };
  main.querySelectorAll('.cell').forEach(c=>c.onclick=()=>openDrawer(c.dataset.date));
  main.querySelector('#pubmonth').onclick=async()=>{
    if(!await confirmBox(`Mettre en ligne ${draftsInMonth.length} journée(s) de ${MONTHS[m-1]} ? Elles seront visibles sur la page publique.`,{ok:'Mettre en ligne'}))return;
    for(const d of draftsInMonth)await publishDay(d,true);
    toast(draftsInMonth.length+' journée(s) en ligne');
  };
}
const fmtShort=s=>s?parse(s).getDate()+' '+EJ.MONTHS_S[parse(s).getMonth()]:'';
function cellHTML(d,out){
  const t=dayType(d), s=status(d), day=S.drafts[d]||templateDay(d);
  const acts=(day.slots||[]).flatMap(x=>x.acts||[]);
  const cls=['cell',out?'out':'',t.type==='vacances'?'t-vacances':'',(day.closed&&!acts.length)?'t-off':'',d===TODAY?'today':''].join(' ');
  const hrs=day.closed?'Fermé':(day.slots||[]).map(x=>fmtT(x.start)+'–'+fmtT(x.end)).join(' · ');
  return `<button class="${cls}" data-date="${d}">
    <div class="top"><span class="num" data-dn="${DAYS[dow(d)]} ${parse(d).getDate()} ${MONTHS[parse(d).getMonth()]}">${parse(d).getDate()}</span></div>
    <i class="dot stdot st-${s}" title="${ST_LABEL[s]}"></i>
    <span class="ty">${t.type==='vacances'?'🏖️ ':t.type==='scolaire'?'🎒 ':t.type==='ferie'?'🚫 ':''}${esc(t.label)}</span>
    ${hrs?`<span class="hr">${esc(hrs)}</span>`:''}
    ${acts.slice(0,3).map(a=>`<span class="al${a.morning?' m':''}">${(CATS[a.cat]||{}).emoji||'⭐'} ${esc(a.title)}</span>`).join('')}
    ${acts.length>3?`<span class="more">+ ${acts.length-3} autre(s)</span>`:''}
    ${!acts.length&&!day.closed&&s==='todo'?'<span class="ghost-txt">à construire</span>':''}
  </button>`;
}

/* ---------- Panneau d'une journée ---------- */
let saveT=null, dirty=false;
function openDrawer(date){
  UI.drawer={date,day:getDay(date)};dirty=false;
  renderDrawer();
}
function closeDrawer(silent){
  flushSave();
  document.querySelectorAll('.scrim,.drawer').forEach(e=>e.remove());
  UI.drawer=null;
  if(!silent)render();
}
function scheduleSave(){
  dirty=true;setSaving('Modifications…');
  clearTimeout(saveT);saveT=setTimeout(flushSave,700);
}
function flushSave(){
  clearTimeout(saveT);
  if(!dirty||!UI.drawer)return;
  dirty=false;
  const d=UI.drawer.day;
  d.rev=(d.rev||0)+1;d.updatedAt=new Date().toISOString();
  const body=clone(d);
  setSaving('Enregistrement…');
  docSet('drafts/'+d.date,body).then(()=>{if(UI.drawer&&UI.drawer.date===d.date){setSaving('✓ Enregistré');refreshDrawerStatus()}}).catch(()=>setSaving('⚠️ Non enregistré'));
  S.drafts[d.date]=body;
}
function setSaving(t){const el=document.getElementById('saving');if(el)el.textContent=t}
function refreshDrawerStatus(){
  if(!UI.drawer)return;
  const el=document.getElementById('drstatus'),ft=document.getElementById('drfoot');if(!el||!ft)return;
  const sv=(document.getElementById('saving')||{}).textContent;
  el.innerHTML=statusBar(UI.drawer.date);ft.innerHTML=footHTML(UI.drawer.date);if(sv)setSaving(sv);bindStatus();
}
const ST_SHORT={todo:'À construire',draft:'Brouillon',pub:'En ligne',mod:'Modifié'};
function statusBar(date){
  const s=status(date);
  return `<span class="pill p-${s}" title="${ST_LABEL[s]}">${ST_SHORT[s]}</span>`;
}
function footHTML(date){
  const s=status(date);
  return `<span class="saving" id="saving">${S.drafts[date]?'✓ Enregistré':'Pré-rempli depuis la semaine type'}</span>
    <div class="sec">
      <button class="btn sm" data-pa="tpl">↺ Semaine type</button>
      ${S.drafts[date]?'<button class="btn sm warn" data-pa="del">🗑️ Effacer le brouillon</button>':''}
      ${s==='pub'||s==='mod'?'<button class="btn sm warn" data-pa="unpub">⛔ Retirer du public</button>':''}
    </div>
    <div class="pri">
      <button class="btn" data-pa="save">💾 Sauvegarder comme brouillon</button>
      <button class="btn go" data-pa="pub">${s==='mod'?'🔄 Mettre à jour en ligne':s==='pub'?'✓ Valider (en ligne)':'🚀 Mettre en ligne'}</button>
    </div>`;
}
function bindStatus(){
  document.querySelectorAll('.drawer [data-pa]').forEach(b=>b.onclick=async()=>{
    const date=UI.drawer.date, a=b.dataset.pa;
    if(a==='save'){if(!S.drafts[date])dirty=true;flushSave();await (queues['drafts/'+date]||Promise.resolve());toast('Brouillon enregistré ✓');closeDrawer();return}
    if(a==='pub'){if(!S.drafts[date])dirty=true;flushSave();await publishDay(date);closeDrawer();return}
    if(a==='unpub'){if(!await confirmBox('Retirer cette journée de la page publique ? Elle reste en brouillon.',{ok:'Retirer',danger:true}))return;await unpublishDay(date);refreshDrawerStatus();return}
    if(a==='tpl')return resetTemplate();
    if(a==='del')return deleteDraft();
  });
}
async function publishDay(date,quiet){
  let d=S.drafts[date]?clone(S.drafts[date]):(UI.drawer&&UI.drawer.date===date?clone(UI.drawer.day):templateDay(date));
  if(!S.drafts[date]){d.rev=1}
  if(!quiet)toast('Mise en ligne…');
  try{
    // attendre l'éventuel enregistrement en cours du brouillon
    await (queues['drafts/'+date]||Promise.resolve());
    if(S.drafts[date])d=clone(S.drafts[date]);
    await docSet('public/'+date,publicCopy(d));
    d.pubRev=d.rev;
    await docSet('drafts/'+date,d);
    S.drafts[date]=d;S.pub[date]=publicCopy(d);
    if(UI.drawer&&UI.drawer.date===date){UI.drawer.day.rev=d.rev;UI.drawer.day.pubRev=d.pubRev}
    if(!quiet)toast('Journée en ligne ✓');
  }catch(e){}
}
async function unpublishDay(date){
  try{await docDel('public/'+date);delete S.pub[date];toast('Journée retirée de la page publique')}catch(e){}
}
async function resetTemplate(){
  const day=UI.drawer.day, n=day.slots.reduce((k,s)=>k+(s.acts||[]).length,0);
  if(!await confirmBox('Réappliquer les horaires de la semaine type ? '+(n?'Les '+n+' activité(s) seront rangées dans la première période.':''),{ok:'Réappliquer'}))return;
  const t=templateDay(day.date), acts=day.slots.flatMap(s=>s.acts||[]);
  day.closed=t.closed;day.slots=t.slots;
  if(acts.length){if(!day.slots.length)day.slots.push({id:uid(),start:'',end:'',label:'',acts:[]});day.slots[0].acts=acts}
  scheduleSave();renderDrawer();
}
async function deleteDraft(){
  const day=UI.drawer.day;
  if(!await confirmBox('Effacer le brouillon de cette journée ? '+(S.pub[day.date]?'La version en ligne sera aussi retirée.':''),{ok:'Effacer',danger:true}))return;
  clearTimeout(saveT);dirty=false;
  try{if(S.pub[day.date])await unpublishDay(day.date);await docDel('drafts/'+day.date);delete S.drafts[day.date];openDrawer(day.date);render()}catch(e){}
}
function renderDrawer(){
  const {date,day}=UI.drawer;
  const t=dayType(date);
  let scrim=document.querySelector('.scrim'),dr=document.querySelector('.drawer');
  if(!scrim){scrim=document.createElement('div');scrim.className='scrim';scrim.onclick=()=>closeDrawer();document.body.appendChild(scrim)}
  if(!dr){dr=document.createElement('aside');dr.className='drawer';document.body.appendChild(dr)}
  const keepScroll=dr.querySelector('.dr-body')?dr.querySelector('.dr-body').scrollTop:0;
  dr.innerHTML=`<div class="dr-head">
      <div class="r1"><button class="ico" data-nav="-1" title="Jour précédent">‹</button><h2>${esc(fmtLong(date))} ${parse(date).getFullYear()}</h2><button class="ico" data-nav="1" title="Jour suivant">›</button><button class="ico" data-x="1" title="Fermer">✕</button></div>
      <div class="r2"><span class="pill">${t.type==='vacances'?'🏖️':t.type==='scolaire'?'🎒':'🚫'} ${esc(t.label)}</span><span id="drstatus" class="st">${statusBar(date)}</span></div>
    </div>
    <div class="dr-body">
      <label class="sw"><input type="checkbox" id="dclosed" ${day.closed?'checked':''}> Accueil fermé ce jour</label>
      ${day.closed?`<label class="fld"><span>Raison affichée (facultatif)</span><input class="in" id="dreason" value="${esc(day.closedReason)}" placeholder="ex. Jour férié, formation de l'équipe…"></label>`:''}
      <label class="fld"><span>💥 Information importante du jour (affichée en rouge)</span><input class="in red" id="dnote" value="${esc(day.note)}" placeholder="ex. Il n'y a pas de navette ce matin !"></label>
      ${day.slots.map((s,i)=>slotHTML(s,i)).join('')}
      <button class="btn sm" id="addslot" style="margin-top:4px">＋ Ajouter une période horaire</button>
    </div>
    <div class="dr-foot" id="drfoot">${footHTML(date)}</div>`;
  dr.querySelector('.dr-body').scrollTop=keepScroll;
  bindDrawer(dr);
}
function slotHTML(s,i){
  return `<section class="slot" data-si="${i}">
    <div class="slot-head">
      <input class="in t" type="time" data-sf="start" value="${esc(s.start)}" aria-label="Début"> – <input class="in t" type="time" data-sf="end" value="${esc(s.end)}" aria-label="Fin">
      <input class="in t lbl" data-sf="label" value="${esc(s.label)}" placeholder="Nom (ex. Accueil, Soirée)">
      <button class="ico" data-sdel="${i}" title="Supprimer cette période">🗑️</button>
    </div>
    <div class="slot-acts">
      ${(s.acts||[]).map((a,j)=>actRowHTML(a,i,j,s.acts.length)).join('')||'<div class="empty-slot">Aucune activité pour l\'instant</div>'}
      <button class="add-act" data-add="${i}">＋ Ajouter une activité</button>
    </div></section>`;
}
function actRowHTML(a,i,j,n){
  const meta=[whenText(a),a.transport?'🚍':'',a.booking&&a.booking.on?'📋'+(a.booking.places?' '+a.booking.places+' pl.':''):'',(a.price||{}).mode&&a.price.mode!=='free'?'🤑 '+priceText(a.price):'',a.full?'COMPLET':''].filter(Boolean).join(' · ');
  return `<div class="act${a.morning?' m':''}" data-edit="${i}:${j}">
    <div class="th">${actImage(a)}</div>
    <div class="tx"><b>${esc(a.title||'Activité')}</b><small>${esc((CATS[a.cat]||{}).label||'')}${meta?' · '+esc(meta):''}</small></div>
    <div class="tools">
      <button class="ico" data-mvup="${i}:${j}" ${j===0?'disabled':''} title="Monter">↑</button>
      <button class="ico" data-mvdn="${i}:${j}" ${j===n-1?'disabled':''} title="Descendre">↓</button>
      <button class="ico" data-dup="${i}:${j}" title="Dupliquer">⧉</button>
      <button class="ico" data-del="${i}:${j}" title="Supprimer">🗑️</button>
    </div></div>`;
}
function bindDrawer(dr){
  const day=UI.drawer.day;
  dr.querySelector('[data-x]').onclick=()=>closeDrawer();
  dr.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{flushSave();openDrawer(addDays(UI.drawer.date,+b.dataset.nav));render();});
  bindStatus();
  dr.querySelector('#dclosed').onchange=e=>{day.closed=e.target.checked;scheduleSave();renderDrawer()};
  const r=dr.querySelector('#dreason');if(r)r.oninput=e=>{day.closedReason=e.target.value;scheduleSave()};
  dr.querySelector('#dnote').oninput=e=>{day.note=e.target.value;scheduleSave()};
  dr.querySelectorAll('.slot').forEach(sec=>{
    const s=day.slots[+sec.dataset.si];
    sec.querySelectorAll('[data-sf]').forEach(inp=>inp.oninput=()=>{s[inp.dataset.sf]=inp.value;scheduleSave()});
  });
  dr.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=async()=>{
    const s=day.slots[+b.dataset.sdel];
    if((s.acts||[]).length&&!await confirmBox('Supprimer cette période horaire et ses '+s.acts.length+' activité(s) ?',{ok:'Supprimer',danger:true}))return;
    day.slots.splice(+b.dataset.sdel,1);scheduleSave();renderDrawer();
  });
  dr.querySelector('#addslot').onclick=()=>{const last=day.slots[day.slots.length-1];day.slots.push({id:uid(),start:last?last.end:'14:00',end:'',label:'',acts:[]});day.closed=false;scheduleSave();renderDrawer()};
  dr.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const si=+b.dataset.add;
    openComposer({mode:'day',onSave:a=>{day.slots[si].acts.push(a);scheduleSave();renderDrawer()}});
  });
  const ij=v=>v.split(':').map(Number);
  dr.querySelectorAll('[data-edit]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('.tools'))return;
    const [i,j]=ij(row.dataset.edit);
    openComposer({mode:'day',initial:day.slots[i].acts[j],onSave:a=>{day.slots[i].acts[j]=a;scheduleSave();renderDrawer()},onDelete:()=>{day.slots[i].acts.splice(j,1);scheduleSave();renderDrawer()}});
  });
  dr.querySelectorAll('[data-mvup],[data-mvdn]').forEach(b=>b.onclick=()=>{
    const up='mvup' in b.dataset,[i,j]=ij(up?b.dataset.mvup:b.dataset.mvdn),a=day.slots[i].acts,k=up?j-1:j+1;
    [a[j],a[k]]=[a[k],a[j]];scheduleSave();renderDrawer();
  });
  dr.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{const [i,j]=ij(b.dataset.dup);const c=clone(day.slots[i].acts[j]);c.id=uid();day.slots[i].acts.splice(j+1,0,c);scheduleSave();renderDrawer()});
  dr.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const [i,j]=ij(b.dataset.del);if(!await confirmBox('Supprimer « '+day.slots[i].acts[j].title+' » ?',{ok:'Supprimer',danger:true}))return;day.slots[i].acts.splice(j,1);scheduleSave();renderDrawer()});
}

/* ---------- Composeur d'activité ---------- */
const BRING_SUGG=['un maillot de bain (pas de short)','une serviette','un goûter','un pique-nique','une tenue de sport','des chaussures de sport propres','des chaussures fermées qui vont dans l\'eau','ton attestation de nage','une paire de gants','des grosses chaussettes','une gourde','tes couverts','2 € pour le repas','une casquette','des affaires de rechange','un vêtement de pluie','une lampe de poche','un duvet et un tapis de sol','l\'autorisation parentale'];
function blankActivity(cat){
  return {id:uid(),cat:cat||'jeux',title:'',desc:'',visual:(CATS[cat]||{}).visual||'etoile',asset:'',publics:'tous',morning:false,
    timing:{mode:'none',start:'',end:''},place:'',transport:false,booking:{on:false,places:''},full:false,
    price:{mode:'free',amount:'',cc:'',hc:'',text:''},bring:[],important:'',closedDuring:false};
}
function normalize(a){
  const b=blankActivity(a.cat);
  return Object.assign(b,clone(a),{timing:Object.assign(b.timing,a.timing||{}),booking:Object.assign(b.booking,a.booking||{}),price:Object.assign(b.price,a.price||{}),bring:(a.bring||[]).slice()});
}
function tplMeta(a){
  const x=[];
  if(a.transport)x.push('🚍 transport');
  if(a.booking&&a.booking.on)x.push('📋 réservation');
  x.push((a.price||{}).mode&&a.price.mode!=='free'?'🤑 '+priceText(a.price):'gratuit');
  if((a.timing||{}).mode!=='none'&&whenText(a))x.push(whenText(a).replace(/^\S+ /,''));
  if((a.bring||[]).length)x.push('🎒 '+a.bring.length+' à prévoir');
  return x;
}
function openComposer({mode,initial,onSave,onDelete}){
  // mode : 'day' (dans une journée) ou 'template' (bibliothèque)
  let step=initial?3:1, cat=initial?initial.cat:null, f=initial?normalize(initial):null, q='';
  let saveAsTpl=false;
  const m=openModal('',{});
  function title(){return step===1?'Quel type d\'activité ?':step===2?(CATS[cat].emoji+' '+CATS[cat].label+' — partir d\'une activité type'):(initial?'Modifier l\'activité':mode==='template'?'Nouvelle activité type':'Nouvelle activité')}
  function draw(){
    let body='',foot='';
    if(step===1){
      body=`<div class="cat-grid">${Object.entries(CATS).map(([k,c])=>`<button class="cat-tile" data-cat="${k}" style="background:${c.color}"><span class="e">${c.emoji}</span><b>${esc(c.label)}</b></button>`).join('')}</div>
        <div class="sec-t">ou cherche directement dans les activités types</div>
        <input class="in" id="q" placeholder="ex. piscine, patinoire, couture…" value="${esc(q)}">
        <div class="tpl-grid" style="margin-top:10px" id="qres">${q?searchRes():''}</div>`;
      foot=`<button class="btn" data-a="cancel">Annuler</button>`;
    } else if(step===2){
      const list=library().filter(t=>t.cat===cat);
      body=`<div class="tpl-grid"><button class="tpl blank" data-blank="1">＋ Activité vierge<br><small style="font-weight:700">${esc(CATS[cat].label)}</small></button>${list.map(tplCard).join('')}</div>
        ${!list.length?'<p class="kbd" style="margin-top:10px">Pas encore d\'activité type dans cette catégorie. Crée une activité vierge et coche « Enregistrer aussi comme activité type ».</p>':''}`;
      foot=`<button class="btn" data-a="back">‹ Retour</button><span style="flex:1"></span><button class="btn" data-a="cancel">Annuler</button>`;
    } else {
      body=formHTML();
      foot=`${!initial&&mode==='day'?'<button class="btn" data-a="back">‹ Retour</button>':''}
        ${onDelete?'<button class="btn warn" data-a="delete">Supprimer</button>':''}
        <span style="flex:1"></span>
        ${mode==='day'?`<label class="sw" style="font-size:13.5px"><input type="checkbox" id="astpl" ${saveAsTpl?'checked':''}> Enregistrer aussi comme activité type</label>`:''}
        <button class="btn" data-a="cancel">Annuler</button><button class="btn pri" data-a="save">${initial?'Enregistrer':'Ajouter'}</button>`;
    }
    m.el.innerHTML=`<div class="mh"><h3>${esc(title())}</h3>${!initial&&mode==='day'?`<span class="steps">Étape ${step}/3</span>`:''}<button class="ico" data-a="cancel" title="Fermer">✕</button></div><div class="mb">${body}</div><div class="mf">${foot}</div>`;
    bind();
  }
  function tplCard(t){
    return `<button class="tpl" data-tpl="${esc(t.id)}"><div class="im">${actImage(t)}</div><div class="bd"><b>${esc(t.title)}</b><div class="mini-badges">${tplMeta(t).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></button>`;
  }
  function searchRes(){
    const qq=q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const r=library().filter(t=>(t.title+' '+(t.desc||'')+' '+(t.place||'')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(qq)).slice(0,12);
    return r.length?r.map(tplCard).join(''):'<p class="kbd">Aucune activité type trouvée.</p>';
  }
  function formHTML(){
    const c=CATS[f.cat]||CATS.jeux, t=f.timing, p=f.price;
    const seg=(name,val,opts)=>`<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${val===v?'on':''}">${l}</button>`).join('')}</div>`;
    return `<div class="form-grid">
      <div>
        <button class="vis-pick" id="pickvis" type="button">${actImage(f)}<span class="chg">🖼️ Changer l'image</span></button>
        <label class="fld"><span>Catégorie</span><select class="in" id="fcat">${Object.entries(CATS).map(([k,x])=>`<option value="${k}" ${k===f.cat?'selected':''}>${x.emoji} ${esc(x.label)}</option>`).join('')}</select></label>
        <label class="fld"><span>Public</span>${seg('publics',f.publics,[['tous','Tous'],['preados','Pré-ados'],['ados','Ados']])}</label>
        <label class="sw"><input type="checkbox" id="fmorning" ${f.morning?'checked':''}> ☀️ Activité du matin (en orange)</label>
        <label class="sw"><input type="checkbox" id="ffull" ${f.full?'checked':''}> Complet</label>
      </div>
      <div>
        <label class="fld"><span>Titre</span><input class="in" id="ftitle" value="${esc(f.title)}" placeholder="ex. Piscine à l'IloBulles de Contres" style="font-weight:800;font-size:17px"></label>
        <label class="fld"><span>Description (facultatif)</span><textarea class="in" id="fdesc" placeholder="Une phrase pour donner envie…">${esc(f.desc)}</textarea></label>
        <div class="box"><h4>🕑 Horaires</h4>${seg('tmode',t.mode,[['none','Sans horaire particulier'],['range','Début – fin'],['depart','Départ / retour']])}
          ${t.mode!=='none'?`<div class="row" style="margin-top:8px"><span class="kbd">${t.mode==='depart'?'Départ':'Début'}</span><input class="in t" type="time" id="tstart" value="${esc(t.start)}"><span class="kbd">${t.mode==='depart'?'Retour':'Fin'}</span><input class="in t" type="time" id="tend" value="${esc(t.end)}"></div>`:''}
          <label class="fld"><span>Lieu (facultatif)</span><input class="in" id="fplace" value="${esc(f.place)}" placeholder="ex. Salle des fêtes, gymnase…"></label>
        </div>
        <div class="box"><h4>🚍 Transport & 📋 réservation</h4>
          <label class="sw"><input type="checkbox" id="ftransport" ${f.transport?'checked':''}> Transport assuré par l'Espace jeunes</label>
          <label class="sw"><input type="checkbox" id="fclosed" ${f.closedDuring?'checked':''}> L'accueil est fermé pendant cette sortie</label>
          <div class="row"><label class="sw"><input type="checkbox" id="fbook" ${f.booking.on?'checked':''}> Sur réservation</label>${f.booking.on?`<input class="in t" type="number" min="0" id="fplaces" value="${esc(f.booking.places)}" placeholder="places" style="width:110px"> <span class="kbd">places</span>`:''}</div>
        </div>
        <div class="box"><h4>🤑 Tarif</h4>${seg('pmode',p.mode,[['free','Gratuit'],['single','Prix unique'],['ccv2cc','CCV2CC / hors comm.'],['qf','Selon QF / autre']])}
          ${p.mode==='single'?`<div class="row" style="margin-top:8px"><input class="in t" type="number" step="0.5" min="0" id="pamount" value="${esc(p.amount)}" style="width:110px"> €</div>`:''}
          ${p.mode==='ccv2cc'?`<div class="row" style="margin-top:8px"><span class="kbd">CCV2CC</span><input class="in t" type="number" step="0.5" min="0" id="pcc" value="${esc(p.cc)}" style="width:100px"> €<span class="kbd">Hors communauté</span><input class="in t" type="number" step="0.5" min="0" id="phc" value="${esc(p.hc)}" style="width:100px"> €</div>`:''}
          ${p.mode==='qf'?`<input class="in" id="ptext" style="margin-top:8px" value="${esc(p.text)}" placeholder="ex. CCV2CC ⩽ 900 : 200 € | ⩽ 1400 : 250 € | > 1400 : 300 €">`:''}
        </div>
        <div class="box"><h4>🎒 À prévoir (matériel, repas…)</h4>
          <div class="chips">${f.bring.map((x,i)=>`<span class="chipx">${esc(x)}<button type="button" data-rmb="${i}" aria-label="Retirer">✕</button></span>`).join('')||'<span class="kbd">Rien de particulier</span>'}</div>
          <div class="row" style="margin-top:8px"><input class="in" id="fbring" placeholder="Ajouter un élément puis Entrée"><button class="btn sm" type="button" id="addbring">Ajouter</button></div>
          <div class="sugg">${BRING_SUGG.filter(x=>!f.bring.includes(x)).map(x=>`<button type="button" data-sb="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>
        </div>
        <label class="fld"><span>📣 Précaution / information importante (en rouge)</span><input class="in red" id="fimp" value="${esc(f.important)}" placeholder="ex. Obligatoire : attestation de nage"></label>
      </div></div>`;
  }
  function bind(){
    const $=s=>m.el.querySelector(s), $$=s=>m.el.querySelectorAll(s);
    $$('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));
    $$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;step=2;draw()});
    const qi=$('#q');if(qi){qi.oninput=()=>{q=qi.value;$('#qres').innerHTML=q?searchRes():'';bindTpl()};}
    bindTpl();
    const bl=$('[data-blank]');if(bl)bl.onclick=()=>{f=blankActivity(cat);step=3;draw()};
    if(step!==3)return;
    const inp=(id,fn)=>{const e=$(id);if(e)e.oninput=()=>fn(e.value)};
    inp('#ftitle',v=>f.title=v);inp('#fdesc',v=>f.desc=v);inp('#fplace',v=>f.place=v);inp('#fimp',v=>f.important=v);
    inp('#tstart',v=>f.timing.start=v);inp('#tend',v=>f.timing.end=v);inp('#fplaces',v=>f.booking.places=v);
    inp('#pamount',v=>f.price.amount=v);inp('#pcc',v=>f.price.cc=v);inp('#phc',v=>f.price.hc=v);inp('#ptext',v=>f.price.text=v);
    const chk=(id,fn)=>{const e=$(id);if(e)e.onchange=()=>{fn(e.checked);draw()}};
    chk('#fmorning',v=>f.morning=v);chk('#ffull',v=>f.full=v);chk('#ftransport',v=>f.transport=v);chk('#fclosed',v=>f.closedDuring=v);chk('#fbook',v=>f.booking.on=v);
    const at=$('#astpl');if(at)at.onchange=()=>saveAsTpl=at.checked;
    $('#fcat').onchange=e=>{const old=f.cat;f.cat=e.target.value;if(!f.asset&&f.visual===(CATS[old]||{}).visual)f.visual=CATS[f.cat].visual;draw()};
    $$('[data-seg]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const k=sg.dataset.seg,v=b.dataset.v;
      if(k==='publics')f.publics=v;else if(k==='tmode')f.timing.mode=v;else if(k==='pmode')f.price.mode=v;
      draw();
    }));
    const addB=()=>{const e=$('#fbring');const v=e.value.trim();if(v&&!f.bring.includes(v)){f.bring.push(v);draw();m.el.querySelector('#fbring').focus()}};
    $('#addbring').onclick=addB;$('#fbring').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addB()}};
    $$('[data-sb]').forEach(b=>b.onclick=()=>{f.bring.push(b.dataset.sb);draw()});
    $$('[data-rmb]').forEach(b=>b.onclick=()=>{f.bring.splice(+b.dataset.rmb,1);draw()});
    $('#pickvis').onclick=()=>openImagePicker(f,()=>draw());
  }
  function bindTpl(){
    m.el.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{
      const t=library().find(x=>x.id===b.dataset.tpl);if(!t)return;
      f=normalize(t);f.templateId=t.id;f.id=uid();cat=f.cat;step=3;draw();
    });
  }
  async function action(a){
    if(a==='cancel')return m.close();
    if(a==='back'){step=step===3&&!initial?(cat?2:1):1;if(step===2&&!library().some(t=>t.cat===cat)&&false)step=1;draw();return}
    if(a==='delete'){if(await confirmBox('Supprimer « '+(f.title||'cette activité')+' » ?',{ok:'Supprimer',danger:true})){m.close();onDelete()}return}
    if(a==='save'){
      if(!f.title.trim()){toast('Donne un titre à l\'activité',true);m.el.querySelector('#ftitle').focus();return}
      f.title=f.title.trim();
      if(f.timing.mode==='none'){f.timing.start='';f.timing.end=''}
      const out=clone(f);
      m.close();onSave(out);
      if(saveAsTpl){const tpl=clone(out);tpl.id=uid();delete tpl.templateId;tpl.full=false;await saveTemplate(tpl);toast('Ajoutée aux activités types ✓')}
    }
  }
  draw();
}

/* ---------- Choix de l'image ---------- */
function openImagePicker(f,done){
  const cat=f.cat;
  const sugg=VIS_LIST.filter(v=>v[5].split(' ').includes(cat)).map(v=>v[0]);
  const others=VIS_LIST.map(v=>v[0]).filter(k=>!sugg.includes(k));
  const pick=k=>`<button class="pick${!f.asset&&f.visual===k?' on':''}" data-k="${k}">${visualSVG(k)}<span class="lb">${esc(VIS[k].label)}</span></button>`;
  const m=openModal(`<div class="mh"><h3>🖼️ Choisir l'image</h3><button class="ico" data-a="x">✕</button></div>
    <div class="mb">
      ${S.assets?`<div class="row" style="margin-bottom:6px"><label class="btn"><input type="file" accept="image/*" id="upl" hidden>📤 Importer ma propre image</label>${f.asset?`<span class="kbd">Image importée utilisée</span><button class="btn sm ghost" data-a="noasset">Revenir aux visuels</button>`:''}<span class="kbd" id="uplst"></span></div>`:''}
      <div class="sec-t">Suggérées pour « ${esc((CATS[cat]||{}).label||'')} »</div>
      <div class="pick-grid">${sugg.map(pick).join('')}</div>
      <div class="sec-t">Toutes les images</div>
      <div class="pick-grid">${others.map(pick).join('')}</div>
    </div>`);
  m.el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{f.visual=b.dataset.k;f.asset='';m.close();done()});
  m.el.querySelector('[data-a="x"]').onclick=()=>m.close();
  const na=m.el.querySelector('[data-a="noasset"]');if(na)na.onclick=()=>{f.asset='';m.close();done()};
  const up=m.el.querySelector('#upl');
  if(up)up.onchange=async()=>{
    const file=up.files[0];if(!file)return;
    const st=m.el.querySelector('#uplst');st.textContent='Envoi…';
    try{const r=await S.assets.upload(file);f.asset=r.id;m.close();done();toast('Image importée ✓')}
    catch(e){st.textContent='';toast('Import impossible ('+((e&&e.code)||'erreur')+')',true)}
  };
}

/* ---------- Bibliothèque d'activités types ---------- */
async function saveLibrary(items){
  S.library={items};
  await docSet('config/library',{items,updatedAt:new Date().toISOString()});
}
async function saveTemplate(t){
  const items=library().slice();const i=items.findIndex(x=>x.id===t.id);
  if(i>=0)items[i]=t;else items.push(t);
  try{await saveLibrary(items)}catch(e){}
}
const FILTERS=[
  ['transport','🚍 Avec transport',a=>a.transport],
  ['sanstransport','Sans transport',a=>!a.transport],
  ['payant','🤑 Payantes',a=>(a.price||{}).mode&&a.price.mode!=='free'],
  ['gratuit','Gratuites',a=>!(a.price||{}).mode||a.price.mode==='free'],
  ['resa','📋 Sur réservation',a=>a.booking&&a.booking.on],
  ['horaires','🕑 Avec horaires',a=>(a.timing||{}).mode&&a.timing.mode!=='none'],
  ['sanshoraire','Sans horaire',a=>!(a.timing||{}).mode||a.timing.mode==='none'],
  ['prevoir','🎒 Matériel à prévoir',a=>(a.bring||[]).length],
  ['precaution','📣 Précautions',a=>a.important]
];
function renderLibrary(main){
  if(!S.ready.library){main.innerHTML='<div class="loading">Chargement des activités types…</div>';return}
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

  if(UI.libQ)list=list.filter(a=>norm(a.title+' '+a.desc+' '+a.place).includes(norm(UI.libQ)));

    <div class="filters"><button class="fchip${UI.libCat==='all'?' on':''}" data-lc="all">Toutes</button>${Object.entries(CATS).map(([k,c])=>`<button class="fchip${UI.libCat===k?' on':''}" data-lc="${k}">${c.emoji} ${esc(c.label)} <span style="opacity:.6">${count(k)}</span></button>`).join('')}</div>
    <div class="filters">${FILTERS.map(([k,l])=>`<button class="fchip${UI.libFlt===k?' on':''}" data-lf="${k}">${l}</button>`).join('')}</div>
    ${!library().length?'<div class="note">La bibliothèque est vide. Crée une première activité type, ou coche « Enregistrer aussi comme activité type » quand tu ajoutes une activité dans une journée.</div>':''}
    <div class="tpl-grid">${list.map(t=>`<button class="tpl" data-id="${esc(t.id)}"><div class="im">${actImage(t)}</div><div class="bd"><small>${(CATS[t.cat]||{}).emoji||''} ${esc((CATS[t.cat]||{}).label||'')}</small><b>${esc(t.title)}</b><div class="mini-badges">${tplMeta(t).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></button>`).join('')}</div>
    ${library().length&&!list.length?'<p class="kbd">Aucune activité ne correspond à ces filtres.</p>':''}`;
  main.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{UI.libCat=b.dataset.lc;render()});
  main.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{UI.libFlt=UI.libFlt===b.dataset.lf?null:b.dataset.lf;render()});
  const lq=main.querySelector('#lq');lq.oninput=()=>{UI.libQ=lq.value;clearTimeout(lq._t);lq._t=setTimeout(()=>{render();const n=document.getElementById('lq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  main.querySelector('#newtpl').onclick=()=>{
    const m=openModal(`<div class="mh"><h3>Quelle catégorie ?</h3><button class="ico" data-x>✕</button></div><div class="mb"><div class="cat-grid">${Object.entries(CATS).map(([k,c])=>`<button class="cat-tile" data-cat="${k}" style="background:${c.color}"><span class="e">${c.emoji}</span><b>${esc(c.label)}</b></button>`).join('')}</div></div>`);
    m.el.querySelector('[data-x]').onclick=()=>m.close();
    m.el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{m.close();openComposer({mode:'template',initial:Object.assign(blankActivity(b.dataset.cat),{title:''}),onSave:t=>{saveTemplate(t).then(()=>{toast('Activité type enregistrée ✓');render()})}})});
  };
  main.querySelectorAll('.tpl[data-id]').forEach(b=>b.onclick=()=>{
    const t=library().find(x=>x.id===b.dataset.id);
    openComposer({mode:'template',initial:t,
      onSave:n=>{n.id=t.id;saveTemplate(n).then(()=>{toast('Activité type mise à jour ✓');render()})},
      onDelete:()=>{saveLibrary(library().filter(x=>x.id!==t.id)).then(()=>{toast('Activité type supprimée');render()}).catch(()=>{})}});
  });
}

/* ---------- Paramètres ---------- */
function renderSettings(main){
  if(!S.ready.settings){main.innerHTML='<div class="loading">Chargement des paramètres…</div>';return}
  if(!UI.setDraft)UI.setDraft=clone(settings());
  const st=UI.setDraft;
  st.info=st.info||{};st.periods=st.periods||[];st.holidays=st.holidays||[];st.weeks=st.weeks||emptySettings().weeks;
  const changed=JSON.stringify(st)!==JSON.stringify(settings());
  const pers=st.periods.map((p,i)=>({p,i})).sort((a,b)=>(a.p.start||'9')<(b.p.start||'9')?-1:1);
  main.innerHTML=`<div class="h-row"><h1>Paramètres</h1><span class="kbd">Ces réglages servent à pré-remplir le calendrier. Les journées déjà construites ne sont pas modifiées.</span></div>
  <div class="two">
   <div>
    ${window.EJ_CF?'<section class="panel" id="tokenpanel"></section>':''}
    <section class="panel"><h2>📅 Périodes scolaires et vacances</h2><p class="hint">Chaque jour du calendrier prend la semaine type de la période qui le contient.</p>
      <table class="ptable"><thead><tr><th>Type</th><th>Nom</th><th>Du</th><th>Au</th><th></th></tr></thead><tbody>
      ${pers.map(({p,i})=>`<tr data-pi="${i}"><td><select class="in t" data-pf="type"><option value="scolaire" ${p.type==='scolaire'?'selected':''}>🎒 Scolaire</option><option value="vacances" ${p.type==='vacances'?'selected':''}>🏖️ Vacances</option></select></td>
        <td><input class="in t" data-pf="name" value="${esc(p.name)}" style="width:100%"></td><td><input class="in t" type="date" data-pf="start" value="${esc(p.start)}"></td><td><input class="in t" type="date" data-pf="end" value="${esc(p.end)}"></td><td><button class="ico" data-pdel="${i}" title="Supprimer">🗑️</button></td></tr>`).join('')}
      </tbody></table>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-padd="scolaire">＋ Période scolaire</button><button class="btn sm" data-padd="vacances">＋ Vacances</button></div>
      ${overlapWarn(st.periods)}
    </section>
    <section class="panel"><h2>🚫 Jours de fermeture</h2><p class="hint">Jours fériés, fermetures exceptionnelles : ils sont pré-remplis « fermé ».</p>
      ${st.holidays.map((h,i)=>`<div class="row" style="margin-bottom:6px" data-hi="${i}"><input class="in t" type="date" data-hf="date" value="${esc(h.date)}"><input class="in" data-hf="label" value="${esc(h.label)}" placeholder="ex. Jour férié"><button class="ico" data-hdel="${i}">🗑️</button></div>`).join('')}
      <button class="btn sm" id="hadd">＋ Jour de fermeture</button>
    </section>
    ${window.EJ_CF?'<section class="panel" id="accespanel"><h2>👥 Accès des utilisateurs</h2><p class="hint">Chargement…</p></section>':''}
    ${window.EJ_CF?`<section class="panel"><h2>💾 Sauvegarde</h2><p class="hint">Télécharge une copie complète (paramètres, activités types, brouillons, journées en ligne) à garder sur ton ordinateur. La restauration remplace tout le contenu actuel.</p>
      <div class="row"><button class="btn" id="bkdl">⬇️ Télécharger une sauvegarde</button><label class="btn warn"><input type="file" accept="application/json,.json" id="bkup" hidden>↩️ Restaurer une sauvegarde…</label></div></section>`:''}
    <section class="panel"><h2>ℹ️ Informations publiques</h2><p class="hint">Affichées sur la page publique (bouton « Infos »).</p>
      <label class="fld"><span>Nom</span><input class="in" data-if="name" value="${esc(st.info.name)}"></label>
      <label class="fld"><span>Sous-titre</span><input class="in" data-if="sub" value="${esc(st.info.sub)}"></label>
      <label class="fld"><span>Infos pratiques (tranches d'âge, inscription, règlement…)</span><textarea class="in" data-if="text" style="min-height:150px">${esc(st.info.text)}</textarea></label>
      <div class="row"><label class="fld" style="flex:1"><span>Téléphone</span><input class="in" data-if="phone" value="${esc(st.info.phone)}"></label><label class="fld" style="flex:1"><span>E-mail</span><input class="in" data-if="email" value="${esc(st.info.email)}"></label></div>
      <label class="fld"><span>Adresse</span><input class="in" data-if="address" value="${esc(st.info.address)}"></label>
      <label class="fld"><span>Mention en bas de page</span><input class="in" data-if="footer" value="${esc(st.info.footer)}"></label>
    </section>
   </div>
   <div>
    ${weekPanel(st,'scolaire','🎒 Semaine type — période scolaire')}
    ${weekPanel(st,'vacances','🏖️ Semaine type — vacances')}
   </div>
  </div>
  <div class="sticky-save">${changed?'<button class="btn" id="sreset">Annuler les modifications</button>':''}<button class="btn pri" id="ssave" ${changed?'':'disabled'}>${changed?'💾 Enregistrer les paramètres':'✓ Paramètres enregistrés'}</button></div>`;
  bindSettings(main,st);
}
function overlapWarn(ps){
  const s=ps.filter(p=>p.start&&p.end).slice().sort((a,b)=>a.start<b.start?-1:1);const w=[];
  for(let i=1;i<s.length;i++)if(s[i].start<=s[i-1].end)w.push(`« ${esc(s[i-1].name)} » et « ${esc(s[i].name)} » se chevauchent`);
  ps.forEach(p=>{if(p.start&&p.end&&p.end<p.start)w.push(`« ${esc(p.name)} » : la fin est avant le début`)});
  return w.length?`<div class="note" style="margin:10px 0 0">⚠️ ${w.join('<br>⚠️ ')}</div>`:'';
}
function weekPanel(st,type,title){
  const wk=st.weeks[type];
  return `<section class="panel" data-wt="${type}"><h2>${title}</h2><p class="hint">Horaires d'ouverture de l'accueil, jour par jour. Plusieurs périodes possibles (ex. accueil + soirée).</p>
    ${wk.map((d,i)=>`<div class="wk" data-wd="${i}"><span class="dn">${cap(DAYS[i])}</span>
      <label class="sw" style="font-size:13px"><input type="checkbox" data-wopen ${d.open?'checked':''}></label>
      <div class="sl">${d.open?(d.slots.map((s,j)=>`<div class="row" data-ws="${j}"><input class="in t" type="time" data-wf="start" value="${esc(s.start)}">–<input class="in t" type="time" data-wf="end" value="${esc(s.end)}"><input class="in t" data-wf="label" value="${esc(s.label)}" placeholder="Nom" style="width:110px"><button class="ico" data-wsdel="${j}">✕</button></div>`).join('')+`<button class="btn sm ghost" data-wsadd style="align-self:flex-start">＋ période</button>`):'<span class="kbd" style="padding-top:6px">Fermé</span>'}</div></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-copyfrom="${type}">Copier le mercredi sur tous les jours ouverts</button></div>
  </section>`;
}
function bindSettings(main,st){
  const rerender=()=>render();
  const changedBtn=()=>{const b=main.querySelector('#ssave');if(b){b.disabled=false;b.textContent='💾 Enregistrer les paramètres'}};
  main.querySelectorAll('[data-pi]').forEach(tr=>{const p=st.periods[+tr.dataset.pi];tr.querySelectorAll('[data-pf]').forEach(e=>{e.oninput=e.onchange=()=>{p[e.dataset.pf]=e.value;changedBtn()};e.onblur=()=>{if(e.type==='date'||e.tagName==='SELECT')rerender()}})});
  main.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{st.periods.splice(+b.dataset.pdel,1);rerender()});
  main.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{st.periods.push({id:uid(),type:b.dataset.padd,name:b.dataset.padd==='vacances'?'Vacances':'Période scolaire',start:'',end:''});rerender()});
  main.querySelectorAll('[data-hi]').forEach(r=>{const h=st.holidays[+r.dataset.hi];r.querySelectorAll('[data-hf]').forEach(e=>e.oninput=()=>{h[e.dataset.hf]=e.value;changedBtn()})});
  main.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{st.holidays.splice(+b.dataset.hdel,1);rerender()});
  main.querySelector('#hadd').onclick=()=>{st.holidays.push({date:'',label:'Jour férié'});rerender()};
  main.querySelectorAll('[data-if]').forEach(e=>e.oninput=()=>{st.info[e.dataset.if]=e.value;changedBtn()});
  main.querySelectorAll('[data-wt]').forEach(sec=>{
    const wk=st.weeks[sec.dataset.wt];
    sec.querySelectorAll('[data-wd]').forEach(row=>{
      const d=wk[+row.dataset.wd];
      row.querySelector('[data-wopen]').onchange=e=>{d.open=e.target.checked;if(d.open&&!d.slots.length)d.slots.push({start:'14:00',end:'18:00',label:''});rerender()};
      row.querySelectorAll('[data-ws]').forEach(r=>{const s=d.slots[+r.dataset.ws];r.querySelectorAll('[data-wf]').forEach(e=>e.oninput=()=>{s[e.dataset.wf]=e.value;changedBtn()})});
      row.querySelectorAll('[data-wsdel]').forEach(b=>b.onclick=()=>{d.slots.splice(+b.dataset.wsdel,1);if(!d.slots.length)d.open=false;rerender()});
      const a=row.querySelector('[data-wsadd]');if(a)a.onclick=()=>{const l=d.slots[d.slots.length-1];d.slots.push({start:l?l.end:'14:00',end:'',label:''});rerender()};
    });
    sec.querySelector('[data-copyfrom]').onclick=()=>{const src=wk[2];if(!src.open){toast('Le mercredi est fermé dans cette semaine type',true);return}wk.forEach((d,i)=>{if(i!==2&&d.open)d.slots=clone(src.slots)});rerender()};
  });
  const tp=main.querySelector('#tokenpanel');if(tp)window.EJ_CF.mountToken(tp,{toast,confirmBox});
  const ap=main.querySelector('#accespanel');if(ap)window.EJ_CF.mountAccess(ap,{toast,confirmBox});
  const bk=main.querySelector('#bkdl');if(bk)bk.onclick=()=>window.EJ_CF.backup().then(()=>toast('Sauvegarde téléchargée ✓')).catch(()=>toast('Sauvegarde impossible',true));
  const bu=main.querySelector('#bkup');if(bu)bu.onchange=async()=>{const f=bu.files[0];bu.value='';if(!f)return;
    if(!await confirmBox('Remplacer TOUT le contenu actuel par cette sauvegarde ? Pense à télécharger une sauvegarde de l\'état actuel avant.',{ok:'Restaurer',danger:true}))return;
    try{const n=await window.EJ_CF.restore(f);toast(n+' éléments restaurés — rechargement…');setTimeout(()=>location.reload(),1200)}catch(e){toast('Restauration impossible : '+e.message,true)}};
  const rs=main.querySelector('#sreset');if(rs)rs.onclick=()=>{UI.setDraft=null;rerender()};
  main.querySelector('#ssave').onclick=async()=>{
    const out=clone(st);out.updatedAt=new Date().toISOString();
    try{await docSet('config/settings',out);S.settings=out;UI.setDraft=null;toast('Paramètres enregistrés ✓');rerender()}catch(e){}
  };
}

/* ---------- Aperçu mobile ---------- */
function renderPreview(main){
  const days={};
  const src=UI.previewDrafts?Object.assign({},S.pub,Object.fromEntries(Object.entries(S.drafts).map(([k,v])=>[k,v]))):S.pub;
  Object.keys(src).forEach(k=>days[k]=src[k]);
  main.innerHTML=`<div class="h-row"><h1>Aperçu de la page publique</h1><span style="flex:1"></span>
    <div class="seg" id="pvseg"><button data-v="1" class="${UI.previewDrafts?'on':''}">Avec les brouillons</button><button data-v="0" class="${UI.previewDrafts?'':'on'}">Seulement ce qui est en ligne</button></div>
    ${S.downloads?'<button class="btn" id="export">⬇️ Exporter la page publique (HTML)</button>':''}<button class="btn" id="copylink">🔗 Lien de la page publique</button></div>
    ${window.EJ_GH?`<div class="note">Page publique : <b>${esc(location.href.split('#')[0])}</b> — accessible à tous, sans compte. Une journée mise en ligne y apparaît immédiatement.</div>`:`<div class="note">Les familles voient la page publique en ouvrant le lien de cette application sans être éditrices. <b>Attention :</b> sur claude.ai, il faut être connecté à un compte Claude pour lire les données. Pour une diffusion sans compte, utilise « Exporter la page publique » et héberge le fichier obtenu.</div>`}
    <div class="phone" id="phone"><div id="pvroot"></div></div>`;
  mountPublic(main.querySelector('#pvroot'),{days,settings:{info:settings().info,periods:settings().periods}},{scroller:main.querySelector('#phone')});
  main.querySelectorAll('#pvseg button').forEach(b=>b.onclick=()=>{UI.previewDrafts=b.dataset.v==='1';render()});
  main.querySelector('#copylink').onclick=async()=>{
    const url=location.href.split('#')[0]+'#programme';
    try{await navigator.clipboard.writeText(url);toast('Lien copié ✓')}catch(e){toast('Copie impossible : '+url,true)}
  };
  const ex=main.querySelector('#export');if(ex)ex.onclick=exportPublic;
}
async function exportPublic(){
  const css=document.getElementById('public-css').textContent;
  const lib=document.getElementById('public-lib').textContent;
  const data={days:S.pub,settings:{info:settings().info,periods:settings().periods}};
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(settings().info.name||'Espace jeunes')} — le Programme</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet"><style>${css}</style></head><body><div id="app"></div><script>${lib}<\/script><script>EJ.mountPublic(document.getElementById('app'),${json},{noAssets:true});<\/script></body></html>`;
  try{await S.downloads.save({filename:'programme-espace-jeunes.html',data:html});toast('Fichier exporté ✓')}
  catch(e){toast('Export annulé ou impossible',true)}
}

/* ---------- Démarrage ---------- */
async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.ready.pub=true;S.ready.settings=true;renderPublicOnly();return}
  const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
  S.db=db;S.user=user;
  if(!db){app.innerHTML='<div class="pub"><div class="pub-empty">Connecte-toi à ton compte Claude pour voir le programme.</div></div>';return}
  try{S.canEdit=user?!!(await user.canEdit()):false}catch(e){S.canEdit=false}
  if(S.canEdit){
    [S.assets,S.downloads]=await Promise.all([cl.use('assets'),cl.use('downloads')]);
  }
  const timer=setTimeout(()=>{S.stale=true;Object.keys(S.ready).forEach(k=>S.ready[k]=true);render()},10000);
  const done=()=>{if(S.ready.settings&&S.ready.pub&&(!S.canEdit||(S.ready.drafts&&S.ready.library)))clearTimeout(timer)};
  const err=k=>e=>{S.ready[k]=true;if(e&&e.code!=='revoked')S.stale=true;render()};
  db.doc('config/settings').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.ready.settings=true;done();if(UI.view!=='parametres'||!UI.setDraft)rerenderSoft()},err('settings'));
  db.collection('public').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.pub=o;S.ready.pub=true;done();rerenderSoft()},err('pub'));
  if(S.canEdit){
    db.collection('drafts').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.drafts=o;S.ready.drafts=true;done();rerenderSoft()},err('drafts'));
    db.doc('config/library').onSnapshot(s=>{S.library=s.exists?s.data():{items:[]};S.ready.library=true;done();rerenderSoft()},err('library'));
  }
  route();
}
let softT;
function rerenderSoft(){
  // ne pas reconstruire l'écran sous une modale ou pendant une saisie dans le panneau
  clearTimeout(softT);softT=setTimeout(()=>{
    if(modals.length)return;
    if(UI.drawer){refreshDrawerStatus();const main=document.getElementById('crmain');if(main&&UI.view==='createur')renderCalendar(main);return}
    const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,select')&&app.contains(a))return;
    render();
  },60);
}
boot();
})();
</script>
